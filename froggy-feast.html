<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Froggy Feast - Slurp the Flies!</title>
    <meta name="description" content="So many flies, one very hungry frog! Tap the flies to slurp them up, unlock frog friends and play from sunny morning to firefly night.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- fonts load in the background so a slow connection never holds up the game -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@700;800;900&display=swap" media="print" onload="this.media='all'">
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@700;800;900&display=swap"></noscript>
    <script defer src="assets/froggy-feast/logic.js"></script>
    <script defer src="assets/froggy-feast/game.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        :root {
            --leaf: #4cbb3f;
            --leaf-dark: #2f8a2b;
            --leaf-deep: #1f6a22;
            --cream: #fffbea;
            --ink: #24452a;
            --pink: #ff6f9a;
            --sun: #ffcd3c;
            --sky: #7cc8ff;
        }

        [hidden] { display: none !important; }

        html, body { height: 100%; overflow: hidden; overscroll-behavior: none; }

        body {
            font-family: 'Nunito', sans-serif;
            background: #7cc8ff;
            color: var(--ink);
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }

        #pond { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: crosshair; touch-action: none; }

        /* ---------- top bar ---------- */
        .chip {
            position: fixed;
            top: max(12px, env(safe-area-inset-top));
            z-index: 30;
            display: flex;
            align-items: center;
            gap: 7px;
            height: 48px;
            padding: 0 17px;
            border: 3px solid #fff;
            border-radius: 26px;
            background: linear-gradient(180deg, #ffffff, #effbe4);
            color: var(--leaf-deep);
            font: 900 0.95rem 'Nunito', sans-serif;
            text-decoration: none;
            box-shadow: 0 5px 0 rgba(31, 106, 34, 0.25), 0 10px 22px rgba(0, 0, 0, 0.16);
            cursor: pointer;
        }

        .chip:active { transform: translateY(3px); box-shadow: 0 2px 0 rgba(31, 106, 34, 0.25); }
        .chip:focus-visible, button:focus-visible { outline: 4px solid #ffcd3c; outline-offset: 3px; }

        .home-btn { left: max(12px, env(safe-area-inset-left)); }
        .round-btn { width: 48px; padding: 0; justify-content: center; font-size: 1.25rem; }
        .sound-btn { right: max(12px, env(safe-area-inset-right)); }
        .pause-btn { right: calc(max(12px, env(safe-area-inset-right)) + 58px); }

        .hud {
            position: fixed;
            top: max(12px, env(safe-area-inset-top));
            left: 50%;
            transform: translateX(-50%);
            z-index: 25;
            display: flex;
            gap: 10px;
            pointer-events: none;
            transition: opacity 0.3s, transform 0.3s;
        }

        .hud.hidden { opacity: 0; transform: translate(-50%, -20px); }

        .pill {
            display: flex;
            align-items: center;
            gap: 8px;
            height: 48px;
            padding: 0 18px;
            border: 3px solid #fff;
            border-radius: 26px;
            background: linear-gradient(180deg, rgba(255,255,255,0.98), rgba(239,251,228,0.95));
            color: var(--leaf-deep);
            font: 800 1.45rem 'Baloo 2', cursive;
            box-shadow: 0 5px 0 rgba(31, 106, 34, 0.22), 0 10px 22px rgba(0, 0, 0, 0.14);
            white-space: nowrap;
        }

        .pill .icon { font-size: 1.25rem; }
        .pill.bump { animation: bump 0.32s ease; }
        @keyframes bump { 40% { transform: scale(1.18); } }

        .level-pill { gap: 10px; font-size: 1.05rem; }
        .tummy {
            position: relative;
            width: 92px;
            height: 16px;
            border-radius: 10px;
            background: #dcefd0;
            box-shadow: inset 0 2px 3px rgba(0,0,0,0.12);
            overflow: hidden;
        }
        .tummy-fill {
            position: absolute; inset: 0 auto 0 0;
            width: 0%;
            border-radius: 10px;
            background: linear-gradient(90deg, #ff9bb7, #ff6f9a);
            transition: width 0.35s cubic-bezier(.3,1.6,.5,1);
        }
        .tummy-fill::after {
            content: ''; position: absolute; left: 6px; right: 6px; top: 3px; height: 4px;
            border-radius: 4px; background: rgba(255,255,255,0.55);
        }

        .timer-pill.hurry { color: #e0435f; animation: hurry 0.5s ease-in-out infinite alternate; }
        @keyframes hurry { to { transform: scale(1.1); } }

        /* ---------- banner + toast ---------- */
        .banner {
            position: fixed;
            left: 50%;
            top: 30%;
            z-index: 20;
            transform: translate(-50%, -50%);
            text-align: center;
            pointer-events: none;
            opacity: 0;
        }
        .banner.show { animation: banner 2.1s cubic-bezier(.2,1.4,.4,1) forwards; }
        @keyframes banner {
            0% { opacity: 0; transform: translate(-50%, -50%) scale(0.4) rotate(-6deg); }
            14% { opacity: 1; transform: translate(-50%, -50%) scale(1.08) rotate(2deg); }
            24% { transform: translate(-50%, -50%) scale(1) rotate(0); }
            80% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
            100% { opacity: 0; transform: translate(-50%, -62%) scale(0.92); }
        }
        .banner-main {
            font: 800 clamp(2.4rem, 7vw, 4.6rem)/1 'Baloo 2', cursive;
            color: #fff;
            -webkit-text-stroke: 10px var(--leaf-deep);
            paint-order: stroke fill;
            text-shadow: 0 7px 0 rgba(0,0,0,0.2);
            white-space: nowrap;
        }
        .banner-sub {
            display: inline-block;
            margin-top: 10px;
            padding: 5px 18px;
            border-radius: 20px;
            background: rgba(255,255,255,0.92);
            color: var(--leaf-deep);
            font: 800 clamp(1rem, 2.6vw, 1.35rem) 'Baloo 2', cursive;
            box-shadow: 0 4px 0 rgba(0,0,0,0.12);
        }

        .toast {
            position: fixed;
            left: 50%;
            bottom: max(18px, env(safe-area-inset-bottom));
            z-index: 40;
            transform: translate(-50%, 140%);
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 22px 10px 12px;
            border: 4px solid #fff;
            border-radius: 30px;
            background: linear-gradient(180deg, #fff6c9, #ffe27a);
            color: #7a4b00;
            font: 800 1.15rem 'Baloo 2', cursive;
            box-shadow: 0 6px 0 rgba(122,75,0,0.25), 0 14px 30px rgba(0,0,0,0.2);
            transition: transform 0.45s cubic-bezier(.2,1.5,.4,1);
            pointer-events: none;
        }
        .toast.show { transform: translate(-50%, 0); }
        .toast canvas { width: 54px; height: 50px; }

        /* ---------- menu + results ---------- */
        .overlay {
            position: fixed;
            inset: 0;
            z-index: 50;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: calc(max(12px, env(safe-area-inset-top)) + 60px) 16px max(16px, env(safe-area-inset-bottom));
            background: radial-gradient(ellipse at center, rgba(20, 60, 30, 0.08), rgba(20, 60, 30, 0.32));
            transition: opacity 0.35s;
        }
        .overlay[hidden] { display: none; }

        .card {
            position: relative;
            width: min(560px, 100%);
            max-height: 100%;
            overflow-y: auto;
            padding: 26px 26px 22px;
            border: 5px solid #fff;
            border-radius: 34px;
            background: linear-gradient(180deg, rgba(255,253,240,0.97), rgba(240,251,226,0.97));
            box-shadow: 0 10px 0 rgba(31, 106, 34, 0.25), 0 24px 60px rgba(0,0,0,0.28);
            text-align: center;
            animation: cardIn 0.5s cubic-bezier(.2,1.4,.4,1);
            touch-action: pan-y;
            scrollbar-width: none;
        }
        .card::-webkit-scrollbar { display: none; }
        @keyframes cardIn { from { opacity: 0; transform: translateY(30px) scale(0.92); } }

        .logo {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 0 14px;
            font: 800 clamp(2.9rem, 10vw, 4.4rem)/0.95 'Baloo 2', cursive;
            letter-spacing: 0.5px;
        }
        .logo .word { display: inline-flex; }
        .logo .ch {
            display: inline-block;
            color: #fff;
            -webkit-text-stroke: 11px var(--leaf-deep);
            paint-order: stroke fill;
            text-shadow: 0 6px 0 rgba(31,106,34,0.35);
            animation: wiggle 2.4s ease-in-out infinite;
        }
        .logo .feast .ch { -webkit-text-stroke-color: #d6416d; text-shadow: 0 6px 0 rgba(214,65,109,0.35); }
        @keyframes wiggle { 0%, 100% { transform: translateY(0) rotate(0); } 50% { transform: translateY(-5px) rotate(-3deg); } }

        .tagline { margin: 10px 0 18px; font-size: 1.08rem; font-weight: 800; color: #4f7a45; }

        .modes { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

        .mode-btn {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            padding: 14px 10px 13px;
            border: 4px solid #fff;
            border-radius: 24px;
            color: #fff;
            font-family: 'Baloo 2', cursive;
            cursor: pointer;
            transition: transform 0.15s;
        }
        .mode-btn:hover { transform: translateY(-3px); }
        .mode-btn:active { transform: translateY(4px); }
        .mode-btn.forever { background: linear-gradient(180deg, #6fdc5a, #3aa532); box-shadow: 0 7px 0 #24782a, 0 12px 22px rgba(0,0,0,0.2); }
        .mode-btn.quick { background: linear-gradient(180deg, #ffb35c, #ff7a3d); box-shadow: 0 7px 0 #c2522a, 0 12px 22px rgba(0,0,0,0.2); }
        .mode-btn:active { box-shadow: 0 3px 0 rgba(0,0,0,0.25); }
        .mode-emoji { font-size: 2rem; line-height: 1.1; filter: drop-shadow(0 3px 0 rgba(0,0,0,0.15)); }
        .mode-name { font-size: 1.4rem; font-weight: 800; line-height: 1.1; text-shadow: 0 2px 0 rgba(0,0,0,0.18); }
        .mode-sub { font: 800 0.86rem 'Nunito', sans-serif; opacity: 0.95; }

        .section-title { margin: 20px 0 10px; font: 800 1.2rem 'Baloo 2', cursive; color: var(--leaf-dark); }

        .frog-list { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; }
        .frog-btn {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 6px 2px 5px;
            border: 3px solid transparent;
            border-radius: 18px;
            background: rgba(255,255,255,0.75);
            color: var(--ink);
            font: 800 0.72rem 'Nunito', sans-serif;
            cursor: pointer;
            box-shadow: 0 3px 0 rgba(0,0,0,0.08);
            transition: transform 0.15s, border-color 0.15s;
        }
        .frog-btn:hover:not(:disabled) { transform: translateY(-3px); }
        .frog-btn canvas { width: 100%; max-width: 70px; aspect-ratio: 12 / 11; }
        .frog-btn.selected { border-color: var(--leaf); background: #fff; box-shadow: 0 0 0 4px rgba(76,187,63,0.25), 0 3px 0 rgba(0,0,0,0.08); }
        .frog-btn.selected::after {
            content: '✓'; position: absolute; top: -8px; right: -6px;
            width: 22px; height: 22px; border-radius: 50%;
            background: var(--leaf); color: #fff; font-size: 0.8rem; line-height: 22px;
            border: 2px solid #fff;
        }
        .frog-btn:disabled { cursor: default; color: #8a9a86; }
        .frog-btn:disabled canvas { filter: grayscale(1) brightness(1.15) opacity(0.45); }
        .frog-btn .lock {
            position: absolute; top: 22%; left: 50%; transform: translateX(-50%);
            font-size: 1.3rem; filter: drop-shadow(0 2px 0 rgba(0,0,0,0.15));
        }
        .frog-name { margin-top: 1px; line-height: 1.1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }

        .unlock-hint { min-height: 1.3em; margin-top: 10px; font-weight: 800; font-size: 0.92rem; color: #6c8a63; }
        .unlock-bar { width: 70%; height: 10px; margin: 6px auto 0; border-radius: 6px; background: #dcefd0; overflow: hidden; }
        .unlock-bar div { height: 100%; width: 0; border-radius: 6px; background: linear-gradient(90deg, #ffd23f, #ff9a3d); }

        .how {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            margin-top: 16px;
            font-size: 0.86rem;
            font-weight: 800;
            color: #557b4c;
        }
        .how span { padding: 5px 12px; border-radius: 14px; background: rgba(76,187,63,0.12); }
        kbd {
            display: inline-block; min-width: 22px; padding: 0 5px; border-radius: 6px;
            background: #fff; border: 2px solid #cfe6c4; border-bottom-width: 3px;
            font: 900 0.78rem 'Nunito', sans-serif; color: var(--leaf-deep);
        }

        .results-card { width: min(440px, 100%); padding-top: 30px; }
        .result-stars { display: flex; justify-content: center; gap: 8px; font-size: 3.2rem; line-height: 1; }
        .result-stars span { color: #e3e9de; -webkit-text-stroke: 3px #fff; paint-order: stroke fill; filter: drop-shadow(0 4px 0 rgba(0,0,0,0.12)); transform: scale(0.6); transition: transform 0.4s cubic-bezier(.2,1.8,.4,1), color 0.2s; }
        .result-stars span.lit { color: #ffcd3c; transform: scale(1); }
        .result-stars span:nth-child(2) { transform: translateY(-12px) scale(0.6); font-size: 3.9rem; }
        .result-stars span:nth-child(2).lit { transform: translateY(-12px) scale(1); }
        .result-title { margin-top: 8px; font: 800 2.2rem/1.1 'Baloo 2', cursive; color: var(--leaf-dark); }
        .result-score { margin: 8px 0 2px; font: 800 4.2rem/1 'Baloo 2', cursive; color: #d6416d; }
        .result-score small { display: block; font-size: 1.05rem; color: #8c6a73; }
        .result-best { min-height: 1.4em; font-weight: 900; color: #6c8a63; }
        .result-best.new { color: #e0821a; animation: bump 0.6s ease 0.4s 2; }
        .actions { display: flex; gap: 10px; justify-content: center; margin-top: 18px; flex-wrap: wrap; }
        .btn {
            padding: 12px 26px;
            border: 4px solid #fff;
            border-radius: 26px;
            font: 800 1.25rem 'Baloo 2', cursive;
            cursor: pointer;
            transition: transform 0.15s;
        }
        .btn:active { transform: translateY(4px); }
        .btn.primary { background: linear-gradient(180deg, #6fdc5a, #3aa532); color: #fff; box-shadow: 0 6px 0 #24782a; text-shadow: 0 2px 0 rgba(0,0,0,0.15); }
        .btn.secondary { background: #fff; color: var(--leaf-dark); box-shadow: 0 6px 0 rgba(31,106,34,0.25); }

        @media (max-width: 560px) {
            .chip { height: 42px; padding: 0 13px; font-size: 0.85rem; }
            .round-btn { width: 42px; }
            .pause-btn { right: calc(max(12px, env(safe-area-inset-right)) + 50px); }
            .home-btn .label { display: none; }
            .pill { height: 42px; padding: 0 12px; font-size: 1.2rem; }
            .hud { top: calc(max(12px, env(safe-area-inset-top)) + 50px); }
            .level-pill { font-size: 0.95rem; }
            .tummy { width: 60px; }
            .card { padding: 20px 16px 18px; border-radius: 28px; }
            .frog-list { grid-template-columns: repeat(3, 1fr); }
            .mode-name { font-size: 1.15rem; }
            .mode-sub { font-size: 0.75rem; }
            .overlay { padding-top: calc(max(12px, env(safe-area-inset-top)) + 54px); }
        }

        /* phones and tablets: no keyboard tips */
        @media (hover: none) and (pointer: coarse) {
            .keys-hint { display: none; }
        }

        /* short screens, e.g. a phone turned sideways */
        @media (max-height: 520px) {
            .overlay { padding-top: calc(max(8px, env(safe-area-inset-top)) + 56px); padding-bottom: 8px; }
            .card { padding: 12px 18px 12px; border-radius: 24px; width: min(640px, 100%); }
            .logo { font-size: 2.3rem; }
            .logo .ch { -webkit-text-stroke-width: 8px; }
            .tagline, .how, .unlock-bar { display: none; }
            .modes { margin-top: 10px; }
            .mode-btn { flex-direction: row; justify-content: center; gap: 8px; padding: 8px 10px; flex-wrap: wrap; }
            .mode-emoji { font-size: 1.4rem; }
            .mode-name { font-size: 1.2rem; }
            .mode-sub { width: 100%; font-size: 0.78rem; }
            .section-title { margin: 10px 0 6px; font-size: 1rem; }
            .frog-list { grid-template-columns: repeat(6, 1fr); }
            .frog-btn canvas { max-width: 52px; }
            .unlock-hint { margin-top: 6px; font-size: 0.8rem; }
            .results-card { padding-top: 14px; }
            .result-stars { font-size: 2.2rem; }
            .result-stars span:nth-child(2) { font-size: 2.6rem; }
            .result-title { font-size: 1.6rem; margin-top: 2px; }
            .result-score { font-size: 2.8rem; margin: 4px 0 0; }
            .actions { margin-top: 10px; }
            .btn { padding: 8px 22px; font-size: 1.1rem; }
            .banner { top: 34%; }
        }

        @media (prefers-reduced-motion: reduce) {
            .logo .ch, .timer-pill.hurry { animation: none; }
        }
    </style>
</head>
<body>
    <canvas id="pond" aria-label="A pond with a hungry frog and lots of flies"></canvas>

    <a href="index.html" class="chip home-btn" aria-label="Back to all games">🏠 <span class="label">Games</span></a>
    <button id="pauseBtn" class="chip round-btn pause-btn" type="button" aria-label="Menu" hidden>⏸</button>
    <button id="soundBtn" class="chip round-btn sound-btn" type="button" aria-label="Sound on">🔊</button>

    <div id="hud" class="hud hidden" aria-live="polite">
        <div id="scorePill" class="pill"><span class="icon">🪰</span><span id="score">0</span></div>
        <div id="levelPill" class="pill level-pill"><span id="level">Lv 1</span><div class="tummy" aria-hidden="true"><div id="tummy" class="tummy-fill"></div></div></div>
        <div id="timerPill" class="pill timer-pill" hidden><span class="icon">⏱️</span><span id="time">60</span></div>
    </div>

    <div id="banner" class="banner" aria-live="polite"><div id="bannerMain" class="banner-main"></div><div id="bannerSub" class="banner-sub"></div></div>
    <div id="toast" class="toast" aria-live="polite"><canvas id="toastFrog" width="108" height="100"></canvas><span id="toastText"></span></div>

    <div id="menu" class="overlay">
        <div class="card">
            <h1 class="logo" aria-label="Froggy Feast">
                <span class="word froggy"><span class="ch">F</span><span class="ch">r</span><span class="ch">o</span><span class="ch">g</span><span class="ch">g</span><span class="ch">y</span></span>
                <span class="word feast"><span class="ch">F</span><span class="ch">e</span><span class="ch">a</span><span class="ch">s</span><span class="ch">t</span></span>
            </h1>
            <p class="tagline">So many flies… and one very hungry frog!</p>
            <div class="modes">
                <button id="playForever" class="mode-btn forever" type="button">
                    <span class="mode-emoji">🌿</span>
                    <span class="mode-name">Forever Feast</span>
                    <span class="mode-sub">The flies never stop!</span>
                </button>
                <button id="playQuick" class="mode-btn quick" type="button">
                    <span class="mode-emoji">⏱️</span>
                    <span class="mode-name">Quick Snack</span>
                    <span class="mode-sub">1 minute · Best <b id="bestQuick">0</b></span>
                </button>
            </div>
            <h2 class="section-title">Pick your frog</h2>
            <div id="frogList" class="frog-list"></div>
            <p id="unlockHint" class="unlock-hint"></p>
            <div id="unlockBar" class="unlock-bar"><div></div></div>
            <div class="how">
                <span>👆 Tap a fly to slurp it!</span>
                <span class="keys-hint"><kbd>←</kbd> <kbd>→</kbd> aim · <kbd>Space</kbd> slurp</span>
            </div>
        </div>
    </div>

    <div id="results" class="overlay" hidden>
        <div class="card results-card">
            <div id="resultStars" class="result-stars" aria-hidden="true"><span>★</span><span>★</span><span>★</span></div>
            <h2 id="resultTitle" class="result-title">Yum, yum!</h2>
            <p class="result-score"><span id="resultScore">0</span><small>yum points in one minute</small></p>
            <p id="resultBest" class="result-best"></p>
            <div class="actions">
                <button id="againBtn" class="btn primary" type="button">Play again</button>
                <button id="menuBtn" class="btn secondary" type="button">Menu</button>
            </div>
        </div>
    </div>

    <noscript><p style="position:fixed;inset:auto 0 40%;text-align:center;font-weight:900">Turn on JavaScript to feed the frog!</p></noscript>
</body>
</html>
