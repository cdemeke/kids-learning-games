    <script>
'use strict';
/* ====================================================================
   PUZZLE LOGIC (pure: no DOM) - simulate, BFS solver, generator
   ==================================================================== */
const DIRS = [
    { dr: -1, dc: 0, name: 'up' },
    { dr: 0, dc: 1, name: 'right' },
    { dr: 1, dc: 0, name: 'down' },
    { dr: 0, dc: -1, name: 'left' }
];
const ARROW_DIR = { '^': 0, '>': 1, 'v': 2, '<': 3 };
const WARP_CHARS = '123';

function setCh(s, i, ch) { return s.slice(0, i) + ch + s.slice(i + 1); }

function parseLevel(rows) {
    const h = rows.length, w = rows[0].length;
    let g = '', start = 0;
    const warpIdx = {};
    for (let r = 0; r < h; r++) {
        for (let c = 0; c < w; c++) {
            let ch = rows[r][c] || '~';
            if (ch === ' ') ch = '~';
            const i = r * w + c;
            if (ch === 'P') { start = i; ch = '.'; }
            if (WARP_CHARS.includes(ch)) (warpIdx[ch] = warpIdx[ch] || []).push(i);
            g += ch;
        }
    }
    const warp = {};
    for (const k in warpIdx) {
        const a = warpIdx[k];
        if (a.length === 2) { warp[a[0]] = a[1]; warp[a[1]] = a[0]; }
    }
    return { w, h, g, start, warp, goal: g.indexOf('G') };
}

/* Slide the penguin in direction d. Returns null if nothing happens. */
function simulate(L, st, d) {
    const w = L.w, h = L.h;
    let g = st.g, p = st.p, dir = d;
    const steps = [];
    let finished = false, fish = 0, guard = 0;
    const start = p;
    while (guard++ < 400) {
        const r = (p / w) | 0, c = p % w;
        const nr = r + DIRS[dir].dr, nc = c + DIRS[dir].dc;
        if (nr < 0 || nc < 0 || nr >= h || nc >= w) break;
        const ni = nr * w + nc, ch = g[ni];
        if (ch === '#' || ch === '~') break;
        if (ch === 'b') {
            const br = nr + DIRS[dir].dr, bc = nc + DIRS[dir].dc;
            if (br >= 0 && bc >= 0 && br < h && bc < w && g[br * w + bc] === '.') {
                const bi = br * w + bc;
                const pre = [];
                if (g[p] === 'c') { g = setCh(g, p, '~'); pre.push({ e: 'crack', i: p }); }
                g = setCh(g, bi, 'b'); g = setCh(g, ni, '.');
                steps.push({ k: 'move', from: p, to: ni, dir, pre, post: [{ e: 'push', from: ni, to: bi }] });
                p = ni;
            }
            break;
        }
        const pre = [];
        if (g[p] === 'c') { g = setCh(g, p, '~'); pre.push({ e: 'crack', i: p }); }
        const post = [];
        steps.push({ k: 'move', from: p, to: ni, dir, pre, post });
        p = ni;
        if (ch === 'f') { g = setCh(g, ni, '.'); post.push({ e: 'fish', i: ni }); fish++; }
        else if (ch === 'G') { finished = true; post.push({ e: 'goal', i: ni }); break; }
        else if (ch === 's') { post.push({ e: 'snow', i: ni }); break; }
        else if (ARROW_DIR[ch] !== undefined) { dir = ARROW_DIR[ch]; post.push({ e: 'redirect', i: ni, dir }); }
        else if (L.warp[ni] !== undefined) {
            const to = L.warp[ni];
            steps.push({ k: 'warp', from: ni, to, dir, pre: [], post: [] });
            p = to;
        }
    }
    if (p === start) return null;
    return { st: { g, p }, steps, finished, fish, dir };
}

/* BFS over (grid, position). needFish: finishing is only valid when all fish are gone. */
function solve(L, st, needFish, maxStates) {
    maxStates = maxStates || 150000;
    const key = s => s.g + '|' + s.p;
    const nodes = [{ st, par: -1, d: -1 }];
    const seen = new Set([key(st)]);
    for (let qi = 0; qi < nodes.length; qi++) {
        if (nodes.length > maxStates) return null;
        const cur = nodes[qi];
        for (let d = 0; d < 4; d++) {
            const res = simulate(L, cur.st, d);
            if (!res) continue;
            if (res.finished) {
                if (needFish && res.st.g.indexOf('f') >= 0) continue;
                const path = [d];
                for (let n = qi; nodes[n].par >= 0; n = nodes[n].par) path.push(nodes[n].d);
                return path.reverse();
            }
            const k = key(res.st);
            if (seen.has(k)) continue;
            seen.add(k);
            nodes.push({ st: res.st, par: qi, d });
        }
    }
    return null;
}

function initState(L) { return { g: L.g, p: L.start }; }

/* Solve preferring "collect every fish"; fall back to goal-only. */
function solveBest(L, st) {
    if (st.g.indexOf('f') >= 0) {
        const a = solve(L, st, true);
        if (a) return { path: a, fish: true };
    }
    const b = solve(L, st, false);
    return b ? { path: b, fish: false } : null;
}

function usedEvents(L, st, path) {
    const used = {};
    let s = st;
    for (const d of path) {
        const res = simulate(L, s, d);
        if (!res) break;
        for (const stp of res.steps) {
            if (stp.k === 'warp') used.warp = 1;
            stp.pre.concat(stp.post).forEach(e => used[e.e] = 1);
        }
        s = res.st;
    }
    return used;
}

function mulberry32(a) {
    return function () {
        a |= 0; a = a + 0x6D2B79F5 | 0;
        let t = Math.imul(a ^ a >>> 15, 1 | a);
        t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
        return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
}

const GEN_CFG = {
    easy:   { w: 6, h: 6, rocks: [5, 8],   snow: [0, 1], fish: [0, 1], arrows: [0, 0], cracks: [0, 0], blocks: [0, 0], warps: 0, min: 3, max: 6 },
    medium: { w: 7, h: 7, rocks: [7, 11],  snow: [1, 2], fish: [1, 2], arrows: [1, 2], cracks: [1, 2], blocks: [0, 1], warps: 0, min: 5, max: 9 },
    hard:   { w: 8, h: 8, rocks: [9, 14],  snow: [1, 3], fish: [1, 2], arrows: [1, 3], cracks: [1, 3], blocks: [1, 2], warps: 1, min: 8, max: 14 }
};

/* Generate one candidate board from a spec (also used to author the handcrafted levels). */
function genBoard(spec, rnd) {
    const { w, h } = spec;
    const rr = (a, b) => a + Math.floor(rnd() * (b - a + 1));
    const cells = new Array(w * h).fill('.');
    const free = () => {
        for (let t = 0; t < 200; t++) { const i = Math.floor(rnd() * w * h); if (cells[i] === '.') return i; }
        return -1;
    };
    const put = (ch, n) => { for (let k = 0; k < n; k++) { const i = free(); if (i >= 0) cells[i] = ch; } };
    const start = free(); cells[start] = 'P';
    const goal = free(); cells[goal] = 'G';
    put('#', rr(spec.rocks[0], spec.rocks[1]));
    put('s', rr(spec.snow[0], spec.snow[1]));
    put('f', rr(spec.fish[0], spec.fish[1]));
    const na = rr(spec.arrows[0], spec.arrows[1]);
    for (let k = 0; k < na; k++) put('^>v<'[Math.floor(rnd() * 4)], 1);
    put('c', rr(spec.cracks[0], spec.cracks[1]));
    put('b', rr(spec.blocks[0], spec.blocks[1]));
    for (let k = 0; k < spec.warps; k++) put(WARP_CHARS[k], 2);
    if (spec.water) put('~', rr(spec.water[0], spec.water[1]));
    const rows = [];
    for (let r = 0; r < h; r++) rows.push(cells.slice(r * w, r * w + w).join(''));
    return rows;
}

/* Random puzzle: guarantees solvability, par from solver, within difficulty window. */
function genRandomPuzzle(diff, rnd) {
    rnd = rnd || Math.random;
    const cfg = GEN_CFG[diff] || GEN_CFG.easy;
    const t0 = Date.now();
    let fallback = null;
    for (let attempt = 0; attempt < 600; attempt++) {
        const rows = genBoard(cfg, rnd);
        const L = parseLevel(rows);
        if (L.goal < 0) continue;
        const st = initState(L);
        let sol = solveBest(L, st);
        if (!sol) continue;
        if (sol.path.length >= cfg.min && sol.path.length <= cfg.max) {
            return { rows, par: sol.path.length, fishMode: sol.fish };
        }
        if (!fallback && sol.path.length >= 2) fallback = { rows, par: sol.path.length, fishMode: sol.fish };
        if (Date.now() - t0 > 900 && fallback) break;
    }
    if (fallback) return fallback;
    const rows = ['P....', '.....', '.....', '.....', '....G'];
    return { rows, par: 2, fishMode: false };
}
/* Handcrafted levels: P start, G fish hole, # rock, s snow, f fish, ^>v< arrows,
   c cracked ice, b ice block, 1-3 warp pairs, ~ water */
const WORLDS = [
    { name: "Easy Floe", sub: "Calm waters, gentle slides", theme: 0, levels: [
        ["P....", ".....", ".....", ".....", "....G"],
        ["P..#..", "......", "......", "..G...", "......"],
        ["......", "......", "P.s...", "......", ".#G..."],
        [".P..f", "G#.#.", "....#", ".....", "#...."],
        [".#s.#.", "......", "......", "##.P##", ".s....", ".G#..#"],

        [".......", "##..#.G", ".#.P...", "..#f..#", ".......", "....s..", ".##.f#."],

        [".#.P...", "#....G#", ".......", ".......", "....c..", ".##....", "....##c"],

        ["...2#..", "..#....", "#P.....", "2...G1.", "s......", "..#1###", "..f...#"],
        [".#..#Gc.", "#..>.#..", "..#...#.", "...1....", "....c..1", "#.#.#..#", "......##", "P#...#.."],

        ["....b.#.", "1..##.#.", "...^..##", "#...2...", "...f2#..", ".#.1...#", ".#.....G", "..#P.#v."],
        ["G...#.1.", ".#......", "...###..", ".##..c..", "#.P#..c2", "<<2#...#", ".#......", "...b#.1."],
        [".cPb.2.#", ".c#.#11.", "..##.#G.", "..#...#.", "..#.#.<.", "#.b....2", "###.....", "..^..s.."],
        [".2.#...c", "....#.^.", "...v##.P", "#.....#.", "..bc..f.", ".#.b..G.", "..#.###.", "1.#.12c."],
    ] },
];

/* ====================================================================
   CORE: canvas, save data, helpers
   ==================================================================== */
const cv = document.getElementById('gameCanvas');
const ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1;
const TAU = Math.PI * 2;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const easeOut = t => 1 - Math.pow(1 - t, 3);
const easeIn = t => t * t * t;
const easeInOut = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const easeOutBack = t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
const hash = (a, b, k) => { const s = Math.sin(a * 127.1 + b * 311.7 + k * 74.7) * 43758.5453; return s - Math.floor(s); };
const FONT_H = '"Baloo 2","Nunito","Trebuchet MS",system-ui,sans-serif';
const FONT_B = '"Nunito","Trebuchet MS",system-ui,sans-serif';

const OUTFITS = [
    { id: 'none', name: 'Classic', need: 0 },
    { id: 'scarf', name: 'Cozy Scarf', need: 3 },
    { id: 'beanie', name: 'Warm Beanie', need: 9 },
    { id: 'shades', name: 'Cool Shades', need: 18 },
    { id: 'crown', name: 'Royal Crown', need: 30 }
];
const TOTAL_LEVELS = WORLDS.reduce((a, w) => a + w.levels.length, 0);
const WORLD_START = []; { let n = 0; WORLDS.forEach(w => { WORLD_START.push(n); n += w.levels.length; }); }
const DIFF_NAMES = { easy: 'Easy', medium: 'Medium', hard: 'Hard' };

const SAVE_KEY = 'penguinSlide.v1';
let save = { stars: {}, moves: {}, outfit: 'none', muted: false, randStars: 0, randSolved: 0, randDiff: 'easy', randBest: {} };
function loadSave() {
    try {
        const s = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null');
        if (s && typeof s === 'object') Object.assign(save, s);
    } catch (e) { }
    if (!OUTFITS.some(o => o.id === save.outfit)) save.outfit = 'none';
    if (!GEN_CFG[save.randDiff]) save.randDiff = 'easy';
}
function persist() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) { } }
loadSave();

function levelStars(i) { return save.stars[i] || 0; }
function worldStars(wi) { let s = 0; for (let k = 0; k < WORLDS[wi].levels.length; k++) s += levelStars(WORLD_START[wi] + k); return s; }
function totalStars() { let s = 0; for (let i = 0; i < TOTAL_LEVELS; i++) s += levelStars(i); return s + (save.randStars || 0); }
function isUnlocked(i) { return i === 0 || levelStars(i - 1) > 0 || levelStars(i) > 0 || /[?&]unlock=1/.test(location.search); }
function outfitUnlocked(o) { return totalStars() >= o.need; }
function levelAt(i) {
    for (let w = WORLDS.length - 1; w >= 0; w--) if (i >= WORLD_START[w]) return { wi: w, li: i - WORLD_START[w], rows: WORLDS[w].levels[i - WORLD_START[w]] };
}
function firstIncomplete() { for (let i = 0; i < TOTAL_LEVELS; i++) if (levelStars(i) === 0) return i; return TOTAL_LEVELS - 1; }

/* Pre-solve every handcrafted level at load: par comes from the BFS solver. */
const LEVELS = [];
(function buildLevels() {
    for (let i = 0; i < TOTAL_LEVELS; i++) {
        const info = levelAt(i);
        const L = parseLevel(info.rows);
        const sol = solveBest(L, initState(L));
        if (!sol) { console.warn('Penguin Ice Slide: level ' + (i + 1) + ' is NOT solvable'); }
        LEVELS.push({ id: i, wi: info.wi, li: info.li, rows: info.rows, L, par: sol ? sol.path.length : 99, fishMode: sol ? sol.fish : false, solvable: !!sol });
    }
})();

/* ====================================================================
   AUDIO: synthesized sfx + calm pad music
   ==================================================================== */
const Snd = {
    ac: null, master: null, sfx: null, mus: null, started: false,
    nextChord: 0, chordIdx: 0, nextBell: 0, noiseBuf: null,
    init() {
        if (this.ac) return;
        try {
            const AC = window.AudioContext || window.webkitAudioContext;
            if (!AC) return;
            this.ac = new AC();
            this.master = this.ac.createGain(); this.master.gain.value = save.muted ? 0 : 1;
            this.master.connect(this.ac.destination);
            this.sfx = this.ac.createGain(); this.sfx.gain.value = 0.55; this.sfx.connect(this.master);
            this.mus = this.ac.createGain(); this.mus.gain.value = 0.5; this.mus.connect(this.master);
            const n = this.ac.sampleRate * 1.5, b = this.ac.createBuffer(1, n, this.ac.sampleRate), d = b.getChannelData(0);
            for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
            this.noiseBuf = b;
            this.nextChord = this.ac.currentTime + 0.1;
            this.nextBell = this.ac.currentTime + 3;
        } catch (e) { this.ac = null; }
    },
    resume() { if (this.ac && this.ac.state === 'suspended') this.ac.resume().catch(() => { }); },
    suspend() { if (this.ac && this.ac.state === 'running') this.ac.suspend().catch(() => { }); },
    setMuted(m) {
        save.muted = m; persist();
        if (this.master) this.master.gain.setTargetAtTime(m ? 0 : 1, this.ac.currentTime, 0.05);
    },
    tone(f, dur, type, vol, f2, delay, dest) {
        if (!this.ac || save.muted) return;
        const t = this.ac.currentTime + (delay || 0);
        const o = this.ac.createOscillator(), g = this.ac.createGain();
        o.type = type || 'sine';
        o.frequency.setValueAtTime(f, t);
        if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(vol || 0.2, t + 0.012);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        o.connect(g); g.connect(dest || this.sfx);
        o.start(t); o.stop(t + dur + 0.05);
    },
    noise(dur, f1, f2, vol, delay, q) {
        if (!this.ac || save.muted) return;
        const t = this.ac.currentTime + (delay || 0);
        const s = this.ac.createBufferSource(); s.buffer = this.noiseBuf;
        const fl = this.ac.createBiquadFilter(); fl.type = 'bandpass'; fl.Q.value = q || 1.2;
        fl.frequency.setValueAtTime(f1, t); fl.frequency.exponentialRampToValueAtTime(f2, t + dur);
        const g = this.ac.createGain();
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(vol, t + Math.min(0.06, dur * 0.3));
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        s.connect(fl); fl.connect(g); g.connect(this.sfx);
        s.start(t); s.stop(t + dur + 0.05);
    },
    click() { this.tone(660, 0.09, 'triangle', 0.16, 880); },
    back() { this.tone(520, 0.1, 'triangle', 0.14, 380); },
    slide(len) { this.noise(clamp(0.18 + len * 0.07, 0.2, 0.9), 700, 3200, 0.2, 0, 0.8); this.tone(300, 0.2, 'sine', 0.05, 520); },
    thud(power) { this.tone(110, 0.2, 'sine', 0.3 * power, 55); this.noise(0.12, 900, 300, 0.12 * power, 0, 0.7); },
    bonk() { this.tone(180, 0.12, 'square', 0.07, 120); },
    fish() { this.tone(784, 0.12, 'triangle', 0.18); this.tone(1175, 0.2, 'triangle', 0.16, null, 0.07); this.tone(1568, 0.25, 'sine', 0.1, null, 0.14); },
    crack() { this.noise(0.25, 5200, 1800, 0.26, 0, 3); this.tone(900, 0.1, 'square', 0.04, 300); this.noise(0.5, 400, 150, 0.2, 0.1, 0.6); },
    push() { this.tone(90, 0.28, 'sawtooth', 0.12, 60); this.noise(0.25, 600, 250, 0.14, 0, 0.8); },
    warp() { this.tone(300, 0.35, 'sine', 0.16, 1100); this.tone(1100, 0.3, 'sine', 0.12, 400, 0.2); },
    tick() { this.tone(880, 0.07, 'triangle', 0.1, 1100); },
    snow() { this.noise(0.18, 1800, 700, 0.1, 0, 0.5); },
    undo() { this.tone(600, 0.14, 'triangle', 0.14, 380); },
    hint() { this.tone(988, 0.1, 'sine', 0.16); this.tone(1319, 0.2, 'sine', 0.14, null, 0.09); },
    splash() { this.noise(0.45, 2400, 500, 0.2, 0, 0.7); this.tone(500, 0.3, 'sine', 0.1, 900); },
    star(i) { const f = [659, 784, 988][i % 3] * 1.0; this.tone(f, 0.5, 'triangle', 0.22); this.tone(f * 2, 0.6, 'sine', 0.1, null, 0.02); },
    win() { [523, 659, 784, 1047].forEach((f, i) => this.tone(f, 0.45, 'triangle', 0.16, null, i * 0.11)); },

        // sparkle trail
        const sx = cellX(P.px), sy = cellY(P.py) + P.geo.th * 0.2;
        P.trail.push({ x: P.px, y: P.py, age: 0 });
        if (Math.random() < 0.9) addPart({ x: sx + (Math.random() - 0.5) * P.geo.tw * 0.4, y: sy + (Math.random() - 0.5) * P.geo.th * 0.3, vx: (Math.random() - .5) * 18, vy: -Math.random() * 18, g: 14, life: 0.7, age: 0, size: 1.5 + Math.random() * 2.2, color: Math.random() < 0.5 ? '#ffffff' : '#a8ecff', shape: 'glint', rot: Math.random() * 3, vr: 2 });

function endAnim() {
    const a = P.anim, res = a.res, L = P.cur.L;
    P.st = res.st; P.disp = res.st.g; P.anim = null; P.scale = 1;
    P.px = res.st.p % L.w; P.py = (res.st.p / L.w) | 0;
    if (P.push) { P.push = null; }
    const c = idxCenter(res.st.p);
    if (res.finished) { winSequence(); return; }
    burst(c.x, c.y + P.geo.th * 0.28, 9, { speed: 70, up: 20, g: 90, life: 0.55, size: 3, colors: ['#ffffff', '#d8f2ff'], drag: 1.5 });
    const power = clamp(a.n / 4, 0.4, 1.3);
    shake.amp = Math.max(shake.amp, 2.2 * power); Snd.thud(power);

}
function finishAnimNow() { let g = 0; while (P.anim && g++ < 400) stepAnim(0.5); }

function winSequence() {
    P.done = true; P.doneT = 0; P.hint = null;
    const stars = starsFor(P.moves, P.cur.par);
    P.result = { stars, moves: P.moves, par: P.cur.par };
    const before = totalStars();
    const lv = P.cur;
    if (lv.kind === 'random') {
        save.randSolved = (save.randSolved || 0) + 1;
        save.randStars = (save.randStars || 0) + stars;
        const b = save.randBest[lv.diff] || 0; save.randBest[lv.diff] = b + 1;
    } else {
        if (stars > levelStars(lv.id)) save.stars[lv.id] = stars;
        if (!save.moves[lv.id] || P.moves < save.moves[lv.id]) save.moves[lv.id] = P.moves;
    }
    persist();
    const after = totalStars();
    P.newOutfit = null;
    for (const o of OUTFITS) if (o.need > before && o.need <= after) P.newOutfit = o;
    const c = idxCenter(lv.L.goal);
    burst(c.x, c.y, 26, { speed: 160, up: 80, g: 300, life: 1.1, size: 3.5, colors: ['#ffffff', '#9fe6ff', '#ffe58f'], shape: 'glint' });
    burst(c.x, c.y + P.geo.th * 0.1, 8, { speed: 0, g: 0, life: 0.9, size: 6, color: 'rgba(230,255,255,.9)', shape: 'ring' });
    Snd.splash();
}

function doUndo() {
    if (screen !== 'play' || trans || P.done) return;
    if (P.anim) finishAnimNow();
    if (P.done) return;
    const u = P.undo.pop();
    if (!u) { Snd.bonk(); return; }
    P.st = u.st; P.disp = u.st.g; P.moves = u.moves; P.hint = null; P.queued = -1;
    P.px = u.st.p % P.cur.L.w; P.py = (u.st.p / P.cur.L.w) | 0; P.push = null; P.crackT = {}; P.trail = [];
    const c = idxCenter(u.st.p);
    burst(c.x, c.y, 10, { speed: 80, g: 0, life: 0.5, size: 3, colors: ['#a8ecff', '#ffffff'], shape: 'glint' });
    Snd.undo();
}
function doRestart() {
    if (screen !== 'play' || trans) return;
    startPlay(P.cur); Snd.click();
}
function doHint() {
    if (screen !== 'play' || trans || P.done) return;
    if (P.anim) finishAnimNow();
    if (P.done) return;
    const L = P.cur.L;
    const sol = solveBest(L, P.st);
    if (!sol) { showToast('Stuck? Try Undo or Restart!'); Snd.bonk(); return; }
    const d = sol.path[0], r = simulate(L, P.st, d);
    P.hint = { dir: d, dest: r.st.p, t: 0 };
    Snd.hint();
}

function go(fn) {
    if (trans) return;
    trans = { t: 0, phase: 0, fn };
}

    trans.t += dt / (trans.phase === 0 ? 0.2 : 0.3);
    if (trans.phase === 0 && trans.t >= 1) { trans.fn(); trans.phase = 1; trans.t = 0; }
    else if (trans.phase === 1 && trans.t >= 1) trans = null;
}

    const g = c.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, Math.max(W, H) * 0.75);

    c.fillStyle = g; c.fillRect(0, 0, W, H);
    c.fillStyle = 'rgba(255,255,255,' + a * 0.5 + ')';
    for (let i = 0; i < 14; i++) { const x = (hash(i, 1, 1) * W + T * 40) % W, y = (hash(i, 2, 2) * H + a * 60) % H; c.beginPath(); c.arc(x, y, 2 + hash(i, 3, 3) * 3, 0, TAU); c.fill(); }
}

/* ====================================================================
   DRAWING: penguin sprite wrapper
   ==================================================================== */
function penguinSprite(c, x, y, u, t, o) {
    const slide = o.slide || 0, dir = o.dir === undefined ? 2 : o.dir;
    const p = { outfit: o.outfit, shadow: o.shadow === undefined ? 1 : o.shadow };
    const ph = t % 7, flap = ph < 0.8 ? Math.sin(ph / 0.8 * Math.PI * 5) * (1 - ph / 0.8) : 0;
    const bl = t % 3.7; p.blink = bl < 0.13 ? Math.sin(bl / 0.13 * Math.PI) : 0;
    if (slide > 0.55) {
        if (dir === 1 || dir === 3) { p.view = 'side'; p.d = dir === 1 ? 1 : -1; p.flapR = Math.sin(t * 20) * 0.3; }
        else { p.view = dir === 0 ? 'back' : 'front'; p.sx = 1.12; p.sy = 0.8; p.flapL = p.flapR = 0.9; }
        if (o.squash) { p.sx = (p.sx || 1) * o.squash[0]; p.sy = (p.sy || 1) * o.squash[1]; }
    } else {
        p.view = o.back ? 'back' : 'front';
        const lean = slide / 0.55;
        p.tilt = Math.sin(t * 2.7) * 0.05 * (1 - lean) + (dir === 1 ? lean * 0.5 : dir === 3 ? -lean * 0.5 : 0);
        p.sy = 1 + Math.sin(t * 5.4) * 0.015 - lean * 0.12; p.sx = 1 + lean * 0.08;
        p.flapL = flap * 0.8; p.flapR = -flap * 0.8; p.look = Math.sin(t * 0.8);
        if (o.happy) { p.happy = true; p.tilt = Math.sin(t * 9) * 0.06; p.sy = 1 + Math.abs(Math.sin(t * 9)) * 0.04; }
        if (o.squash) { p.sx *= o.squash[0]; p.sy *= o.squash[1]; }
    }
    if (o.tilt) p.tilt = (p.tilt || 0) + o.tilt;
    if (o.happy && slide <= 0.55) p.happy = true;
    drawPenguin(c, x, y - (o.hop || 0), u, p);
}

/* ====================================================================
   DRAWING: the board
   ==================================================================== */
function drawBoard(c, t, dt) {
    const g = P.geo, L = P.cur.L, w = L.w, h = L.h, tw = g.tw, th = g.th, dp = g.dp;
    const disp = P.disp;
    const bob = Math.sin(t * 1.1) * 2;
    c.save(); c.translate(shake.x, bob + shake.y);
    const bandPos = g.bx - tw * 2 + ((t * 70) % (g.bw + tw * 5));
    const isHole = i => L.g[i] === 'c' && disp[i] === '~';
    const isVoid = i => disp[i] === '~' && !isHole(i);
    // glow & foam under the floe
    for (let r = 0; r < h; r++) for (let q = 0; q < w; q++) {
        const i = r * w + q; if (isVoid(i)) continue;
        const x = g.bx + q * tw, y = g.by + r * th;
        const gr = c.createRadialGradient(x + tw / 2, y + th / 2 + dp, 2, x + tw / 2, y + th / 2 + dp, tw * 0.95);
        gr.addColorStop(0, 'rgba(120,235,240,.38)'); gr.addColorStop(1, 'rgba(120,235,240,0)');
        c.fillStyle = gr; c.fillRect(x - tw * 0.5, y - th * 0.2, tw * 2, th * 2 + dp);
    }
    c.fillStyle = 'rgba(225,252,255,' + (0.2 + 0.06 * Math.sin(t * 1.7)) + ')';
    for (let r = 0; r < h; r++) for (let q = 0; q < w; q++) {
        const i = r * w + q; if (isVoid(i)) continue;
        rrect(c, g.bx + q * tw - 5, g.by + r * th - 3, tw + 10, th + dp + 8, tw * 0.26); c.fill();
    }
    // slabs back to front
    for (let r = 0; r < h; r++) for (let q = 0; q < w; q++) {
        const i = r * w + q, ch = disp[i], x = g.bx + q * tw, y = g.by + r * th;
        if (isVoid(i)) continue;
        if (isHole(i)) {
            const k = (t - (P.crackT[i] === undefined ? -9 : P.crackT[i])) / 0.7;
            drawHole(c, x, y, tw, th, dp, t);
            if (k >= 0 && k < 1) {
                c.save(); c.globalAlpha = 1 - k; c.translate(0, k * dp * 2.2 * k); c.translate(x + tw / 2, y + th / 2); c.rotate(k * 0.25 * (hash(r, q, 7) - 0.5) * 2); c.translate(-x - tw / 2, -y - th / 2);
                drawSlab(c, x, y, tw, th, dp, r, q, t, 'c', bandPos); c.restore();
            }
            continue;
        }
        drawSlab(c, x, y, tw, th, dp, r, q, t, ch === 'c' ? 'c' : '.', bandPos);
    }
    // sliding trail (on the ice)
    for (let k = P.trail.length - 1; k >= 0; k--) { P.trail[k].age += dt; if (P.trail[k].age > 1.1) P.trail.splice(k, 1); }
    if (P.trail.length > 1) {
        c.lineCap = 'round'; c.lineJoin = 'round';
        for (let k = 1; k < P.trail.length; k++) {
            const a = P.trail[k - 1], b = P.trail[k], al = 1 - b.age / 1.1; if (al <= 0) continue;
            if (Math.abs(a.x - b.x) + Math.abs(a.y - b.y) > 1.2) continue;
            c.strokeStyle = 'rgba(255,255,255,' + 0.5 * al + ')'; c.lineWidth = tw * 0.22 * al + 1;
            c.beginPath(); c.moveTo(cellX(a.x), cellY(a.y) + th * 0.22); c.lineTo(cellX(b.x), cellY(b.y) + th * 0.22); c.stroke();
            c.strokeStyle = 'rgba(150,225,250,' + 0.4 * al + ')'; c.lineWidth = tw * 0.07;
            c.beginPath(); c.moveTo(cellX(a.x), cellY(a.y) + th * 0.22); c.lineTo(cellX(b.x), cellY(b.y) + th * 0.22); c.stroke();
        }
    }
    // flat decals + hint marker
    for (let r = 0; r < h; r++) for (let q = 0; q < w; q++) {
        const i = r * w + q, ch = disp[i], x = g.bx + q * tw, y = g.by + r * th, cx = x + tw / 2, cy = y + th / 2;
        if (ch === 's') drawSnowPatch(c, cx, cy, tw, th, hash(r, q, 5), t);
        else if (ARROW_DIR[ch] !== undefined) drawArrowTile(c, x, y, tw, th, ARROW_DIR[ch], t);
        else if (WARP_CHARS.includes(ch)) drawWarp(c, cx, cy, tw, th, ch, t);
        else if (ch === 'G') drawGoal(c, cx, cy, tw, th, t);
    }
    if (P.hint && !P.anim && !P.done) {
        const p = idxCenter(P.hint.dest), pulse = 0.5 + 0.5 * Math.sin(t * 5);
        c.strokeStyle = 'rgba(255,226,120,' + (0.6 + pulse * 0.4) + ')'; c.lineWidth = 3; c.setLineDash([7, 5]); c.lineDashOffset = -t * 20;
        rrect(c, p.x - tw / 2 + 4, p.y - th / 2 + 4, tw - 8, th - 8, tw * 0.18); c.stroke(); c.setLineDash([]);
        c.fillStyle = 'rgba(255,226,120,' + (0.12 + pulse * 0.12) + ')'; rrect(c, p.x - tw / 2 + 4, p.y - th / 2 + 4, tw - 8, th - 8, tw * 0.18); c.fill();
    }
    // objects sorted by depth

        const i = r * w + q, ch = disp[i], cx = g.bx + (q + 0.5) * tw, cy = g.by + (r + 0.5) * th;
        if (ch === '#') items.push({ y: cy + th * 0.2, f: () => drawRock(c, cx, cy, tw, th, r * 13 + q)});
        else if (ch === 'b') items.push({ y: cy + th * 0.3, f: () => drawBlock(c, cx, cy, tw, th, t) });
        else if (ch === 'f') items.push({ y: cy + th * 0.1, f: () => drawFishPickup(c, cx, cy, tw, th, t, r * 3 + q) });
    }
    if (P.push) {
        P.push.t += dt / 0.22;
        const k = easeOut(Math.min(1, P.push.t)), a = idxCenter(P.push.from), b = idxCenter(P.push.to);
        const cx = lerp(a.x, b.x, k), cy = lerp(a.y, b.y, k);

        if (P.push.t >= 1) { P.disp = setCh(P.disp, P.push.to, 'b'); P.push = null; }
    }
    // penguin
    const u = tw * 0.4;
    const px = cellX(P.px), py = cellY(P.py) + th * 0.3;
    let hop = 0, squash = null, tilt = 0;
    const sliding = !!P.anim && P.anim.segs[Math.min(P.anim.i, P.anim.segs.length - 1)].s.k === 'move';
    P.slide += ((sliding ? 1 : 0) - P.slide) * Math.min(1, dt * 16);
    if (P.done) {
        const dtm = P.doneT;

    }
    const sc = P.scale;
    items.push({
        y: py + 1, f: () => {
            c.save(); c.translate(px + ox, py + oy2); c.scale(sc, sc);
            penguinSprite(c, 0, 0, u, t, { outfit: save.outfit, slide: P.slide, dir: P.face, happy: P.done, hop, squash, tilt, shadow: 1 - Math.min(0.6, hop / (u * 2)) });
            c.restore();
        }
    });
    if (P.hint && !P.anim && !P.done) {
        const d = DIRS[P.hint.dir], bobh = Math.sin(t * 6) * 4, ax = px + d.dc * tw * 0.9, ay = py - u * 0.9 + d.dr * (d.dr > 0 ? th * 1.0 : th * 1.1) + bobh * (d.dr || 0);
        items.push({
            y: 9999, f: () => {
                c.save(); c.translate(ax + d.dc * bobh, ay); c.rotate([-Math.PI / 2, 0, Math.PI / 2, Math.PI][P.hint.dir]);
                const s = tw * 0.32;
                c.fillStyle = 'rgba(0,0,0,.25)'; c.beginPath(); c.moveTo(-s * 0.9 + 2, -s * 0.7 + 3); c.lineTo(s * 0.9 + 2, 3); c.lineTo(-s * 0.9 + 2, s * 0.7 + 3); c.closePath(); c.fill();
                const gg = c.createLinearGradient(-s, 0, s, 0); gg.addColorStop(0, '#ffe58f'); gg.addColorStop(1, '#ffb52e');
                c.fillStyle = gg; c.strokeStyle = '#fff'; c.lineWidth = 3; c.lineJoin = 'round';
                c.beginPath(); c.moveTo(-s * 0.9, -s * 0.7); c.lineTo(s * 0.9, 0); c.lineTo(-s * 0.9, s * 0.7); c.lineTo(-s * 0.45, 0); c.closePath(); c.fill(); c.stroke();
                c.restore();
            }
        });
    }
    items.sort((a, b) => a.y - b.y);
    items.forEach(it => it.f());
    c.restore();
}

/* ====================================================================
   MAIN LOOP + INPUT
   ==================================================================== */
function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
    cv.style.width = W + 'px'; cv.style.height = H + 'px';
    resizeScene();
}
function update(dt) {
    Snd.updateMusic();
    updateParts(dt);
    updateTrans(dt);
    shake.amp *= Math.pow(0.0008, dt); if (shake.amp < 0.05) shake.amp = 0;
    shake.x = (Math.random() - .5) * shake.amp * 2; shake.y = (Math.random() - .5) * shake.amp * 2;
    if (screen === 'play') {
        if (P.anim) stepAnim(dt);
        if (P.done) P.doneT += dt;
    }
    if (screen === 'select' && !ui.down) {
        sel.scroll += sel.vel * dt; sel.vel *= Math.pow(0.02, dt);
        if (Math.abs(sel.vel) < 5) sel.vel = 0;
        sel.scroll = clamp(sel.scroll, 0, sel.max);
    }
}
function render(dt) {
    ui.btns.length = 0;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    if (screen === 'title') drawTitle(dt);

    drawToast(dt);
    drawTrans();
}
let rafId = 0, lastTs = 0, running = false;
function frame(ts) {
    rafId = 0; if (!running) return;
    const dt = Math.min(0.05, Math.max(0.001, (ts - lastTs) / 1000)); lastTs = ts;
    T += dt;

    if (document.hidden) { stopLoop(); Snd.suspend(); }
    else { Snd.resume(); startLoop(); }
});
window.addEventListener('resize', resize);

function hit(x, y) {
    for (let i = ui.btns.length - 1; i >= 0; i--) {
        const b = ui.btns[i];

}
function ptr(e) { const r = cv.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }

    e.preventDefault();
    if (e.pointerType === 'touch') ui.touch = true;
    Snd.init(); Snd.resume();
    if (trans) return;
    const p = ptr(e), b = hit(p.x, p.y);

    ui.down = { x: p.x, y: p.y, lx: p.x, ly: p.y, id: e.pointerId, btn: b, moved: false, swiped: false, t: performance.now() };

});

    const d = ui.down; if (!d || d.id !== e.pointerId) return;
    const p = ptr(e), dx = p.x - d.x, dy = p.y - d.y;

        if (Math.abs(dy) > 8) { d.moved = true; ui.pressed = null; }
        if (d.moved) { const mv = d.ly - p.y; sel.scroll = clamp(sel.scroll + mv, 0, sel.max); sel.vel = mv / Math.max(0.008, (performance.now() - (d.lt || performance.now() - 16)) / 1000) * 0.6; d.lt = performance.now(); }
        d.lx = p.x; d.ly = p.y;
    } else if (screen === 'play' && !d.btn && !d.swiped && Math.hypot(dx, dy) > 28) {
        d.swiped = true; d.moved = true;
        tryMove(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 1 : 3) : (dy > 0 ? 2 : 0));

cv.addEventListener('pointerup', e => endPtr(e, false));
cv.addEventListener('pointercancel', e => endPtr(e, true));
cv.addEventListener('wheel', e => { if (screen === 'select') { e.preventDefault(); sel.scroll = clamp(sel.scroll + e.deltaY, 0, sel.max); sel.vel = 0; } }, { passive: false });
cv.addEventListener('contextmenu', e => e.preventDefault());

const KEYDIR = { ArrowUp: 0, ArrowRight: 1, ArrowDown: 2, ArrowLeft: 3, w: 0, W: 0, d: 1, D: 1, s: 2, S: 2, a: 3, A: 3 };
window.addEventListener('keydown', e => {
    const k = e.key;
    if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' ', 'Spacebar'].includes(k)) e.preventDefault();
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    Snd.init(); Snd.resume();
    if (trans) return;
    if (screen === 'play') {
        if (P.done && P.doneT > 1.4) {
            if (k === 'Enter' || k === ' ') { Snd.click(); nextAfterWin(); return; }
            if (k === 'r' || k === 'R') { doRestartAfterWin(); return; }
            if (k === 'Escape') { toSelect(); return; }
            return;

        if (KEYDIR[k] !== undefined && !e.repeat) { P.pressedKey = KEYDIR[k]; tryMove(KEYDIR[k]); setTimeout(() => { P.pressedKey = -1; }, 140); }
        else if (k === 'u' || k === 'U' || k === 'z' || k === 'Z' || k === 'Backspace') { if (!e.repeat) doUndo(); }
        else if (k === 'r' || k === 'R') { if (!e.repeat) doRestart(); }
        else if (k === 'h' || k === 'H') { if (!e.repeat) doHint(); }

/* ---- test / debug hook (read-only helpers) ---- */
window.__penguin = {
    P, LEVELS, save, sel,
    get screen() { return screen; },
    play(i) { screen = 'play'; trans = null; startPlay(LEVELS[i]); },
    playRandom(d) { if (d) save.randDiff = d; screen = 'play'; trans = null; startPlay(makeRandomLevel()); },
    setScreen(s) { screen = s; trans = null; },
    tryMove, finishAnimNow, doHint, doUndo,
    solveAll() { return LEVELS.map(l => ({ id: l.id + 1, par: l.par, ok: l.solvable, fish: l.fishMode })); }
};

resize();
if (!/[?&]nomusic=1/.test(location.search)) { /* music starts after first gesture */ }
startLoop();
