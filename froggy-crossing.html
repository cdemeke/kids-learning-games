<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Froggy Crossing - Hop, Think, Splash!</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
:root{--ink:#2b4a39;--gold:#f4b43c;--leaf:#3c9460}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none}
body{background:#2a6a66;color:var(--ink);font-family:Nunito,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}
#game{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#safe{position:fixed;left:0;top:0;visibility:hidden;pointer-events:none;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
button,a{font:800 15px Nunito,sans-serif}
button{cursor:pointer;color:var(--ink);border:0;background:linear-gradient(#fffdf4,#ffeec2);border-radius:16px;padding:10px 14px;box-shadow:0 4px 0 #c7a460,0 8px 16px #06252a40;transition:transform .12s,box-shadow .12s,filter .15s}
button:hover{filter:brightness(1.05)}
button:active{transform:translateY(3px);box-shadow:0 1px 0 #c7a460}
:focus-visible{outline:4px solid #ffb830;outline-offset:3px}
[hidden]{display:none!important}
.top{position:fixed;z-index:8;top:max(10px,env(safe-area-inset-top));left:max(12px,env(safe-area-inset-left));right:max(12px,env(safe-area-inset-right));display:flex;justify-content:space-between;pointer-events:none}
.top>*{pointer-events:auto}
.home{display:inline-block;background:linear-gradient(#fffdf4,#ffeec2);border-radius:16px;padding:11px 15px;text-decoration:none;color:var(--ink);box-shadow:0 4px 0 #c7a460,0 8px 16px #06252a40;transition:transform .12s}
.home:active{transform:translateY(3px)}
.tools{display:flex;gap:8px}
#controls{position:fixed;z-index:6;left:0;right:0;bottom:max(12px,env(safe-area-inset-bottom));display:flex;justify-content:center;gap:12px;pointer-events:none}
#controls button{pointer-events:auto;position:relative;width:76px;height:60px;padding:0;border-radius:20px;touch-action:none}
#controls button::before{content:"";position:absolute;left:50%;top:50%;width:15px;height:15px;border:solid var(--ink);border-width:5px 5px 0 0;border-radius:3px}
#controls [data-dir=up]{order:2}#controls [data-dir=up]::before{transform:translate(-50%,-30%) rotate(-45deg)}
#controls [data-dir=left]{order:1}#controls [data-dir=left]::before{transform:translate(-30%,-50%) rotate(-135deg)}
#controls [data-dir=down]{order:3}#controls [data-dir=down]::before{transform:translate(-50%,-70%) rotate(135deg)}
#controls [data-dir=right]{order:4}#controls [data-dir=right]::before{transform:translate(-70%,-50%) rotate(45deg)}
body.side #controls{left:auto;right:max(22px,env(safe-area-inset-right));bottom:max(22px,env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(3,62px);grid-template-rows:repeat(2,56px);gap:8px}
body.side #controls button{width:62px;height:56px}
body.side #controls [data-dir=up]{grid-column:2;grid-row:1}
body.side #controls [data-dir=left]{grid-column:1;grid-row:2}
body.side #controls [data-dir=down]{grid-column:2;grid-row:2}
body.side #controls [data-dir=right]{grid-column:3;grid-row:2}
.overlay{position:fixed;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;padding:62px 14px 14px;opacity:0;visibility:hidden;pointer-events:none;transition:opacity .5s ease,visibility 0s linear .5s;background:radial-gradient(ellipse at 50% 55%,#06243000 35%,#06243066 100%)}
.overlay.on{opacity:1;visibility:visible;pointer-events:auto;transition:opacity .5s ease}
.panel{position:relative;width:min(460px,100%);max-height:100%;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;touch-action:pan-y;text-align:center;background:linear-gradient(170deg,#fffbed,#f8e9c4);border:4px solid #fff9e6;border-radius:32px;padding:16px 26px 22px;box-shadow:0 10px 0 #b98b4a,0 24px 60px #05242c66;transform:translateY(28px) scale(.93);transition:transform .6s cubic-bezier(.2,1.25,.4,1)}
.on .panel{transform:none}
.eyebrow{letter-spacing:3px;font-size:11px;color:#6f8a62;font-weight:900}
h1{font:800 clamp(40px,8vw,54px)/.9 'Baloo 2',sans-serif;margin:4px 0 0;color:#fffbe8;letter-spacing:-.5px;-webkit-text-stroke:7px #2d8a54;paint-order:stroke fill;text-shadow:0 5px 0 #1d6a3f,0 12px 16px #0b3a2a44}
h2{font:800 34px/1.05 'Baloo 2',sans-serif;margin:6px 0 2px;color:#2f7a4c}
p{font-size:14px;line-height:1.45;margin:8px 0}
.subtitle{color:#6b7d58;margin:6px 0 0}
#portrait{width:100%;max-width:360px;aspect-ratio:680/300;display:block;margin:8px auto 2px;border-radius:22px;box-shadow:0 4px 0 #d3b777,0 8px 18px #2a4a3a40}
.label{text-align:left;font-size:11px;letter-spacing:1.6px;text-transform:uppercase;margin:12px 0 6px;color:#6a7b5c;font-weight:900}
.choices{display:flex;gap:6px}
.choices button{flex:1;font-size:13px;padding:9px 5px;border-radius:13px;box-shadow:0 3px 0 #d3b777;background:#fff6dc}
.choices button[aria-pressed=true]{background:linear-gradient(#58b27a,#3a8f5f);color:#fff8de;box-shadow:0 3px 0 #266a44}
.skins{display:flex;gap:5px}
.skins button{padding:4px 2px;flex:1;font-size:10px;line-height:1.2;background:#f0ead0;box-shadow:0 3px 0 #d3b777;border-radius:13px;min-width:0}
.skins button[aria-pressed=true]{background:#d8ebb4;box-shadow:0 3px 0 #7ea35a,0 0 0 3px #3a8f5f}
.skins canvas{width:100%;max-width:56px;aspect-ratio:86/70;display:block;margin:auto}
.skins .locked{opacity:.5;filter:grayscale(.5)}
.primary{background:linear-gradient(#ffcd5e,#ee9f2c);color:#4a3412;width:100%;font-size:22px;font-family:'Baloo 2',sans-serif;margin-top:14px;padding:8px 14px;box-shadow:0 6px 0 #b9741b,0 12px 20px #6b3d0a40;animation:throb 2.4s ease-in-out infinite}
.primary:active{box-shadow:0 1px 0 #b9741b}
@keyframes throb{50%{transform:scale(1.03)}}
.record{font-size:12px;color:#66785f;margin:10px 0 0;font-weight:800}
.hint{font-size:12px;color:#708067;margin:10px 0 0}
.stars{display:flex;justify-content:center;gap:10px;margin:8px 0 2px;min-height:52px}
.stars i{width:52px;height:50px;clip-path:polygon(50% 0,62% 34%,98% 36%,69% 58%,80% 94%,50% 72%,20% 94%,31% 58%,2% 36%,38% 34%);background:linear-gradient(#ffe685,#f2a51e);transform:scale(0) rotate(-40deg);animation:pop .55s cubic-bezier(.2,1.7,.4,1) forwards}
.stars i.off{background:#ddd5bd}
.stars i:nth-child(2){animation-delay:.2s}.stars i:nth-child(3){animation-delay:.4s}
@keyframes pop{to{transform:scale(1) rotate(0)}}
.quiet{font-size:13px;margin-top:12px;background:transparent;box-shadow:none;color:#5b7a62}
.live{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
@media(max-height:760px){.panel{padding:12px 22px 16px}#portrait{max-width:280px}.label{margin-top:8px}.primary{margin-top:10px}.hint{display:none}h1{font-size:40px}}
@media(max-height:600px){#portrait{display:none}}
@media(max-width:400px){.panel{padding-left:16px;padding-right:16px}.home{font-size:13px;padding:10px 12px}.tools button{font-size:13px;padding:10px}#controls button{width:70px}}
</style>
</head>
<body>
<nav class="top"><a class="home" href="index.html">&lsaquo; All games</a><div class="tools"><button id="pause" hidden aria-label="Pause game">Pause</button><button id="sound" aria-label="Toggle sound">Sound: on</button></div></nav>
<canvas id="game" aria-label="Froggy Crossing pond. Use arrow keys, WASD, swipes or the direction buttons to reach the correct answer pad."></canvas>
<div id="controls" hidden aria-label="Movement controls"><button data-dir="up" aria-label="Hop up"></button><button data-dir="left" aria-label="Hop left"></button><button data-dir="down" aria-label="Hop down"></button><button data-dir="right" aria-label="Hop right"></button></div>
<section class="overlay on" id="title"><div class="panel"><div class="eyebrow">LITTLE POND &middot; BIG ADVENTURE</div><h1>Froggy Crossing</h1><p class="subtitle">A hop, a think, a happy little splash.</p><canvas id="portrait" width="680" height="300" aria-label="A friendly green frog on a lily pad"></canvas><div class="label">Your adventure</div><div class="choices" id="difficulty"><button data-value="easy" aria-pressed="true">Easy</button><button data-value="medium" aria-pressed="false">Medium</button><button data-value="hard" aria-pressed="false">Hard</button></div><div class="label">Little learning moments</div><div class="choices" id="category"><button data-value="math" aria-pressed="false">Math</button><button data-value="letters" aria-pressed="false">Letters</button><button data-value="mixed" aria-pressed="true">Mixed</button></div><div class="label">Pick your pond pal <span id="unlockNote"></span></div><div class="skins" id="skins"></div><p class="record" id="record"></p><button id="start" class="primary">Let&rsquo;s hop!</button><p class="hint">Dodge the traffic. Ride the logs. Hop onto the pad with the right answer.<br>Press Enter or Space to start.</p></div></section>
<section class="overlay" id="message"><div class="panel"><div class="eyebrow" id="messageTag"></div><h2 id="messageTitle"></h2><div class="stars" id="stars"></div><p id="messageText"></p><button id="continue" class="primary">Next little adventure</button><button id="menu" class="quiet">Back to the pond</button></div></section>
<div class="live" aria-live="polite" id="announce"></div>
<div id="safe"></div>
<script>
'use strict';
const $=id=>document.getElementById(id),canvas=$('game');let ctx=canvas.getContext('2d');
const ROWS=10,U=64,TAU=Math.PI*2;
const modes={easy:{speed:.72,hearts:Infinity,max:5,gap:1.25},medium:{speed:1,hearts:5,max:10,gap:1},hard:{speed:1.28,hearts:3,max:20,gap:.88}};
const skinDefs=[['Pond',0],['Tree',100],['Rainbow',250],['Royal',500],['Space',900]];
const SK=[{c:'#68b94c',l:'#bdf07f',d:'#2d7a3b',b:'#f7f3b9',s:'#3b8f3c'},{c:'#25b39a',l:'#92f2d2',d:'#0e6a62',b:'#e0f8cb',s:'#b98748'},{c:'#ff90c0',l:'#ffd5e8',d:'#c34f90',b:'#fff2f8',s:'#ff6fae'},{c:'#6d64da',l:'#b0a9ff',d:'#34308f',b:'#f1ecff',s:'#4b43b8'},{c:'#b9ccd9',l:'#f4fcff',d:'#6a8296',b:'#ffffff',s:'#8aa3b5'}];
let saved={};try{saved=JSON.parse(localStorage.getItem('froggyCrossing.v1')||'{}')||{}}catch(e){}
let difficulty='easy',category='mixed',skin=Math.max(0,Math.min(4,Number(saved.skin)||0)),muted=!!saved.muted;
let state='title',time=0,last=0,hiddenTab=false,score=0,shownScore=0,level=1,hearts=Infinity,streak=0,bestStreak=0,bumps=0,levelBumps=0,totalCorrect=0,bestAtStart=0;
let lanes=[],laneAt=[],lanesCols=0,lanesExt=0,question=null,particles=[],floats=[],queue=[],hop=null,invincible=0,shield=0,hint=0,shake=0,flies=[],flyClock=0,combo=0,tongue=null,lock=0,respawnT=0,celT=0,celMsg=false,endT=0,fade=0,banner=null,signPop=0,padWob=[0,0,0],celPad=0,celIdx=0,wrongIdx=-1,lastLand=0,streakPop=-9,comboPop=-9;
let todCur=0,rainA=0,parX=0,spawnAcc=0,puffAcc=0;
const frog={x:3,row:9,sq:0,sqv:0,lx:0,ly:-.5,look:{x:0,y:-.5},lookT:0,blink:0,blinkT:0,nextBlink:2,hidden:false,dizzy:0,ride:null,mouth:0};
let cw=800,ch=600,dpr=1,T=60,S=1,bx=0,by=0,cols=7,wx0=0,wx1=0,navH=54,signH=76,signY=0,hudY=0,hudInline=true,safeT=0,safeB=0,terrain=null,sideMode=false;
const rand=(a,b)=>a+Math.random()*(b-a),pick=a=>a[Math.floor(Math.random()*a.length)],clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),lerp=(a,b,t)=>a+(b-a)*t;
const sm=(a,b,v)=>{const t=clamp((v-a)/(b-a),0,1);return t*t*(3-2*t)};
const easeOutCubic=t=>1-Math.pow(1-t,3),easeOutBack=t=>1+2.70158*Math.pow(t-1,3)+1.70158*Math.pow(t-1,2);
const hash=n=>{const x=Math.sin(n*12.9898+78.233)*43758.5453;return x-Math.floor(x)};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
/* ---------- colour + draw helpers ---------- */
const rgbCache=new Map();
function rgb(h){let r=rgbCache.get(h);if(!r){if(h[0]==='r'){r=h.slice(h.indexOf('(')+1,-1).split(',').slice(0,3).map(Number)}else{let k=h;if(k.length===4)k='#'+k[1]+k[1]+k[2]+k[2]+k[3]+k[3];r=[parseInt(k.slice(1,3),16),parseInt(k.slice(3,5),16),parseInt(k.slice(5,7),16)]}if(rgbCache.size>2000)rgbCache.clear();rgbCache.set(h,r)}return r}
function mixc(a,b,t,al=1){const A=rgb(a),B=rgb(b);return `rgba(${Math.round(lerp(A[0],B[0],t))},${Math.round(lerp(A[1],B[1],t))},${Math.round(lerp(A[2],B[2],t))},${al})`}
const shade=(h,amt,al=1)=>amt>=0?mixc(h,'#ffffff',amt,al):mixc(h,'#000000',-amt,al);
const al=(h,a)=>mixc(h,h,0,a);
const E=(x,y,rx,ry,f,rot=0)=>{ctx.fillStyle=f;ctx.beginPath();ctx.ellipse(x,y,Math.max(.01,rx),Math.max(.01,ry),rot,0,TAU);ctx.fill()};
const C=(x,y,r,f)=>E(x,y,r,r,f);
const RR=(x,y,w,h,r,f)=>{ctx.fillStyle=f;ctx.beginPath();ctx.roundRect(x,y,Math.max(.01,w),Math.max(.01,h),r);ctx.fill()};
const L=(x1,y1,x2,y2,c,w=2)=>{ctx.strokeStyle=c;ctx.lineWidth=w;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke()};
const lg=(x0,y0,x1,y1,st)=>{const g=ctx.createLinearGradient(x0,y0,x1,y1);for(const s of st)g.addColorStop(s[0],s[1]);return g};
const rg=(x0,y0,r0,x1,y1,r1,st)=>{const g=ctx.createRadialGradient(x0,y0,r0,x1,y1,r1);for(const s of st)g.addColorStop(s[0],s[1]);return g};
function star4(r){ctx.beginPath();ctx.moveTo(0,-r);ctx.quadraticCurveTo(0,0,r,0);ctx.quadraticCurveTo(0,0,0,r);ctx.quadraticCurveTo(0,0,-r,0);ctx.quadraticCurveTo(0,0,0,-r);ctx.fill()}
function txt(s,x,y,size,fill,align='center',stroke,sw=0,font='Baloo 2'){ctx.font=`800 ${size}px "${font}",sans-serif`;ctx.textAlign=align;ctx.textBaseline='middle';if(stroke){ctx.lineJoin='round';ctx.strokeStyle=stroke;ctx.lineWidth=sw;ctx.strokeText(s,x,y)}ctx.fillStyle=fill;ctx.fillText(s,x,y)}
function persist(){try{localStorage.setItem('froggyCrossing.v1',JSON.stringify(saved))}catch(e){}}
function announce(t){$('announce').textContent=t}
/* ---------- audio ---------- */
let audio=null,nextNote=0,step=0;
function ensureAudio(){if(!audio){try{audio=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(audio&&audio.state==='suspended')audio.resume().catch(()=>{});return audio}
function tone(f0,f1,dur,type='sine',vol=.07,delay=0){if(muted)return;const a=ensureAudio();if(!a)return;try{const t=a.currentTime+delay,o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+dur);g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(vol,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+dur+.03)}catch(e){}}
function noise(dur,vol,f0,f1,delay=0){if(muted)return;const a=ensureAudio();if(!a)return;try{const t=a.currentTime+delay,n=Math.floor(a.sampleRate*dur),b=a.createBuffer(1,n,a.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1;const s=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain();s.buffer=b;f.type='lowpass';f.frequency.setValueAtTime(f0,t);f.frequency.exponentialRampToValueAtTime(f1,t+dur);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);s.connect(f);f.connect(g);g.connect(a.destination);s.start(t)}catch(e){}}
function sound(k){switch(k){
case'hop':tone(330,640,.1,'sine',.07);break;
case'land':tone(190,120,.07,'triangle',.05);break;
case'splash':noise(.38,.16,2600,300);tone(260,90,.3,'triangle',.06);tone(520,200,.12,'sine',.04,.05);break;
case'boing':tone(180,520,.16,'sine',.09);tone(520,160,.3,'sine',.07,.14);break;
case'win':[523,659,784,1047,1319].forEach((f,i)=>tone(f,f*1.01,.22,'triangle',.07,i*.09));tone(130,130,.5,'sine',.05,.1);break;
case'ribbit':tone(150,230,.09,'square',.035);tone(160,260,.09,'square',.035,.12);break;
case'fly':tone(900,1500,.12,'sine',.06);tone(1500,2000,.1,'sine',.04,.08);break;
case'gold':[880,1175,1568,2093].forEach((f,i)=>tone(f,f,.14,'sine',.05,i*.06));break;
case'tongue':tone(700,200,.08,'square',.03);break;
case'wrong':tone(330,250,.18,'sine',.06);tone(260,200,.22,'sine',.05,.14);break;
case'level':[392,523,659].forEach((f,i)=>tone(f,f,.18,'triangle',.06,i*.08));break;
case'bubble':tone(500,900,.07,'sine',.03);break}}
function musicTick(){if(!audio||muted||audio.state!=='running'||state==='paused')return;const ct=audio.currentTime;if(nextNote<ct-.4)nextNote=ct+.05;const night=sm(1.3,2,todCur%3);while(nextNote<ct+.3){const s=step++,root=[196,220,174.6,196][(s>>3)&3]*(night>.5?.5:1),pent=[0,2,4,7,9,12,9,7],n=pent[s%8]+((s>>4)&1?0:0),f=root*2*Math.pow(2,n/12);if(s%2===0||s%8===3)tone(f,f,.36,'triangle',.014,nextNote-ct);if(s%8===0)tone(root,root,.7,'sine',.03,nextNote-ct);nextNote+=.4}}
/* ---------- time of day ---------- */
const PAL=[
{skyT:'#4fb2ee',skyM:'#a6defa',skyB:'#fff0c4',sun:'#fff2a8',cloud:'#ffffff',h0:'#a9d9b4',h1:'#7ec196',h2:'#58a276',w0:'#52bdb4',w1:'#2f93a6',w2:'#237893',mul:'#ffffff',star:0,glow:0},
{skyT:'#5d4a9c',skyM:'#ee8a78',skyB:'#ffd486',sun:'#ffb04f',cloud:'#ffb7a0',h0:'#b98c9f',h1:'#8b6486',h2:'#634a6e',w0:'#5aa2b2',w1:'#3a7a98',w2:'#2c5f86',mul:'#ffd6ae',star:0,glow:.35},
{skyT:'#091230',skyM:'#1b2d66',skyB:'#41568f',sun:'#f4f1d0',cloud:'#4d5c8f',h0:'#2e4676',h1:'#233862',h2:'#192b4e',w0:'#2b7391',w1:'#1b4c70',w2:'#133659',mul:'#8596dc',star:1,glow:1}];
function palette(){const u=todCur,i=Math.floor(u)%3,f=u-Math.floor(u),a=PAL[i],b=PAL[(i+1)%3],o={};for(const k in a)o[k]=typeof a[k]==='string'?mixc(a[k],b[k],f):lerp(a[k],b[k],f);o.f=f;return o}
const TOD=['Sunny Pond','Golden Sunset','Firefly Night'];
/* ---------- layout ---------- */
function layout(){
  cw=window.innerWidth;ch=window.innerHeight;dpr=Math.min(window.devicePixelRatio||1,2);
  const cs=getComputedStyle($('safe'));safeT=parseFloat(cs.paddingTop)||0;safeB=parseFloat(cs.paddingBottom)||0;
  canvas.width=Math.round(cw*dpr);canvas.height=Math.round(ch*dpr);
  sideMode=cw>=900||ch<560;document.body.classList.toggle('side',sideMode);
  const small=ch<560;navH=Math.max(56,safeT+52);hudInline=cw>=720;
  const hudH=hudInline?0:78;signH=small?54:cw<500?74:82;
  const bottom=sideMode?34:84+safeB,sideRes=sideMode?(small?130:200):6;
  const aH=ch-navH-hudH-signH-16-bottom,aW=cw-2*sideRes,T0=Math.max(18,aH/ROWS);
  const nc=clamp(Math.round(aW/T0),6,15);T=Math.min(aW/nc,T0);
  const colsChanged=nc!==cols;cols=nc;S=T/U;bx=(cw-cols*T)/2;by=ch-bottom-ROWS*T;wx0=-bx/S;wx1=(cw-bx)/S;
  signY=by-signH-8;hudY=hudInline?Math.max(10,safeT):signY-80;
  bakeTerrain();
  const ext=Math.max(8,Math.ceil(Math.max(0,cw/T-cols)/2)+4);
  if(lanes.length&&(colsChanged||ext>lanesExt)){makeLanes(state==='title'?3:level);if(state!=='title'){frog.x=clamp(frog.x,.5,cols-.5)}}
}
function bakeTerrain(){
