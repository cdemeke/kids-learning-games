                        const a = k * Math.PI * 2 / 5 - Math.PI / 2;
                        ctx.beginPath();
                        ctx.arc(fx + Math.cos(a) * 4 * S, fy - 13 * S + Math.sin(a) * 4 * S, 3.2 * S, 0, 7);
                        ctx.fill();
                    }
                    ctx.fillStyle = '#ffd93d';
                    ctx.beginPath();
                    ctx.arc(fx, fy - 13 * S, 2.4 * S, 0, 7);
                    ctx.fill();
                }
            }
            ctx.restore();
        }

        // ------------------------------------------------------------- loop
        let tNow = 0, last = 0;

        function frame(t) {
            tNow = t;
            const dt = Math.min(48, t - last || 16.7);
            last = t;
            const d = Math.min(2.6, dt / 16.667);

            drawBackground();
            if (state === 'playing') { update(d); refreshLiveKeys(); }
            drawScene();

            requestAnimationFrame(frame);
        }

        // ------------------------------------------------------------- HUD
        function updateHUD() {
            document.getElementById('heightVal').textContent = bestHeightM;
            document.getElementById('starVal').textContent = starCount;
            const h = document.getElementById('hearts');
            h.innerHTML = '';
            for (let i = 0; i < 3; i++) {
                const s = document.createElement('span');
                s.className = 'heart' + (i >= hearts ? ' lost' : '');
                s.textContent = '❤️';
                h.appendChild(s);
            }
        }

        // ------------------------------------------------ on-screen key pad
        // Tablets have no keyboard, so letter mode brings its own. Keys that
        // match something in the sky right now light up — that's the "find the
        // letter" part of the exercise.
        const KEY_ROWS = {
            home: [['A', 'S', 'D', 'F', 'G', 'H', 'J', 'K', 'L']],
            alpha: [['Q', 'W', 'E', 'R', 'T', 'Y', 'U', 'I', 'O', 'P'],
            ['A', 'S', 'D', 'F', 'G', 'H', 'J', 'K', 'L'],
            ['Z', 'X', 'C', 'V', 'B', 'N', 'M']],
            num: [['1', '2', '3', '4', '5', '6', '7', '8', '9', '0']]
        };

        const keyCaps = new Map();
        let liveSig = '';

        function buildKeyPad() {
            const pad = document.getElementById('keyPad');
            pad.innerHTML = '';
            keyCaps.clear();
            liveSig = '';
            for (const row of KEY_ROWS[SET.keys]) {
                const r = document.createElement('div');
                r.className = 'key-row';
                for (const ch of row) {
                    const b = document.createElement('button');
                    b.className = 'key-cap';
                    b.textContent = ch;
                    b.addEventListener('pointerdown', e => {
                        e.preventDefault();
                        ensureAudio();
                        pressLetter(ch);
                    });
                    keyCaps.set(ch, b);
                    r.appendChild(b);
                }
                pad.appendChild(r);
            }
            syncKeyPad();
        }

        function syncKeyPad() {
            const show = letterMode() && SET.osk && state === 'playing';
            document.getElementById('keyPad').classList.toggle('hidden', !show);
        }

        function flashKey(ch, hit) {
            const b = keyCaps.get(ch);
            if (!b) return;
            b.classList.add('hit');
            setTimeout(() => b.classList.remove('hit'), 130);
            if (!hit) { b.style.opacity = '.4'; setTimeout(() => b.style.opacity = '', 180); }
        }

        // Called every frame, but only touches the DOM when the set changes.
        function refreshLiveKeys() {
            if (!keyCaps.size || !letterMode()) return;
            const live = new Set();
            const add = o => {
                if (!o.key) return;
                const sy = o.y - camY;
                if (sy > -70 && sy < H + 70) live.add(o.key);
            };
            for (const b of balloons) add(b);
            for (const p of platforms) if (!p.dead) add(p);
            const sig = [...live].sort().join('');
            if (sig === liveSig) return;
            liveSig = sig;
            keyCaps.forEach((b, ch) => b.classList.toggle('live', live.has(ch)));
        }

        // --------------------------------------------------- settings panel
        function syncSettingsUI() {
            document.querySelectorAll('#modeSeg button').forEach(b =>
                b.classList.toggle('on', b.dataset.mode === SET.mode));
            document.querySelectorAll('#keySeg button').forEach(b =>
                b.classList.toggle('on', b.dataset.keys === SET.keys));
            document.getElementById('oskChk').checked = SET.osk;
            document.getElementById('keySetWrap').classList.toggle('hidden', !letterMode());
            document.getElementById('modeToggle').classList.toggle('on', letterMode());
            document.getElementById('howText').innerHTML = letterMode()
                ? 'Press the <b>letter</b> you see 🔤<br>Your hopper flies to that spot! ⬆️<br>Letters are on <b>platforms</b> and <b>balloons</b> 🎈'
                : '<b>Hold and slide</b> your finger to move 🫱<br>You bounce all by yourself! ⬆️<br>Grab <b>stars</b> ⭐ and <b>balloons</b> 🎈';
            syncKeyPad();
        }

        function setMode(mode) {
            if (SET.mode === mode) return;
            SET.mode = mode;
            localStorage.setItem('skyHopperMode', mode);
            relabelWorld(letterMode());
            if (letterMode()) buildKeyPad();
            syncSettingsUI();
        }

        function setKeySet(keys) {
            if (SET.keys === keys) return;
            SET.keys = keys;
            localStorage.setItem('skyHopperKeys', keys);
            // hand out fresh labels from the new pool
            relabelWorld(false);
            usedLetters.clear();
            if (letterMode()) { relabelWorld(true); buildKeyPad(); }
            syncSettingsUI();
        }

        // ------------------------------------------------- menu / game flow
        function buildCharPicker() {
            const row = document.getElementById('charRow');
            row.innerHTML = '';
            HEROES.forEach((hero, i) => {
                const btn = document.createElement('button');
                btn.className = 'char-btn' + (i === heroIdx ? ' selected' : '');
                const c = document.createElement('canvas');
                const dpr = Math.min(window.devicePixelRatio || 1, 2);
                c.width = 46 * dpr; c.height = 46 * dpr;
                const g = c.getContext('2d');
                g.setTransform(dpr, 0, 0, dpr, 0, 0);
                drawHero(g, 23, 26, 15, hero, {});
                const label = document.createElement('span');
                label.textContent = hero.name;
                btn.appendChild(c); btn.appendChild(label);
                btn.onclick = () => {
                    ensureAudio();
                    heroIdx = i;
                    SFX.hop();
                    [...row.children].forEach((b, k) => b.classList.toggle('selected', k === i));
                };
                row.appendChild(btn);
            });
        }

        function drawMenuBackdrop() {
            bestHeightM = 0;
            camY = -H * 0.72;
        }

        function startGame() {
            ensureAudio();
            resetGame();
            state = 'playing';
            document.getElementById('startScreen').classList.add('hidden');
            document.getElementById('overScreen').classList.add('hidden');
            document.getElementById('hud').style.display = 'flex';
            syncKeyPad();
            if (letterMode()) toast('PRESS A LETTER!', 'HOP TO IT');
            SFX.hop();
        }

        function gameOver() {
            state = 'over';
            SFX.over();
            const isBest = bestHeightM > bestScore;
            if (isBest) { bestScore = bestHeightM; localStorage.setItem('skyHopperBest', bestScore); }
            document.getElementById('overTitle').textContent = pick(['Great climbing!', 'What a hopper!', 'Nice jumping!', 'So high!']);
            document.getElementById('bestBadgeWrap').innerHTML = isBest
                ? '<div class="best-badge">🏆 NEW BEST!</div>'
                : `<div class="best-badge">Best: ${bestScore}m</div>`;
            document.getElementById('finalHeight').textContent = bestHeightM;
            document.getElementById('finalStars').textContent = starCount;
            document.getElementById('overScreen').classList.remove('hidden');
            document.getElementById('hud').style.display = 'none';
            syncKeyPad();
        }

        document.getElementById('playBtn').onclick = startGame;
        document.getElementById('againBtn').onclick = startGame;
        document.getElementById('menuBtn').onclick = () => {
            state = 'menu';
            drawMenuBackdrop();
            document.getElementById('overScreen').classList.add('hidden');
            document.getElementById('startScreen').classList.remove('hidden');
            syncKeyPad();
        };
        document.getElementById('soundToggle').onclick = () => {
            soundOn = !soundOn;
            document.getElementById('soundToggle').textContent = soundOn ? '🔊' : '🔇';
            if (soundOn) { ensureAudio(); SFX.hop(); }
        };

        // settings: control mode, which keys, on-screen pad
        document.getElementById('modeSeg').onclick = e => {
            const b = e.target.closest('button');
            if (!b) return;
            ensureAudio(); SFX.hop();
            setMode(b.dataset.mode);
        };
        document.getElementById('keySeg').onclick = e => {
            const b = e.target.closest('button');
            if (!b) return;
            ensureAudio(); SFX.hop();
            setKeySet(b.dataset.keys);
        };
        document.getElementById('oskChk').onchange = e => {
            SET.osk = e.target.checked;
            localStorage.setItem('skyHopperOSK', SET.osk ? '1' : '0');
            syncKeyPad();
        };
        // the ⌨️ button flips modes without leaving the climb
        document.getElementById('modeToggle').onclick = () => {
            ensureAudio();
            setMode(letterMode() ? 'touch' : 'letters');
            SFX.lock();
            if (state === 'playing') toast(letterMode() ? 'LETTER KEYS ON' : 'SLIDE TO MOVE', '');
        };

        // menu backdrop: a few decorative platforms behind the panel
        (function menuScene() {
            platforms = [];
            const g = { x: 0, y: 0, w: playW, h: 46 * S, type: 'ground', alpha: 1, spring: false, baseX: 0 };
            makeDecor(g);
            platforms.push(g);
            for (let i = 1; i <= 8; i++) {
                heightM = 0;
                const p = addPlatform(-i * 110 * S, 'grass');
                p.type = 'grass';
            }
            camY = -H * 0.72;
            player.r = 22 * S;
            player.x = playW / 2;
            player.y = -H * 0.2;
        })();

        buildCharPicker();
        buildKeyPad();
        syncSettingsUI();
        updateHUD();
        requestAnimationFrame(frame);
    </script>
</body>

</html>
