<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Super Tennis Stars - Smash, Grab Power-Ups, Win!</title>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@700;800&display=swap"
        rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --ink: #0b1a3a;
            --gold: #ffd84a;
            --deep-gold: #e8a51f;
            --red: #ff4d5e;
            --blue: #3d8bff;
            --court: #2f6fd6;
            --grass: #3aa856;
        }

        html,
        body {
            background: #0a1530;
            height: 100%;
            overflow: hidden;
            touch-action: none;
            font-family: 'Nunito', sans-serif;
            color: #fff;
        }

        canvas#game {
            position: fixed;
            inset: 0;
            display: block;
        }

        canvas#fx {
            position: fixed;
            inset: 0;
            display: block;
            z-index: 35;
            pointer-events: none;
        }

        .hidden {
            display: none !important;
        }

        /* ---------- Buttons ---------- */
        .btn {
            font-family: 'Baloo 2', cursive;
            font-weight: 800;
            font-size: 1.35rem;
            border: none;
            border-radius: 999px;
            padding: .55em 1.6em;
            color: #4a2a00;
            background: linear-gradient(180deg, #ffe98a, #f4b323);
            box-shadow: 0 6px 0 #b8741a, 0 10px 24px rgba(0, 0, 0, .35);
            cursor: pointer;
            transition: transform .12s, box-shadow .12s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: .4em;
        }

        .btn:hover {
            transform: translateY(-2px);
        }

        .btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #b8741a, 0 4px 10px rgba(0, 0, 0, .3);
        }

        .btn.big {
            font-size: 2rem;
            padding: .35em 2.4em;
        }

        .btn.alt {
            color: #fff;
            background: linear-gradient(180deg, #6fb0ff, #2f6fd6);
            box-shadow: 0 6px 0 #1b428a, 0 10px 24px rgba(0, 0, 0, .35);
        }

        .btn.alt:active {
            box-shadow: 0 2px 0 #1b428a;
        }

        .btn.ghost {
            color: #fff;
            background: rgba(255, 255, 255, .14);
            box-shadow: 0 4px 0 rgba(0, 0, 0, .35);
        }

        .btn:disabled {
            filter: grayscale(1) brightness(.7);
            cursor: wait;
        }

        .home-btn {
            position: fixed;
            top: max(12px, env(safe-area-inset-top));
            left: 12px;
            z-index: 40;
            font-family: 'Baloo 2', cursive;
            font-weight: 800;
            font-size: 1.05rem;
            text-decoration: none;
            color: #4a2a00;
            background: linear-gradient(180deg, #fff3cf, #ffd877);
            padding: .3em .9em;
            border-radius: 999px;
            box-shadow: 0 4px 0 #b8741a;
        }

        /* ---------- Screens ---------- */
        .screen {
            position: fixed;
            inset: 0;
            z-index: 30;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        .screen.show {
            display: flex;
        }

        .dim {
            background: radial-gradient(ellipse at center, rgba(10, 25, 60, .5), rgba(4, 8, 24, .88));
            backdrop-filter: blur(3px);
            -webkit-backdrop-filter: blur(3px);
        }

        .panel {
            position: relative;
            width: min(560px, 100%);
            max-height: calc(100dvh - 32px);
            overflow-y: auto;
            background: linear-gradient(180deg, #1f5bb8 0%, #123a80 100%);
            border: 3px solid rgba(255, 216, 74, .45);
            border-radius: 30px;
            padding: 22px 22px 22px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, .6), inset 0 2px 0 rgba(255, 255, 255, .15);
            animation: pop .38s cubic-bezier(.2, 1.6, .4, 1);
        }

        @keyframes pop {
            from {
                transform: scale(.7);
                opacity: 0;
            }

            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        .panel h2 {
            font-family: 'Baloo 2', cursive;
            font-weight: 800;
            font-size: 2.3rem;
            line-height: 1;
            color: var(--gold);
            text-shadow: 0 3px 0 #8a4f0b, 0 0 24px rgba(255, 216, 74, .45);
            margin-bottom: 6px;
        }

        .panel .sub {
            font-size: 1.05rem;
            color: #d4e4ff;
            margin-bottom: 10px;
        }

        .row {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 16px;
        }

        /* ---------- Title ---------- */
        #scrTitle {
            background: url('images/tennis/title.jpg') center/cover no-repeat, linear-gradient(180deg, #1c3f8f 0%, #2e7bd1 45%, #3aa856 46%, #2c8a45 100%);
            flex-direction: column;
            justify-content: flex-start;
            padding-top: max(5vh, 54px);
            overflow-y: auto;
        }

        #scrTitle::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, rgba(5, 12, 35, .65) 0%, rgba(5, 12, 35, .1) 40%, rgba(5, 12, 35, .6) 100%);
            pointer-events: none;
        }

        .logo {
            position: relative;
            text-align: center;
            font-family: 'Baloo 2', cursive;
            font-weight: 800;
            line-height: .88;
            animation: float 3.5s ease-in-out infinite;
            flex: none;
        }

        .logo .l1 {
            display: block;
            font-size: clamp(1.6rem, 5vw, 2.8rem);
            color: #fff;
            letter-spacing: .3em;
            text-shadow: 0 3px 0 #b8331f, 0 0 18px rgba(255, 120, 90, .8);
        }

        .logo .l2 {
            display: block;
            font-size: clamp(3rem, 10.5vw, 6rem);
            color: var(--gold);
            -webkit-text-stroke: 2px #6b3a07;
            text-shadow: 0 6px 0 #6b3a07, 0 0 40px rgba(255, 220, 80, .7);
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(0) rotate(-1deg);
            }

            50% {
                transform: translateY(-8px) rotate(1deg);
            }
        }

        .menu {
            position: relative;
            margin-top: auto;
            margin-bottom: max(3vh, 12px);
            width: min(600px, 100%);
            flex: none;
            background: linear-gradient(180deg, rgba(31, 91, 184, .92), rgba(18, 58, 128, .94));
            border: 3px solid rgba(255, 216, 74, .45);
            border-radius: 28px;
            padding: 16px 18px 20px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, .55);
        }

        .seg-label {
            font-family: 'Baloo 2', cursive;
            font-weight: 700;
            font-size: 1rem;
            color: #bcd4ff;
            letter-spacing: .08em;
            text-transform: uppercase;
            margin: 2px 0 4px;
        }

        .seg {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 10px;
        }

        .seg button {
            flex: 1;
            max-width: 200px;
            font-family: 'Baloo 2', cursive;
            font-weight: 800;
            font-size: 1.3rem;
            border: 3px solid transparent;
            border-radius: 18px;
            padding: .3em .6em;
            background: rgba(255, 255, 255, .12);
            color: #fff;
            cursor: pointer;
            transition: transform .12s, background .15s;
        }

        .seg button:hover {
            transform: translateY(-2px);
        }

        .seg button.on {
            background: linear-gradient(180deg, #ffe98a, #f4b323);
            color: #4a2a00;
            border-color: #fff6c8;
            box-shadow: 0 4px 0 #b8741a;
        }

        .seg.small button {
            font-size: 1.1rem;
        }

        .controls {
            display: flex;
            gap: 14px;
            justify-content: center;
            align-items: stretch;
            flex-wrap: wrap;
            margin: 6px 0 12px;
        }

        .ctl {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(0, 0, 0, .2);
            border-radius: 16px;
            padding: 8px 12px;
        }

        .ctl img {
            height: 58px;
            filter: drop-shadow(0 3px 4px rgba(0, 0, 0, .4));
        }

        .ctl .who {
            font-family: 'Baloo 2', cursive;
            font-weight: 800;
            font-size: 1.05rem;
            line-height: 1.05;
        }

        .ctl .or {
            font-family: 'Baloo 2', cursive;
            font-size: .95rem;
            color: #bcd4ff;
        }

        .keys {
            display: grid;
            grid-template-columns: repeat(3, 30px);
            grid-template-rows: 30px 30px;
            gap: 3px;
        }

        .keys kbd:first-child {
            grid-column: 2;
        }

        .keys kbd:nth-child(2) {
            grid-column: 1;
            grid-row: 2;
        }

        kbd {
            font-family: 'Baloo 2', cursive;
            font-weight: 800;
            background: linear-gradient(180deg, #fff, #dfe6f3);
            color: #223;
            border-radius: 7px;
            box-shadow: 0 3px 0 #8893a8;
            font-size: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1;
            padding: 0 6px;
        }

        .keys.red kbd {
            box-shadow: 0 3px 0 #c23a48;
        }

        .keys.blue kbd {
            box-shadow: 0 3px 0 #2b5fb8;
        }

        .pus {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
            margin: 2px 0 12px;
        }

        .pus div {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 76px;
            font-family: 'Baloo 2', cursive;
            font-weight: 700;
            font-size: .82rem;
            line-height: 1.05;
            color: #e8f0ff;
        }

        .pus img {
            width: 46px;
            height: 46px;
            object-fit: contain;
            animation: bob 1.6s ease-in-out infinite;
        }

        .pus div:nth-child(2) img {
            animation-delay: .2s;
        }

        .pus div:nth-child(3) img {
            animation-delay: .4s;
        }

        .pus div:nth-child(4) img {
            animation-delay: .6s;
        }

        @keyframes bob {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-5px);
            }
        }

        .loading {
            width: 240px;
            margin: 0 auto;
            text-align: center;
            font-family: 'Baloo 2', cursive;
            font-size: 1.05rem;
        }

        .loading .bar {
            height: 12px;
            border-radius: 99px;
            background: rgba(255, 255, 255, .15);
            overflow: hidden;
            margin-top: 4px;
        }

        .loading .bar i {
            display: block;
            height: 100%;
            width: 0;
            background: linear-gradient(90deg, #ffe98a, #f4b323);
            transition: width .2s;
        }

        /* ---------- In-game buttons ---------- */
        #gameBtns {
            position: fixed;
            top: max(10px, env(safe-area-inset-top));
            right: 12px;
            z-index: 20;
            display: flex;
            gap: 8px;
        }

        .icon-btn {
            width: 46px;
            height: 46px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, .25);
            background: rgba(10, 20, 50, .72);
            color: #fff;
            font-size: 1.25rem;
            cursor: pointer;
        }

        /* ---------- Touch D-pad ---------- */
        #dpad {
            position: fixed;
            left: max(18px, env(safe-area-inset-left));
            bottom: max(18px, env(safe-area-inset-bottom));
            width: 150px;
            height: 150px;
            z-index: 20;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 255, 255, .18) 0 28%, rgba(10, 20, 50, .55) 30% 100%);
            border: 3px solid rgba(255, 255, 255, .3);
            touch-action: none;
        }

        #dpad span {
            position: absolute;
            font-size: 26px;
            color: rgba(255, 255, 255, .85);
            transform: translate(-50%, -50%);
            pointer-events: none;
        }

        #dpadKnob {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 56px;
            height: 56px;
            margin: -28px 0 0 -28px;
            border-radius: 50%;
            background: linear-gradient(180deg, #ff8a95, #e0303f);
            box-shadow: 0 4px 0 #8a1823;
            pointer-events: none;
        }

        /* ---------- Win ---------- */
        .win-art {
            display: flex;
            justify-content: center;
            align-items: flex-end;
            gap: 4px;
            height: 170px;
            margin: 4px 0 6px;
        }

        .win-art img {
            max-height: 170px;
            filter: drop-shadow(0 8px 12px rgba(0, 0, 0, .5));
        }

        .win-art .trophy {
            max-height: 150px;
            animation: bob 1.2s ease-in-out infinite;
        }

        .win-art .champ {
            animation: hop .7s ease-in-out infinite;
        }

        .win-art .emoji {
            font-size: 110px;
            line-height: 1;
        }

        @keyframes hop {

            0%,
            100% {
                transform: translateY(0) scaleY(1);
            }

            15% {
                transform: translateY(0) scaleY(.9);
            }

            50% {
                transform: translateY(-22px) scaleY(1.04);
            }
        }

        .final-score {
            font-family: 'Baloo 2', cursive;
            font-weight: 800;
            font-size: 2.4rem;
            line-height: 1;
            margin: 4px 0 2px;
        }

        .final-score .r {
            color: #ff8a95;
        }

        .final-score .b {
            color: #8ec2ff;
        }
    </style>
</head>

<body>
    <canvas id="game"></canvas>
    <canvas id="fx"></canvas>

    <div id="gameBtns" class="hidden">
        <button class="icon-btn" id="btnSound" title="Sound (M)">🔊</button>
        <button class="icon-btn" id="btnPause" title="Pause (P)">⏸</button>
    </div>

    <div id="dpad" class="hidden">
        <span style="left:50%;top:14%">▲</span>
        <span style="left:50%;top:86%">▼</span>
        <span style="left:14%;top:50%">◀</span>
        <span style="left:86%;top:50%">▶</span>
        <div id="dpadKnob"></div>
    </div>

    <!-- Title / mode select -->
    <div class="screen show" id="scrTitle">
        <a href="index.html" class="home-btn">🏠 Home</a>
        <div class="logo"><span class="l1">SUPER</span><span class="l2">Tennis Stars</span></div>
        <div class="menu">
            <div class="seg-label">Players</div>
            <div class="seg" id="segMode">
                <button data-mode="1" class="on">🤖 1 Player</button>
                <button data-mode="2">👫 2 Players</button>
            </div>
            <div id="diffWrap">
                <div class="seg-label">Robot Level</div>
                <div class="seg small" id="segDiff">
                    <button data-diff="easy" class="on">😊 Easy</button>
                    <button data-diff="medium">😎 Medium</button>
                    <button data-diff="hard">🔥 Hard</button>
                </div>
            </div>
            <div class="controls" id="controls"></div>
            <div class="seg-label">Grab the power-ups!</div>
            <div class="pus">
                <div><img src="images/tennis/pu-speed.png" alt="" onerror="this.style.visibility='hidden'">Super
                    Speed</div>
                <div><img src="images/tennis/pu-bigball.png" alt="" onerror="this.style.visibility='hidden'">Giant
                    Ball</div>
                <div><img src="images/tennis/pu-bigracket.png" alt="" onerror="this.style.visibility='hidden'">Mega
                    Racket</div>
                <div><img src="images/tennis/pu-freeze.png" alt="" onerror="this.style.visibility='hidden'">Freeze!
                </div>
            </div>
            <div class="loading" id="loading">Warming up...<div class="bar"><i id="loadBar"></i></div>
            </div>
            <button class="btn big hidden" id="btnPlay">🎾 Play!</button>
        </div>
    </div>

    <!-- Pause -->
    <div class="screen dim" id="scrPause">
        <div class="panel">
            <h2>Paused</h2>
            <div class="sub">Take a breather, champ!</div>
            <div class="row">
                <button class="btn big" id="btnResume">▶ Resume</button>
            </div>
            <div class="row">
                <button class="btn alt" id="btnPauseMenu">☰ Menu</button>
                <a href="index.html" class="btn ghost" style="text-decoration:none">🏠 Home</a>
            </div>
        </div>
    </div>

    <!-- Win -->
    <div class="screen dim" id="scrWin">
        <div class="panel">
            <div class="win-art" id="winArt"></div>
            <h2 id="winTitle">Red Wins!</h2>
            <div class="final-score" id="winScore"></div>
            <div class="sub" id="winSub">What a match!</div>
            <div class="row">
                <button class="btn big" id="btnAgain">🔁 Play Again</button>
            </div>
            <div class="row">
                <button class="btn alt" id="btnWinMenu">☰ Menu</button>
            </div>
        </div>
    </div>

    <script>
        (() => {
            'use strict';
            const $ = id => document.getElementById(id);
            const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
            const rand = (a, b) => a + Math.random() * (b - a);
            const lerp = (a, b, t) => a + (b - a) * t;

            // =====================================================================
            //  World / projection
            //  World units: x = left/right (0 = center), y = along court (0 = top
            //  baseline, CL = bottom baseline), z = height above ground.
            // =====================================================================
            const LW = 900, LH = 1200;               // logical canvas size (portrait)
            const CL = 760, CW = 290;                // court length, half-width (doubles lines)
            const NETY = CL / 2, NET_H = 40;
            const YMIN = -150, YMAX = CL + 150;
            const TOP = 200, HSPAN = 980;
            const LIMX = CW + 90;                    // how far sideways players may go
            const BUMPER = CW + 120;                 // invisible side walls for the ball
            const P_SPEED = 380;
            const G = 650;                           // gravity
            const BASE_SPEED = 470;
            const BALL_R = 11;
            const WIN_SCORE = 5;

            function proj(x, y, z = 0) {
                const u = (y - YMIN) / (YMAX - YMIN);
                const s = 0.78 + 0.22 * u;
                return { x: LW / 2 + x * s, y: TOP + u * (0.86 + 0.14 * u) * HSPAN - z * s, s };
            }

            // =====================================================================
            //  Canvas
            // =====================================================================
            const cvs = $('game'), ctx = cvs.getContext('2d');
            const fxc = $('fx'), fctx = fxc.getContext('2d');
            const tintC = document.createElement('canvas'), tctx = tintC.getContext('2d');
            let W = 0, H = 0, DPR = 1, VS = 1, OX = 0, OY = 0;
            function resize() {
                DPR = Math.min(window.devicePixelRatio || 1, 2);
                W = Math.floor(innerWidth * DPR); H = Math.floor(innerHeight * DPR);
                for (const c of [cvs, fxc]) {
                    c.width = W; c.height = H;
                    c.style.width = innerWidth + 'px'; c.style.height = innerHeight + 'px';
                }
                VS = Math.min(W / LW, H / LH);
                OX = (W - LW * VS) / 2; OY = (H - LH * VS) / 2;
                backdropDirty = true;
            }
            let backdropDirty = true;
            addEventListener('resize', resize);
            resize();

            // =====================================================================
            //  Assets
            // =====================================================================
            const ASSET_DIR = 'images/tennis/';
            const ASSETS = {
                title: 'title.jpg', player1: 'player1.png', player2: 'player2.png', robot: 'robot.png',
                racket: 'racket.png', racketBlue: 'racket-blue.png', ball: 'ball.png',
                speed: 'pu-speed.png', bigball: 'pu-bigball.png', bigracket: 'pu-bigracket.png', freeze: 'pu-freeze.png',
                trophy: 'trophy.png'
            };
            const IMG = {};   // key -> { img, ok }
            function loadAssets(onProgress) {
                const keys = Object.keys(ASSETS);
                let done = 0;
                const tick = () => { done++; onProgress(done / keys.length); };
                const all = Promise.all(keys.map(k => new Promise(res => {
                    const im = new Image();
                    IMG[k] = { img: im, ok: false };
                    im.onload = () => { IMG[k].ok = im.naturalWidth > 0; backdropDirty = true; tick(); res(); };
                    im.onerror = () => { tick(); res(); };
                    im.src = ASSET_DIR + ASSETS[k];
                })));
                // never block the menu for long if something hangs
                return Promise.race([all, new Promise(r => setTimeout(r, 6000))]);
            }
            const ok = k => IMG[k] && IMG[k].ok;

            // =====================================================================
            //  Sound (all synthesized with WebAudio)
            // =====================================================================
            const Snd = {
                ctx: null, master: null, noiseBuf: null, muted: false,
                init() {
                    if (this.ctx) { if (this.ctx.state !== 'running') this.ctx.resume(); return; }
                    try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return; }
                    const c = this.ctx;
                    this.master = c.createGain(); this.master.gain.value = this.muted ? 0 : .8; this.master.connect(c.destination);
                    const len = c.sampleRate;
                    this.noiseBuf = c.createBuffer(1, len, c.sampleRate);
                    const d = this.noiseBuf.getChannelData(0);
                    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
                },
                setMuted(m) {
                    this.muted = m;
                    if (this.master) this.master.gain.setTargetAtTime(m ? 0 : .8, this.ctx.currentTime, .05);
                },
                tone(f, dur, o = {}) {
                    const c = this.ctx; if (!c) return;
                    const t = c.currentTime + (o.delay || 0);
                    const osc = c.createOscillator(), g = c.createGain();
                    osc.type = o.type || 'sine';
                    osc.frequency.setValueAtTime(f, t);
                    if (o.to) osc.frequency.exponentialRampToValueAtTime(o.to, t + dur);
                    g.gain.setValueAtTime(.0001, t);
                    g.gain.exponentialRampToValueAtTime(o.vol || .2, t + (o.attack || .006));
                    g.gain.exponentialRampToValueAtTime(.0001, t + dur);
                    let node = osc;
                    if (o.lp) { const f2 = c.createBiquadFilter(); f2.type = 'lowpass'; f2.frequency.value = o.lp; node.connect(f2); node = f2; }
                    node.connect(g); g.connect(this.master);
                    osc.start(t); osc.stop(t + dur + .05);
                },
                noise(dur, o = {}) {
                    const c = this.ctx; if (!c) return;
                    const t = c.currentTime + (o.delay || 0);
                    const src = c.createBufferSource(); src.buffer = this.noiseBuf;
                    const f = c.createBiquadFilter(); f.type = o.ftype || 'bandpass'; f.frequency.setValueAtTime(o.freq || 1000, t);
                    if (o.to) f.frequency.exponentialRampToValueAtTime(o.to, t + dur);
                    f.Q.value = o.q || 1;
                    const g = c.createGain();
                    g.gain.setValueAtTime(.0001, t);
                    g.gain.exponentialRampToValueAtTime(o.vol || .2, t + (o.attack || .005));
                    g.gain.exponentialRampToValueAtTime(.0001, t + dur);
                    src.connect(f); f.connect(g); g.connect(this.master);
                    src.start(t, Math.random() * .4); src.stop(t + dur + .05);
                },
                hit(power) {
                    this.noise(.07, { freq: 1700, q: .9, vol: power ? .5 : .35 });
                    this.tone(power ? 200 : 280, .1, { type: 'triangle', to: 110, vol: .32 });
                    if (power) this.noise(.45, { freq: 300, to: 3500, q: .6, vol: .25, attack: .03 });
                },
                bounce(v) { this.tone(170, .08, { to: 85, vol: clamp(v, .05, .22) }); this.noise(.04, { freq: 500, vol: .05 }); },
                chime() { [880, 1109, 1319, 1760].forEach((f, i) => this.tone(f, .3, { type: 'triangle', vol: .16, delay: i * .07 })); },
                boing() { this.tone(160, .3, { to: 620, vol: .22 }); this.tone(620, .35, { to: 220, vol: .18, delay: .2 }); },
                grow() { this.tone(200, .4, { type: 'square', to: 800, lp: 1600, vol: .1 }); },
                freeze() {
                    for (let i = 0; i < 7; i++) this.tone(rand(1800, 3200), .25, { vol: .07, delay: i * .05 });
                    this.noise(.6, { ftype: 'highpass', freq: 4000, vol: .12, attack: .05 });
                },
                beep(hi) { this.tone(hi ? 990 : 660, .14, { type: 'square', lp: 2200, vol: .1 }); },
                cheer() {
                    this.noise(1.4, { freq: 1300, q: .35, vol: .22, attack: .2 });
                    this.noise(1.0, { freq: 2600, q: .5, vol: .1, attack: .1, delay: .15 });
                    [523, 659, 784].forEach((f, i) => this.tone(f, .18, { type: 'triangle', vol: .14, delay: i * .09 }));
                },
                aww() { this.tone(330, .45, { type: 'triangle', to: 180, vol: .12 }); },
                win() {
                    const n = [523, 659, 784, 1047, 784, 1047, 1319];
                    const d = [0, .13, .26, .39, .6, .72, .86];
                    n.forEach((f, i) => { this.tone(f, i === n.length - 1 ? .7 : .2, { type: 'square', lp: 2400, vol: .12, delay: d[i] }); this.tone(f / 2, .22, { type: 'triangle', vol: .1, delay: d[i] }); });
                    this.noise(2, { freq: 1300, q: .35, vol: .2, attack: .3, delay: .3 });
                },
                click() { this.tone(700, .06, { type: 'triangle', vol: .12 }); },
            };

            // =====================================================================
            //  Game state
            // =====================================================================
            const DIFFS = {
                easy: { speed: .55, err: 70, miss: .28, react: .35, pow: .88, grab: .25 },
                medium: { speed: .75, err: 42, miss: .13, react: .2, pow: 1, grab: .6 },
                hard: { speed: .95, err: 18, miss: .05, react: .1, pow: 1.1, grab: .9 },
            };
            const settings = { mode: 1, diff: 'easy' };
            const game = {
                state: 'title', paused: false, score: [0, 0], server: 0, serveT: 0, lastCount: 0,
                pointT: 0, rally: 0, lastHitter: null, puTimer: 7, big: { t: 0, owner: null }, shake: 0, time: 0,
                scoreBump: [0, 0], winner: -1,
            };
            function makePlayer(idx) {
                return {
                    idx, x: 0, y: idx === 0 ? CL + 70 : -50, vx: 0, vy: 0,
                    side: idx === 0 ? 1 : -1,     // which screen side the racket is on
                    cpu: false, img: idx === 0 ? 'player1' : 'player2', racket: idx === 0 ? 'racket' : 'racketBlue',
                    color: idx === 0 ? '#ff4d5e' : '#3d8bff', name: idx === 0 ? 'Red' : 'Blue',
                    fx: { speed: 0, racket: 0, freeze: 0 }, frozen: 0,
                    rs: 1, rsv: 0, swingT: 0, celebT: 0, animT: 0, moving: false, lean: 0,
                    // CPU brain
                    err: 0, react: 0, chasePU: false,
                };
            }
            const players = [makePlayer(0), makePlayer(1)];
            const ball = { x: 0, y: 0, z: 0, vx: 0, vy: 0, vz: 0, rs: 1, rsv: 0, rot: 0, fire: false, trail: [] };
            let pu = null;
            const particles = [];
            const popups = [];
            const confetti = [];

            const hitHalfW = p => 60 * p.rs;
            const hitCenterX = p => p.x + p.side * 26 * p.rs;
            const ballR = () => BALL_R * ball.rs;

            // =====================================================================
            //  Input
            // =====================================================================
            const keys = {};
            const touch = { x: 0, y: 0 };
            const PREVENT = new Set(['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space']);
            const P1KEYS = ['KeyW', 'KeyA', 'KeyS', 'KeyD'];
            const P2KEYS = ['ArrowUp', 'ArrowLeft', 'ArrowDown', 'ArrowRight'];
            function readKeys(set) {
                return {
                    x: (keys[set[3]] ? 1 : 0) - (keys[set[1]] ? 1 : 0),
                    y: (keys[set[2]] ? 1 : 0) - (keys[set[0]] ? 1 : 0),
                };
            }
            function inputFor(p) {
                let x = 0, y = 0;
                if (p.idx === 0) {
                    const a = readKeys(P1KEYS);
                    x = a.x; y = a.y;
                    if (settings.mode === 1) { const b = readKeys(P2KEYS); x = clamp(x + b.x, -1, 1); y = clamp(y + b.y, -1, 1); }
                    x = clamp(x + touch.x, -1, 1); y = clamp(y + touch.y, -1, 1);
                } else {
                    const b = readKeys(P2KEYS); x = b.x; y = b.y;
                }
                const d = Math.hypot(x, y);
                if (d > 1) { x /= d; y /= d; }
                return { x, y };
            }

            // =====================================================================
            //  Effects helpers
            // =====================================================================
            function puff(x, y, z, n, color, spd = 120, size = 6, grav = 300) {
                for (let i = 0; i < n; i++) {
                    const a = Math.random() * Math.PI * 2, s = rand(.3, 1) * spd;
                    particles.push({
                        x, y, z, vx: Math.cos(a) * s, vy: Math.sin(a) * s * .7, vz: rand(.2, 1) * spd * .9,
                        life: rand(.35, .7), max: .7, size: rand(.6, 1.2) * size, color, g: grav
                    });
                }
            }
            function popup(text, color, sub, size = 92, dur = 1.5) {
                popups.length = 0;
                popups.push({ text, color, sub, size, t: 0, dur });
            }
            function shake(m) { game.shake = Math.max(game.shake, m); }

            // =====================================================================
            //  Match flow
            // =====================================================================
            function startGame() {
                Snd.init();
                players[1].cpu = settings.mode === 1;
                players[1].img = settings.mode === 1 ? 'robot' : 'player2';
                players[1].name = settings.mode === 1 ? 'Robo' : 'Blue';
                for (const p of players) {
                    p.fx.speed = p.fx.racket = p.fx.freeze = 0; p.frozen = 0;
                    p.rs = 1; p.rsv = 0; p.celebT = 0; p.swingT = 0;
                }
                game.score = [0, 0]; game.big = { t: 0, owner: null }; ball.rs = 1; ball.rsv = 0;
                game.puTimer = rand(5, 7); pu = null; particles.length = 0; popups.length = 0; confetti.length = 0;
                game.server = 0; game.winner = -1; game.paused = false;
                showScreen(null);
                $('gameBtns').classList.remove('hidden');
                $('dpad').classList.toggle('hidden', !touchMode);
                startServe();
            }
            function startServe() {
                game.state = 'serve'; game.serveT = 1.8; game.lastCount = 0; game.rally = 0;
                game.lastHitter = null;
                const [a, b] = players;
                a.x = 0; a.y = CL + 70; b.x = 0; b.y = -50;
                for (const p of players) { p.vx = p.vy = 0; p.react = 0; }
                ball.fire = false; ball.trail.length = 0;
                holdBall();
            }
            function holdBall() {
                const s = players[game.server];
                ball.x = s.x + s.side * 34; ball.y = s.y + (s.idx === 0 ? -6 : 6);
                ball.z = 95 + Math.sin(game.time * 5) * 14;
                ball.vx = ball.vy = ball.vz = 0;
            }
            function serveNow() {
                if (game.state !== 'serve') return;
                hit(players[game.server], true);
                game.state = 'rally';
                Snd.beep(true);
            }
            function pointTo(idx) {
                if (game.state !== 'rally') return;
                game.state = 'point'; game.pointT = 1.9;
                game.score[idx]++; game.scoreBump[idx] = 1;
                const p = players[idx];
                p.celebT = 1.5;
                Snd.cheer();
                if (settings.mode === 1 && idx === 1) Snd.aww();
                const pg = proj(p.x, p.y, 120);
                puff(p.x, p.y, 120, 26, p.color, 220, 8, 200);
                puff(p.x, p.y, 120, 16, '#ffd84a', 200, 7, 200);
                const sub = game.score[idx] >= WIN_SCORE ? 'GAME!' : (p.name + ' scores!');
                popup('POINT!', p.color, sub, 120, 1.7);
                game.server = 1 - idx;     // loser serves
                ball.fire = false;
                void pg;
            }
            function endGame(idx) {
                game.state = 'over'; game.winner = idx;
                Snd.win();
                const w = players[idx];
                const art = $('winArt');
                art.innerHTML = '';
                const trophy = ok('trophy') ? Object.assign(document.createElement('img'), { src: ASSET_DIR + 'trophy.png', className: 'trophy', alt: '' })
                    : Object.assign(document.createElement('span'), { textContent: '🏆', className: 'emoji trophy' });
                const champ = ok(w.img) ? Object.assign(document.createElement('img'), { src: ASSET_DIR + ASSETS[w.img], className: 'champ', alt: '' })
                    : Object.assign(document.createElement('span'), { textContent: w.cpu ? '🤖' : '🧒', className: 'emoji champ' });
                art.append(champ, trophy);
                let title, sub;
                if (settings.mode === 1) {
                    title = idx === 0 ? 'You Win! 🎉' : 'Robo Wins!';
                    sub = idx === 0 ? 'Super Tennis Star!' : 'So close! Try again — you can do it!';
                } else {
                    title = w.name + ' Wins! 🎉';
                    sub = 'What a match!';
                }
                $('winTitle').textContent = title;
                $('winTitle').style.color = idx === 0 ? '#ff8a95' : '#8ec2ff';
                $('winScore').innerHTML = `<span class="r">${game.score[0]}</span> – <span class="b">${game.score[1]}</span>`;
                $('winSub').textContent = sub;
                $('gameBtns').classList.add('hidden');
                $('dpad').classList.add('hidden');
                showScreen('scrWin');
                burstConfetti(220);
            }
            function goMenu() {
                game.state = 'title'; game.paused = false;
                $('gameBtns').classList.add('hidden');
                $('dpad').classList.add('hidden');
                confetti.length = 0;
                showScreen('scrTitle');
            }
            function showScreen(id) {
                for (const s of ['scrTitle', 'scrPause', 'scrWin']) $(s).classList.toggle('show', s === id);
            }
            const inPlay = () => game.state === 'serve' || game.state === 'rally' || game.state === 'point';
            function pause() {
                if (!inPlay() || game.paused) return;
                game.paused = true; showScreen('scrPause');
                for (const k in keys) keys[k] = false;
            }
            function resume() {
                if (!game.paused) return;
                game.paused = false; showScreen(null); Snd.click();
            }

            // =====================================================================
            //  Hitting
            // =====================================================================
            function hit(p, serve) {
                const o = players[1 - p.idx];
                const dir = p.idx === 0 ? -1 : 1;         // y direction the ball travels
                let S = BASE_SPEED * (1 + Math.min(game.rally, 12) * .035);
                if (serve) S *= .85;
                if (p.cpu) S *= DIFFS[settings.diff].pow;
                const fire = p.fx.speed > 0;
                if (fire) S *= 1.6;

                // ---- aim ----
                let xT;
                if (p.cpu) {
                    const d = settings.diff;
                    if (d === 'easy') xT = o.x * .3 + rand(-.35, .35) * CW;
                    else if (d === 'medium') xT = rand(-.65, .65) * CW;
                    else xT = -Math.sign(o.x || (Math.random() - .5)) * rand(.45, .82) * CW;
                } else if (serve) {
                    xT = rand(-.4, .4) * CW + (p.vx / P_SPEED) * .4 * CW;
                } else {
                    const off = clamp((ball.x - hitCenterX(p)) / hitHalfW(p), -1, 1);
                    xT = off * .55 * CW + (p.vx / P_SPEED) * .45 * CW + rand(-15, 15);
                }
                xT = clamp(xT, -.85 * CW, .85 * CW);

                const forward = (p.vy * dir) / P_SPEED;          // running toward the net = deeper shot
                const depth = clamp(rand(.5, .8) + forward * .12, .4, .9);
                const yT = NETY + dir * depth * NETY;
                const z0 = Math.max(ball.z, 22);
                const dist = Math.abs(yT - ball.y);
                const T = Math.max(.45, dist / S);
                const vy = (yT - ball.y) / T;
                let vz = (-z0 + .5 * G * T * T) / T;
                const tn = (NETY - ball.y) / vy;
                if (tn > 0 && tn < T) {
                    const need = NET_H + 25;
                    const zn = z0 + vz * tn - .5 * G * tn * tn;
                    if (zn < need) vz = (need - z0 + .5 * G * tn * tn) / tn;
                }
                ball.vx = (xT - ball.x) / T; ball.vy = vy; ball.vz = vz; ball.z = z0;
                ball.fire = fire;

                p.swingT = .28;
                game.lastHitter = p;
                game.rally++;
                Snd.hit(fire);
                puff(ball.x, ball.y, ball.z, fire ? 18 : 8, fire ? '#ffb02e' : '#fff7b0', fire ? 260 : 140, 5, 150);
                if (fire) { shake(16); }

                // CPU gets ready for the incoming ball
                if (o.cpu) {
                    const D = DIFFS[settings.diff];
                    o.react = D.react;
                    const miss = Math.random() < D.miss;
                    o.err = miss ? (Math.random() < .5 ? -1 : 1) * (hitHalfW(o) + ballR() + rand(25, 60)) : rand(-1, 1) * D.err;
                }
            }

            // =====================================================================
            //  Power-ups
            // =====================================================================
            const PU_TYPES = ['speed', 'bigball', 'bigracket', 'freeze'];
            const PU_INFO = {
                speed: { text: 'SUPER SPEED!', color: '#ff8a2a', glow: '255,140,40', dur: 8, emoji: '⚡' },
                bigball: { text: 'GIANT BALL!', color: '#c6f53a', glow: '200,245,60', dur: 8, emoji: '🎾' },
                bigracket: { text: 'MEGA RACKET!', color: '#c77dff', glow: '190,120,255', dur: 8, emoji: '🏸' },
                freeze: { text: 'FREEZE!', color: '#7fe3ff', glow: '120,220,255', dur: 3, emoji: '❄️' },
            };
            function spawnPU() {
                const half = Math.random() < .5 ? 0 : 1;
                const type = PU_TYPES[Math.floor(Math.random() * PU_TYPES.length)];
                const x = rand(-.75, .75) * CW;
                const y = half === 0 ? rand(NETY + 90, CL - 40) : rand(40, NETY - 90);
                pu = { type, x, y, t: 0, life: 8 };
                const cpu = players[1];
                cpu.chasePU = cpu.cpu && half === 1 && Math.random() < DIFFS[settings.diff].grab;
                Snd.tone(1200, .12, { type: 'triangle', vol: .08 });
                Snd.tone(1600, .12, { type: 'triangle', vol: .08, delay: .08 });
            }
            function grabPU(p) {
                const type = pu.type, info = PU_INFO[type], o = players[1 - p.idx];
                puff(pu.x, pu.y, 30, 28, info.color, 240, 8, 120);
                pu = null;
                game.puTimer = rand(6, 9);
                popup(info.text, info.color, p.name + ' got it!', 84, 1.4);
                Snd.chime();
                if (type === 'speed') { p.fx.speed = info.dur; Snd.noise(.4, { freq: 400, to: 3000, q: .6, vol: .2, delay: .1 }); }
                else if (type === 'bigball') { game.big = { t: info.dur, owner: p }; Snd.boing(); }
                else if (type === 'bigracket') { p.fx.racket = info.dur; Snd.grow(); }
                else if (type === 'freeze') {
                    p.fx.freeze = info.dur; o.frozen = info.dur; Snd.freeze();
                    puff(o.x, o.y, 60, 30, '#cfefff', 200, 7, 60);
                }
            }

            // =====================================================================
            //  Update
            // =====================================================================
            function spring(obj, key, vkey, target, dt) {
                const k = 260, damp = 9;
                obj[vkey] += (target - obj[key]) * k * dt;
                obj[vkey] *= Math.exp(-damp * dt);
                obj[key] += obj[vkey] * dt;
            }
            function updatePlayer(p, dt) {
                let inp;
                if (p.cpu) inp = cpuInput(p);
                else inp = inputFor(p);
                const sp = P_SPEED * (p.frozen > 0 ? .3 : 1) * (p.cpu ? DIFFS[settings.diff].speed / .95 * (inp.mag || 1) : 1);
                const tvx = inp.x * sp, tvy = inp.y * sp;
                const a = Math.min(1, dt * 14);
                p.vx += (tvx - p.vx) * a; p.vy += (tvy - p.vy) * a;
                // the server stays put while holding the ball
                if (game.state === 'serve' && game.server === p.idx) { p.vx *= .5; p.vy = 0; }
                p.x += p.vx * dt; p.y += p.vy * dt;
                p.x = clamp(p.x, -LIMX, LIMX);
                if (p.idx === 0) p.y = clamp(p.y, NETY + 60, CL + 120);
                else p.y = clamp(p.y, -100, NETY - 60);
                const spd = Math.hypot(p.vx, p.vy);
                p.moving = spd > 40;
                if (p.moving) p.animT += dt * (0.6 + spd / P_SPEED);
                p.lean += ((p.vx / P_SPEED) * .12 - p.lean) * Math.min(1, dt * 10);

                // timers
                p.swingT = Math.max(0, p.swingT - dt);
                p.celebT = Math.max(0, p.celebT - dt);
                if (game.state !== 'point') {
                    p.fx.speed = Math.max(0, p.fx.speed - dt);
                    p.fx.racket = Math.max(0, p.fx.racket - dt);
                    p.fx.freeze = Math.max(0, p.fx.freeze - dt);
                    p.frozen = Math.max(0, p.frozen - dt);
                }
                spring(p, 'rs', 'rsv', p.fx.racket > 0 ? 2 : 1, dt);
                if (p.frozen > 0 && Math.random() < dt * 8) puff(p.x + rand(-40, 40), p.y, rand(20, 140), 1, '#e6f8ff', 30, 4, -20);
            }

            function cpuInput(p) {
                const D = DIFFS[settings.diff];
                let tx = 0, ty = 10;
                if (game.state === 'rally' && ball.vy < 0) {
                    if (p.react > 0) { tx = p.x; ty = p.y; }
                    else {
                        const t = Math.max(0, (ball.y - p.y) / -ball.vy);
                        let px = ball.x + ball.vx * t;
                        for (let i = 0; i < 3; i++) {
                            if (px > BUMPER) px = 2 * BUMPER - px;
                            else if (px < -BUMPER) px = -2 * BUMPER - px;
                        }
                        tx = px + p.err - p.side * 26 * p.rs;
                        ty = clamp(p.y, -20, 30);
                    }
                } else if (game.state === 'serve') {
                    if (game.server === p.idx) { tx = p.x; ty = p.y; }
                    else { tx = 0; ty = -30; }
                } else if (game.state === 'rally') {
                    if (pu && p.chasePU && pu.y < NETY && ball.vy > 0 && Math.abs(ball.y - CL) > 120) { tx = pu.x; ty = pu.y; }
                    else { tx = players[0].x * .25; ty = 0; }
                } else if (game.state === 'point') {
                    tx = p.x; ty = p.y;
                }
                const dx = tx - p.x, dy = ty - p.y, d = Math.hypot(dx, dy);
                if (d < 6) return { x: 0, y: 0 };
                return { x: dx / d, y: dy / d, mag: Math.min(1, d / 30) };
            }

            function updateBall(dt) {
                const R = ballR();
                if (game.state === 'serve') { holdBall(); ball.rot += dt * 2; return; }
                ball.x += ball.vx * dt; ball.y += ball.vy * dt;
                ball.vz -= G * dt; ball.z += ball.vz * dt;
                ball.rot += dt * Math.hypot(ball.vx, ball.vy) / 35;
                if (ball.z <= 0 && ball.vz < 0) {
                    const v = -ball.vz;
                    ball.z = 0;
                    if (v > 70) {
                        ball.vz = v * .62;
                        Snd.bounce(v / 1800);
                        puff(ball.x, ball.y, 0, 7, 'rgba(255,255,255,.9)', 90, 6, 200);
                    } else ball.vz = 0;
                }
                if (ball.x > BUMPER) { ball.x = BUMPER; ball.vx = -Math.abs(ball.vx) * .8; }
                if (ball.x < -BUMPER) { ball.x = -BUMPER; ball.vx = Math.abs(ball.vx) * .8; }

                ball.trail.push({ x: ball.x, y: ball.y, z: ball.z });
                if (ball.trail.length > 12) ball.trail.shift();
                if (ball.fire) {
                    for (let i = 0; i < 2; i++) particles.push({
                        x: ball.x + rand(-6, 6), y: ball.y + rand(-6, 6), z: ball.z + rand(-4, 8),
                        vx: rand(-30, 30), vy: -ball.vy * .05, vz: rand(20, 60), life: rand(.25, .45), max: .45,
                        size: rand(6, 11) * ball.rs, color: Math.random() < .5 ? '#ffcc33' : '#ff5a1f', g: -40, add: true
                    });
                }

                if (game.state !== 'rally') return;

                // hits
                const rec = ball.vy > 0 ? players[0] : players[1];
                if (rec !== game.lastHitter) {
                    const dx = ball.x - hitCenterX(rec), dy = ball.y - rec.y;
                    if (Math.abs(dx) < hitHalfW(rec) + R && Math.abs(dy) < 34 + R && ball.z < 175 + R * 2) hit(rec, false);
                }
                // power-up through the ball
                if (pu && game.lastHitter && ball.z < 150 && Math.hypot(ball.x - pu.x, ball.y - pu.y) < 45 + R) grabPU(game.lastHitter);

                // point over?
                if (ball.y > CL + 135) pointTo(1);
                else if (ball.y < -135) pointTo(0);
            }

            function update(dt) {
                game.time += dt;
                game.shake = Math.max(0, game.shake - dt * 40);
                game.scoreBump[0] = Math.max(0, game.scoreBump[0] - dt * 2.5);
                game.scoreBump[1] = Math.max(0, game.scoreBump[1] - dt * 2.5);

                if (inPlay()) {
                    for (const p of players) updatePlayer(p, dt);
                    for (const p of players) p.react = Math.max(0, p.react - dt);

                    if (game.state === 'serve') {
                        game.serveT -= dt;
                        const c = Math.ceil(game.serveT / .6);
                        if (c !== game.lastCount && c > 0) { game.lastCount = c; Snd.beep(false); }
                        if (game.serveT <= 0) serveNow();
                    }
                    if (game.state === 'point') {
                        game.pointT -= dt;
                        if (game.pointT <= 0) {
                            const w = game.score[0] >= WIN_SCORE ? 0 : game.score[1] >= WIN_SCORE ? 1 : -1;
                            if (w >= 0) endGame(w); else startServe();
                        }
                    }
                    updateBall(dt);

                    // power-ups
                    if (game.state !== 'point') {
                        if (game.big.t > 0) game.big.t = Math.max(0, game.big.t - dt);
                        if (!pu) {
                            game.puTimer -= dt;
                            if (game.puTimer <= 0) spawnPU();
                        } else {
                            pu.t += dt; pu.life -= dt;
                            if (pu.life <= 0) { puff(pu.x, pu.y, 30, 10, '#fff', 120, 6, 100); pu = null; game.puTimer = rand(6, 9); }
                            else for (const p of players) {
                                if (pu && Math.hypot(p.x - pu.x, (p.y - pu.y) * 1.2) < 58) grabPU(p);
                            }
                        }
                    }
                    const bigTarget = game.big.t > 0 ? 2.5 : 1;
                    spring(ball, 'rs', 'rsv', bigTarget, dt);
                    if (ball.rs < .4) ball.rs = .4;
                } else {
                    // idle: keep things settling (e.g. win screen)
                    for (const p of players) { p.celebT = Math.max(0, p.celebT - dt); p.swingT = Math.max(0, p.swingT - dt); }
                }

                for (let i = particles.length - 1; i >= 0; i--) {
                    const q = particles[i];
                    q.life -= dt;
                    if (q.life <= 0) { particles.splice(i, 1); continue; }
                    q.x += q.vx * dt; q.y += q.vy * dt; q.z += q.vz * dt; q.vz -= q.g * dt;
                    if (q.z < 0) { q.z = 0; q.vz *= -.3; q.vx *= .7; q.vy *= .7; }
                }
                for (let i = popups.length - 1; i >= 0; i--) { popups[i].t += dt; if (popups[i].t > popups[i].dur) popups.splice(i, 1); }
            }

            // =====================================================================
            //  Rendering
            // =====================================================================
            const crowd = (() => {
                const arr = []; let s = 7;
                const r = () => (s = (s * 9301 + 49297) % 233280) / 233280;
                const cols = ['#ff6b6b', '#ffd84a', '#6fb0ff', '#ffffff', '#7be495', '#ff9ff3', '#ffa94d', '#c77dff'];
                for (let row = 0; row < 5; row++) for (let i = 0; i < 46; i++) {
                    arr.push({ x: i * 20 + (row % 2) * 10 + r() * 6 - 3, y: 20 + row * 24 + r() * 4, c: cols[Math.floor(r() * cols.length)], ph: r() * 6.28 });
                }
                return arr;
            })();

            function font(px, w = 800) { return `${w} ${px}px "Baloo 2", "Nunito", sans-serif`; }
            function outlineText(text, x, y, px, fill, stroke = '#0b1a3a', sw = 8, align = 'center') {
                ctx.font = font(px); ctx.textAlign = align; ctx.textBaseline = 'middle';
                ctx.lineJoin = 'round'; ctx.lineWidth = sw; ctx.strokeStyle = stroke;
                ctx.strokeText(text, x, y); ctx.fillStyle = fill; ctx.fillText(text, x, y);
            }
            function rrect(c, x, y, w, h, r) {
                c.beginPath();
                c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r);
                c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
            }
            function quad(pts) {
                ctx.beginPath(); ctx.moveTo(pts[0].x, pts[0].y);
                for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
                ctx.closePath();
            }
            function wline(x1, y1, x2, y2, w) {
                const a = proj(x1, y1), b = proj(x2, y2);
                ctx.lineWidth = w * (a.s + b.s) / 2;
                ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
            }

            function drawBackdrop() {
                ctx.setTransform(1, 0, 0, 1, 0, 0);
                if (ok('title')) {
                    const im = IMG.title.img, s = Math.max(W / im.naturalWidth, H / im.naturalHeight);
                    ctx.drawImage(im, (W - im.naturalWidth * s) / 2, (H - im.naturalHeight * s) / 2, im.naturalWidth * s, im.naturalHeight * s);
                    ctx.fillStyle = 'rgba(6,14,36,.62)'; ctx.fillRect(0, 0, W, H);
                } else {
                    const g = ctx.createLinearGradient(0, 0, 0, H);
                    g.addColorStop(0, '#0d1e48'); g.addColorStop(1, '#1d6b3a');
                    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
                }
            }

            function drawStadium() {
                // grass (outside court)
                const g = ctx.createLinearGradient(0, 140, 0, LH);
                g.addColorStop(0, '#2f9a4c'); g.addColorStop(1, '#3dbb5c');
                ctx.fillStyle = g; ctx.fillRect(0, 140, LW, LH - 140);
                // mowing stripes
                ctx.fillStyle = 'rgba(255,255,255,.045)';
                for (let y = -140; y < CL + 160; y += 80) {
                    const a = proj(-600, y), b = proj(600, y), c2 = proj(600, y + 40), d = proj(-600, y + 40);
                    quad([a, b, c2, d]); ctx.fill();
                }
                // stands + crowd
                const sg = ctx.createLinearGradient(0, 0, 0, 150);
                sg.addColorStop(0, '#0f2457'); sg.addColorStop(1, '#1b3a80');
                ctx.fillStyle = sg; ctx.fillRect(0, 0, LW, 150);
                for (const c of crowd) {
                    const jump = (game.state === 'point' || game.state === 'over') ? Math.max(0, Math.sin(game.time * 12 + c.ph)) * 5 : Math.sin(game.time * 2 + c.ph) * .8;
                    ctx.fillStyle = c.c;
                    ctx.beginPath(); ctx.arc(c.x, c.y - jump, 7, 0, 7); ctx.fill();
                    ctx.fillStyle = 'rgba(255,224,190,.9)';
                    ctx.beginPath(); ctx.arc(c.x, c.y - 9 - jump, 5, 0, 7); ctx.fill();
                }
                // wall
                const wg = ctx.createLinearGradient(0, 132, 0, 160);
                wg.addColorStop(0, '#1d4fa6'); wg.addColorStop(1, '#123478');
                ctx.fillStyle = wg; ctx.fillRect(0, 132, LW, 28);
                ctx.fillStyle = 'rgba(255,255,255,.75)'; ctx.font = font(18, 800); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.fillText('★  SUPER TENNIS STARS  ★  SUPER TENNIS STARS  ★', LW / 2, 147);
                ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.fillRect(0, 160, LW, 8);
            }

            function drawCourt() {
                // soft shadow under the court edge
                const c0 = proj(-CW - 18, -18), c1 = proj(CW + 18, -18), c2 = proj(CW + 18, CL + 18), c3 = proj(-CW - 18, CL + 18);
                quad([c0, c1, c2, c3]); ctx.fillStyle = 'rgba(20,70,40,.35)'; ctx.fill();
                // blue surface
                const a = proj(-CW, 0), b = proj(CW, 0), c = proj(CW, CL), d = proj(-CW, CL);
                const g = ctx.createLinearGradient(0, a.y, 0, d.y);
                g.addColorStop(0, '#2a62c4'); g.addColorStop(.5, '#3274db'); g.addColorStop(1, '#3a80e8');
                quad([a, b, c, d]); ctx.fillStyle = g; ctx.fill();
                // subtle texture sheen
                const sh = ctx.createRadialGradient(LW / 2, proj(0, CL * .7).y, 40, LW / 2, proj(0, CL * .7).y, 520);
                sh.addColorStop(0, 'rgba(255,255,255,.10)'); sh.addColorStop(1, 'rgba(255,255,255,0)');
                quad([a, b, c, d]); ctx.fillStyle = sh; ctx.fill();

                // lines
                ctx.strokeStyle = '#fff'; ctx.lineCap = 'square';
                const SW = CW * .78, SV = NETY * .54;
                wline(-CW, 0, CW, 0, 6); wline(-CW, CL, CW, CL, 6);
                wline(-CW, 0, -CW, CL, 5); wline(CW, 0, CW, CL, 5);
                wline(-SW, 0, -SW, CL, 4); wline(SW, 0, SW, CL, 4);
                wline(-SW, NETY - SV, SW, NETY - SV, 4); wline(-SW, NETY + SV, SW, NETY + SV, 4);
                wline(0, NETY - SV, 0, NETY + SV, 4);
                wline(0, 0, 0, 12, 4); wline(0, CL, 0, CL - 12, 4);
            }

            function netTopZ(x) {
                const k = Math.abs(x) / (CW + 28);
                return NET_H + 10 * k * k;
            }
            function drawNet() {
                const X0 = -CW - 28, X1 = CW + 28;
                // shadow
                ctx.fillStyle = 'rgba(0,0,20,.22)';
                quad([proj(X0, NETY), proj(X1, NETY), proj(X1 + 14, NETY + 26), proj(X0 + 14, NETY + 26)]); ctx.fill();
                // mesh background
                ctx.beginPath();
                ctx.moveTo(proj(X0, NETY).x, proj(X0, NETY).y);
                for (let x = X0; x <= X1; x += 20) { const p = proj(x, NETY, netTopZ(x)); ctx.lineTo(p.x, p.y); }
                ctx.lineTo(proj(X1, NETY).x, proj(X1, NETY).y);
                ctx.closePath();
                ctx.fillStyle = 'rgba(15,20,35,.28)'; ctx.fill();
                // mesh lines
                ctx.strokeStyle = 'rgba(25,30,45,.75)'; ctx.lineWidth = 1.2;
                for (let x = X0; x <= X1; x += 11) {
                    const p0 = proj(x, NETY, 0), p1 = proj(x, NETY, netTopZ(x));
                    ctx.beginPath(); ctx.moveTo(p0.x, p0.y); ctx.lineTo(p1.x, p1.y); ctx.stroke();
                }
                for (let z = 6; z < NET_H + 8; z += 7) {
                    ctx.beginPath();
                    let first = true;
                    for (let x = X0; x <= X1; x += 20) {
                        if (z > netTopZ(x)) continue;
                        const p = proj(x, NETY, z);
                        if (first) { ctx.moveTo(p.x, p.y); first = false; } else ctx.lineTo(p.x, p.y);
                    }
                    ctx.stroke();
                }
                // white tape
                ctx.strokeStyle = '#fff'; ctx.lineWidth = 6; ctx.lineJoin = 'round';
                ctx.beginPath();
                for (let x = X0; x <= X1; x += 10) { const p = proj(x, NETY, netTopZ(x)); if (x === X0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y); }
                ctx.stroke();
                // center strap
                const s0 = proj(0, NETY, 0), s1 = proj(0, NETY, NET_H);
                ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(s0.x, s0.y); ctx.lineTo(s1.x, s1.y); ctx.stroke();
                // posts
                for (const x of [X0, X1]) {
                    const b = proj(x, NETY, 0), t = proj(x, NETY, NET_H + 16);
                    ctx.fillStyle = 'rgba(0,0,0,.25)';
                    ctx.beginPath(); ctx.ellipse(b.x + 4, b.y + 3, 12, 5, 0, 0, 7); ctx.fill();
                    const pg = ctx.createLinearGradient(b.x - 6, 0, b.x + 6, 0);
                    pg.addColorStop(0, '#2b3a55'); pg.addColorStop(.5, '#6e86b0'); pg.addColorStop(1, '#1e2a40');
                    ctx.fillStyle = pg; rrect(ctx, b.x - 6, t.y, 12, b.y - t.y, 4); ctx.fill();
                    ctx.fillStyle = '#ffd84a'; ctx.beginPath(); ctx.arc(t.x, t.y, 7, 0, 7); ctx.fill();
                }
            }

            function shadow(x, y, rx, ry, alpha) {
                const p = proj(x, y);
                ctx.fillStyle = `rgba(0,10,40,${alpha})`;
                ctx.beginPath(); ctx.ellipse(p.x, p.y, rx * p.s, ry * p.s, 0, 0, 7); ctx.fill();
            }

            function drawTinted(im, x, y, w, h) {
                const sc = VS;
                const tw = Math.max(1, Math.ceil(w * sc)), th = Math.max(1, Math.ceil(h * sc));
                if (tintC.width !== tw || tintC.height !== th) { tintC.width = tw; tintC.height = th; }
                tctx.globalCompositeOperation = 'source-over';
                tctx.clearRect(0, 0, tw, th);
                tctx.drawImage(im, 0, 0, tw, th);
                tctx.globalCompositeOperation = 'source-atop';
                tctx.fillStyle = 'rgba(110,200,255,.55)'; tctx.fillRect(0, 0, tw, th);
                ctx.drawImage(tintC, x, y, w, h);
            }

            function drawFallbackKid(p, PW, PH, frozen) {
                const col = frozen ? '#9fdcff' : p.cpu ? '#8a96ad' : p.color;
                // legs
                ctx.fillStyle = frozen ? '#b9e6ff' : '#2b2f4a';
                rrect(ctx, -PW * .22, -PH * .32, PW * .16, PH * .32, 6); ctx.fill();
                rrect(ctx, PW * .06, -PH * .32, PW * .16, PH * .32, 6); ctx.fill();
                // body
                ctx.fillStyle = col; rrect(ctx, -PW * .3, -PH * .66, PW * .6, PH * .38, 14); ctx.fill();
                // head
                ctx.fillStyle = p.cpu ? '#c3cad8' : (frozen ? '#d8f2ff' : '#ffd2a8');
                if (p.cpu) { rrect(ctx, -PW * .26, -PH * .98, PW * .52, PH * .32, 12); ctx.fill(); }
                else { ctx.beginPath(); ctx.arc(0, -PH * .8, PH * .16, 0, 7); ctx.fill(); }
                ctx.fillStyle = p.cpu ? '#3df2ff' : '#222';
                ctx.beginPath(); ctx.arc(-PH * .06, -PH * .82, PH * .022, 0, 7); ctx.arc(PH * .06, -PH * .82, PH * .022, 0, 7); ctx.fill();
            }
            function drawFallbackRacket(p, RW, RL) {
                ctx.fillStyle = '#3b2a1a'; rrect(ctx, -RW * .1, -RL * .45, RW * .2, RL * .45, 4); ctx.fill();
                ctx.strokeStyle = p.idx === 0 ? '#ff4d5e' : '#3d8bff'; ctx.lineWidth = RW * .12;
                ctx.beginPath(); ctx.ellipse(0, -RL * .7, RW * .42, RL * .27, 0, 0, 7); ctx.stroke();
                ctx.strokeStyle = 'rgba(255,255,255,.7)'; ctx.lineWidth = 1;
                for (let i = -3; i <= 3; i++) {
                    ctx.beginPath(); ctx.moveTo(i * RW * .1, -RL * .95); ctx.lineTo(i * RW * .1, -RL * .45); ctx.stroke();
                    ctx.beginPath(); ctx.moveTo(-RW * .4, -RL * .7 + i * RL * .07); ctx.lineTo(RW * .4, -RL * .7 + i * RL * .07); ctx.stroke();
                }
            }

            function drawPlayer(p) {
                const g = proj(p.x, p.y, 0);
                const PH = 170 * g.s;
                const asp = ok(p.img) ? IMG[p.img].img.naturalWidth / IMG[p.img].img.naturalHeight : .57;
                const PW = PH * asp;
                const t = game.time;
                const hop = p.celebT > 0 ? Math.abs(Math.sin((1.5 - p.celebT) * 8)) * 38 : 0;
                const bob = p.moving ? Math.abs(Math.sin(p.animT * 13)) * 7 : 0;
                let sq = p.moving ? 1 + Math.sin(p.animT * 26) * .045 : 1 + Math.sin(t * 3 + p.idx) * .015;
                if (p.celebT > 0 && hop < 6) sq = .9;
                const frozen = p.frozen > 0;
                const lift = (hop + bob) * g.s;

                // shadow
                const shScale = 1 - Math.min(.4, (hop + bob) / 120);
                shadow(p.x, p.y, 46 * shScale, 13 * shScale, .3);

                ctx.save();
                ctx.translate(g.x + (frozen ? Math.sin(t * 40) * 1.2 : 0), g.y - lift);
                ctx.rotate(p.lean);
                ctx.scale(1 / Math.sqrt(sq), sq);
                if (ok(p.img)) {
                    if (frozen) drawTinted(IMG[p.img].img, -PW / 2, -PH, PW, PH);
                    else ctx.drawImage(IMG[p.img].img, -PW / 2, -PH, PW, PH);
                } else drawFallbackKid(p, PW, PH, frozen);

                // racket
                const rKey = ok(p.racket) ? p.racket : ok('racket') ? 'racket' : null;
                const RL = PH * .5 * p.rs;
                const RW = rKey ? RL * IMG[rKey].img.naturalWidth / IMG[rKey].img.naturalHeight : RL * .4;
                const k = p.swingT > 0 ? 1 - p.swingT / .28 : 0;
                const rest = p.side * (.35 + Math.sin(t * 2.2 + p.idx) * .04);
                const ang = rest - p.side * Math.sin(k * Math.PI) * 1.9;
                ctx.save();
                ctx.translate(p.side * PW * .38, -PH * .45);
                ctx.rotate(ang);
                if (rKey) {
                    if (frozen) drawTinted(IMG[rKey].img, -RW / 2, -RL * .97, RW, RL);
                    else ctx.drawImage(IMG[rKey].img, -RW / 2, -RL * .97, RW, RL);
                } else drawFallbackRacket(p, RW, RL);
                // swing whoosh
                if (k > 0 && k < .8) {
                    ctx.strokeStyle = `rgba(255,255,255,${.5 * (1 - k)})`; ctx.lineWidth = 6; ctx.lineCap = 'round';
                    ctx.beginPath(); ctx.arc(0, 0, RL * .75, -Math.PI / 2 - .2, -Math.PI / 2 + p.side * .9, p.side < 0); ctx.stroke();
                }
                ctx.restore();

                // ice block
                if (frozen) {
                    const a = Math.min(1, p.frozen * 2);
                    ctx.globalAlpha = a;
                    const ig = ctx.createLinearGradient(-PW * .7, -PH * 1.1, PW * .7, 0);
                    ig.addColorStop(0, 'rgba(220,245,255,.45)'); ig.addColorStop(.5, 'rgba(140,210,255,.25)'); ig.addColorStop(1, 'rgba(200,240,255,.45)');
                    rrect(ctx, -PW * .75, -PH * 1.08, PW * 1.5, PH * 1.12, 16 * g.s);
                    ctx.fillStyle = ig; ctx.fill();
                    ctx.strokeStyle = 'rgba(255,255,255,.85)'; ctx.lineWidth = 3; ctx.stroke();
                    ctx.strokeStyle = 'rgba(255,255,255,.6)'; ctx.lineWidth = 4;
                    ctx.beginPath(); ctx.moveTo(-PW * .55, -PH * .95); ctx.lineTo(-PW * .3, -PH * 1.02); ctx.stroke();
                    ctx.globalAlpha = 1;
                }
                ctx.restore();

                // speed aura
                if (p.fx.speed > 0) {
                    const pulse = .5 + Math.sin(t * 10) * .2;
                    ctx.save(); ctx.globalCompositeOperation = 'lighter';
                    const rg = ctx.createRadialGradient(g.x, g.y - lift - PH * .5, 10, g.x, g.y - lift - PH * .5, PH * .7);
                    rg.addColorStop(0, `rgba(255,140,40,${.25 * pulse})`); rg.addColorStop(1, 'rgba(255,80,0,0)');
                    ctx.fillStyle = rg; ctx.fillRect(g.x - PH, g.y - lift - PH * 1.3, PH * 2, PH * 1.6);
                    ctx.restore();
                }
            }

            function drawBallShadowAndTrail() {
                if (game.state === 'title' || game.state === 'over') return;
                const R = ballR();
                const zs = Math.max(.35, 1 - ball.z / 260);
                shadow(ball.x, ball.y, R * 1.3 * zs, R * .55 * zs, .35 * zs);
            }
            function drawBall() {
                if (game.state === 'title' || game.state === 'over') return;
                const R = ballR();
                // trail
                if (game.state !== 'serve') {
                    for (let i = 0; i < ball.trail.length; i++) {
                        const q = ball.trail[i], p = proj(q.x, q.y, q.z), k = i / ball.trail.length;
                        const r = R * p.s * (1 + q.z / 500) * (.3 + .6 * k);
                        ctx.fillStyle = ball.fire ? `rgba(255,${120 + 100 * k | 0},40,${.5 * k})` : `rgba(230,255,140,${.28 * k})`;
                        ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, 7); ctx.fill();
                    }
                }
                const p = proj(ball.x, ball.y, ball.z);
                const D = 2 * R * p.s * (1 + ball.z / 500);
                if (ball.fire) {
                    ctx.save(); ctx.globalCompositeOperation = 'lighter';
                    const rg = ctx.createRadialGradient(p.x, p.y, D * .2, p.x, p.y, D * 1.6);
                    rg.addColorStop(0, 'rgba(255,170,40,.7)'); rg.addColorStop(1, 'rgba(255,60,0,0)');
                    ctx.fillStyle = rg; ctx.beginPath(); ctx.arc(p.x, p.y, D * 1.6, 0, 7); ctx.fill();
                    ctx.restore();
                }
                ctx.save();
                ctx.translate(p.x, p.y); ctx.rotate(ball.rot);
                if (ok('ball')) ctx.drawImage(IMG.ball.img, -D / 2, -D / 2, D, D);
                else {
                    ctx.fillStyle = '#d9f23a'; ctx.beginPath(); ctx.arc(0, 0, D / 2, 0, 7); ctx.fill();
                    ctx.strokeStyle = '#fff'; ctx.lineWidth = Math.max(1.5, D * .07);
                    ctx.beginPath(); ctx.arc(-D * .55, 0, D * .42, -1, 1); ctx.stroke();
                    ctx.beginPath(); ctx.arc(D * .55, 0, D * .42, Math.PI - 1, Math.PI + 1); ctx.stroke();
                }
                ctx.restore();
            }

            function drawPU() {
                if (!pu) return;
                const info = PU_INFO[pu.type];
                const z = 34 + Math.sin(pu.t * 4) * 10;
                const pop = Math.min(1, pu.t * 4);
                const sc = pop < 1 ? 1 + Math.sin(pop * Math.PI) * .35 : 1;
                if (pu.life < 2 && Math.floor(pu.t * 10) % 2 === 0) return;   // blink before vanishing
                shadow(pu.x, pu.y, 34 * pop, 11 * pop, .28);
                const p = proj(pu.x, pu.y, z);
                const S = 84 * p.s * pop * sc;
                // glow
                ctx.save(); ctx.globalCompositeOperation = 'lighter';
                const gl = .55 + Math.sin(pu.t * 6) * .25;
                const rg = ctx.createRadialGradient(p.x, p.y, S * .2, p.x, p.y, S * 1.1);
                rg.addColorStop(0, `rgba(${info.glow},${gl})`); rg.addColorStop(1, `rgba(${info.glow},0)`);
                ctx.fillStyle = rg; ctx.beginPath(); ctx.arc(p.x, p.y, S * 1.1, 0, 7); ctx.fill();
                ctx.restore();
                // spinning dashed ring
                ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(pu.t * 1.6);
                ctx.setLineDash([8, 9]); ctx.strokeStyle = 'rgba(255,255,255,.85)'; ctx.lineWidth = 3;
                ctx.beginPath(); ctx.arc(0, 0, S * .64, 0, 7); ctx.stroke(); ctx.setLineDash([]);
                ctx.restore();
                if (ok(pu.type)) ctx.drawImage(IMG[pu.type].img, p.x - S / 2, p.y - S / 2, S, S);
                else {
                    ctx.fillStyle = info.color; ctx.beginPath(); ctx.arc(p.x, p.y, S / 2, 0, 7); ctx.fill();
                    ctx.strokeStyle = '#fff'; ctx.lineWidth = 4; ctx.stroke();
                    ctx.font = font(S * .5); ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = '#fff';
                    ctx.fillText(info.emoji, p.x, p.y + 2);
                }
                // sparkles
                for (let i = 0; i < 3; i++) {
                    const a = pu.t * 2 + i * 2.1, r = S * .75;
                    const sx = p.x + Math.cos(a) * r, sy = p.y + Math.sin(a) * r * .6;
                    ctx.fillStyle = 'rgba(255,255,255,.9)';
                    ctx.beginPath(); ctx.arc(sx, sy, 3 + Math.sin(pu.t * 8 + i) * 1.5, 0, 7); ctx.fill();
                }
            }

            function drawParticles(front) {
                for (const q of particles) {
                    if ((q.y > NETY) !== front) continue;
                    const p = proj(q.x, q.y, q.z), a = clamp(q.life / q.max, 0, 1);
                    if (q.add) { ctx.save(); ctx.globalCompositeOperation = 'lighter'; }
                    ctx.globalAlpha = a; ctx.fillStyle = q.color;
                    ctx.beginPath(); ctx.arc(p.x, p.y, q.size * p.s * (.5 + a * .5), 0, 7); ctx.fill();
                    ctx.globalAlpha = 1;
                    if (q.add) ctx.restore();
                }
            }

            function drawAvatar(p, cx, cy, r) {
                ctx.save();
                ctx.beginPath(); ctx.arc(cx, cy, r, 0, 7);
                ctx.fillStyle = 'rgba(255,255,255,.95)'; ctx.fill();
                ctx.clip();
                if (ok(p.img)) {
                    const im = IMG[p.img].img, h = r * 6.2, w = h * im.naturalWidth / im.naturalHeight;
                    ctx.drawImage(im, cx - w / 2, cy - r * 1.15, w, h);
                } else {
                    ctx.fillStyle = p.cpu ? '#8a96ad' : p.color; ctx.fillRect(cx - r, cy - r, r * 2, r * 2);
                    ctx.font = font(r * 1.1); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                    ctx.fillText(p.cpu ? '🤖' : '🧒', cx, cy + 2);
                }
                ctx.restore();
                ctx.strokeStyle = p.color; ctx.lineWidth = 5;
                ctx.beginPath(); ctx.arc(cx, cy, r, 0, 7); ctx.stroke();
            }

            function effectsFor(p) {
                const out = [];
                if (p.fx.speed > 0) out.push(['speed', p.fx.speed, 8]);
                if (game.big.t > 0 && game.big.owner === p) out.push(['bigball', game.big.t, 8]);
                if (p.fx.racket > 0) out.push(['bigracket', p.fx.racket, 8]);
                if (p.fx.freeze > 0) out.push(['freeze', p.fx.freeze, 3]);
                return out;
            }

            function drawScoreboard() {
                const cards = [{ p: players[0], x: 14 }, { p: players[1], x: LW - 14 - 330 }];
                for (const { p, x } of cards) {
                    const y = 14, w = 330, h = 104, right = p.idx === 1;
                    ctx.fillStyle = 'rgba(8,16,44,.82)';
                    rrect(ctx, x, y, w, h, 22); ctx.fill();
                    ctx.strokeStyle = p.color; ctx.lineWidth = 4; ctx.stroke();
                    const ax = right ? x + w - 56 : x + 56;
                    drawAvatar(p, ax, y + h / 2, 38);
                    // name + pips
                    const nx = right ? x + w - 108 : x + 108;
                    ctx.font = font(26); ctx.textAlign = right ? 'right' : 'left'; ctx.textBaseline = 'middle';
                    ctx.fillStyle = '#fff'; ctx.fillText(p.name + (p.cpu ? ' 🤖' : ''), nx, y + 34);
                    for (let i = 0; i < WIN_SCORE; i++) {
                        const px = right ? nx - 9 - i * 24 : nx + 9 + i * 24;
                        ctx.beginPath(); ctx.arc(px, y + 72, 9, 0, 7);
                        ctx.fillStyle = i < game.score[p.idx] ? '#ffd84a' : 'rgba(255,255,255,.18)'; ctx.fill();
                    }
                    // big score
                    const sx = right ? x + 42 : x + w - 42;
                    const b = game.scoreBump[p.idx];
                    ctx.save(); ctx.translate(sx, y + h / 2 + 4); ctx.scale(1 + b * .5, 1 + b * .5);
                    outlineText(String(game.score[p.idx]), 0, 0, 72, '#ffd84a', '#0b1a3a', 8);
                    ctx.restore();
                    // active effect icons with timer rings
                    const fx = effectsFor(p);
                    fx.forEach(([type, tLeft, max], i) => {
                        const ix = right ? x + w - 28 - i * 56 : x + 28 + i * 56, iy = y + h + 30, r = 22;
                        ctx.fillStyle = 'rgba(8,16,44,.8)'; ctx.beginPath(); ctx.arc(ix, iy, r + 5, 0, 7); ctx.fill();
                        if (ok(type)) ctx.drawImage(IMG[type].img, ix - r, iy - r, r * 2, r * 2);
                        else { ctx.font = font(24); ctx.textAlign = 'center'; ctx.fillStyle = '#fff'; ctx.fillText(PU_INFO[type].emoji, ix, iy + 1); }
                        ctx.strokeStyle = 'rgba(255,255,255,.2)'; ctx.lineWidth = 5;
                        ctx.beginPath(); ctx.arc(ix, iy, r + 3, 0, 7); ctx.stroke();
                        ctx.strokeStyle = PU_INFO[type].color; ctx.lineCap = 'round';
                        ctx.beginPath(); ctx.arc(ix, iy, r + 3, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * (tLeft / max)); ctx.stroke();
                        ctx.lineCap = 'butt';
                    });
                }
                // center plate
                ctx.fillStyle = 'rgba(8,16,44,.82)'; rrect(ctx, LW / 2 - 92, 26, 184, 80, 18); ctx.fill();
                ctx.font = font(20); ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = '#bcd4ff';
                ctx.fillText('FIRST TO ' + WIN_SCORE, LW / 2, 48);
                if (game.rally >= 2 && game.state === 'rally') {
                    outlineText('Rally ' + game.rally + '!', LW / 2, 80, 30, game.rally >= 8 ? '#ff9a3d' : '#fff', '#0b1a3a', 6);
                } else {
                    ctx.font = font(26); ctx.fillStyle = '#fff'; ctx.fillText('🎾', LW / 2, 80);
                }
            }

            function drawOverlayText() {
                // serve countdown
                if (game.state === 'serve') {
                    const c = Math.ceil(game.serveT / .6);
                    const frac = (game.serveT / .6) % 1;
                    const s = 1 + frac * .35;
                    const sp = players[game.server];
                    ctx.save(); ctx.translate(LW / 2, proj(0, NETY).y - 120); ctx.scale(s, s);
                    outlineText(c > 0 ? String(c) : 'GO!', 0, 0, 110, '#fff', '#0b1a3a', 12);
                    ctx.restore();
                    const human = !sp.cpu;
                    outlineText(human ? `${sp.name} serves — press a key!` : `${sp.name} serves...`, LW / 2, proj(0, NETY).y - 40, 32, sp.color === '#ff4d5e' ? '#ffb3ba' : '#b8d6ff', '#0b1a3a', 7);
                }
                for (const pp of popups) {
                    const k = pp.t / pp.dur;
                    const inS = Math.min(1, pp.t / .25);
                    const s = inS < 1 ? .3 + 1.0 * (1 - Math.pow(1 - inS, 3)) + Math.sin(inS * Math.PI) * .3 : 1 + Math.sin(pp.t * 8) * .03;
                    const a = k > .8 ? 1 - (k - .8) / .2 : 1;
                    ctx.save(); ctx.globalAlpha = a;
