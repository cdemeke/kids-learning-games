                    ctx.translate(LW / 2, LH * .44 - k * 30); ctx.rotate(-.05); ctx.scale(s, s);
                    outlineText(pp.text, 0, 0, pp.size, pp.color, '#0b1a3a', 14);
                    if (pp.sub) outlineText(pp.sub, 0, pp.size * .72, pp.size * .38, '#fff', '#0b1a3a', 8);
                    ctx.restore();
                }
            }

            function render() {
                drawBackdrop();
                const sx = game.shake ? rand(-1, 1) * game.shake : 0, sy = game.shake ? rand(-1, 1) * game.shake : 0;
                ctx.setTransform(VS, 0, 0, VS, OX + sx * VS, OY + sy * VS);
                ctx.save(); ctx.beginPath(); ctx.rect(0, 0, LW, LH); ctx.clip();
                drawStadium();
                drawCourt();
                const showPlayers = game.state !== 'title';
                // far half
                drawBallShadowAndTrailIf(false);
                if (pu && pu.y < NETY) drawPU();
                const far = [], near = [];
                if (showPlayers) for (const p of players) (p.y < NETY ? far : near).push({ y: p.y, d: () => drawPlayer(p) });
                const bItem = { y: ball.y, d: drawBall };
                if (showPlayers) (ball.y < NETY ? far : near).push(bItem);
                far.sort((a, b) => a.y - b.y).forEach(o => o.d());
                drawParticles(false);
                drawNet();
                drawBallShadowAndTrailIf(true);
                if (pu && pu.y >= NETY) drawPU();
                near.sort((a, b) => a.y - b.y).forEach(o => o.d());
                drawParticles(true);
                ctx.restore();
                if (game.state !== 'title') {
                    drawScoreboard();
                    drawOverlayText();
                }
                // letterbox edge glow
                ctx.strokeStyle = 'rgba(255,255,255,.08)'; ctx.lineWidth = 3; ctx.strokeRect(0, 0, LW, LH);
            }
            function drawBallShadowAndTrailIf(front) {
                if ((ball.y >= NETY) === front && game.state !== 'title') drawBallShadowAndTrail();
            }

            // ---- confetti (overlay canvas, screen space) ----
            function burstConfetti(n) {
                const cols = ['#ff4d5e', '#ffd84a', '#3d8bff', '#7be495', '#ff9ff3', '#ffffff', '#ffa94d'];
                for (let i = 0; i < n; i++) confetti.push({
                    x: rand(0, W), y: rand(-H * .6, -10), vx: rand(-60, 60) * DPR, vy: rand(120, 300) * DPR,
                    r: rand(0, 6.28), vr: rand(-8, 8), w: rand(8, 14) * DPR, h: rand(5, 9) * DPR, c: cols[i % cols.length], ph: rand(0, 6.28)
                });
            }
            function updateConfetti(dt) {
                fctx.setTransform(1, 0, 0, 1, 0, 0);
                fctx.clearRect(0, 0, W, H);
                if (game.state === 'over' && confetti.length < 160 && Math.random() < dt * 20) burstConfetti(4);
                for (let i = confetti.length - 1; i >= 0; i--) {
                    const c = confetti[i];
                    c.ph += dt * 4; c.x += (c.vx + Math.sin(c.ph) * 40 * DPR) * dt; c.y += c.vy * dt; c.r += c.vr * dt;
                    if (c.y > H + 30) { confetti.splice(i, 1); continue; }
                    fctx.save(); fctx.translate(c.x, c.y); fctx.rotate(c.r); fctx.scale(1, Math.abs(Math.cos(c.ph)));
                    fctx.fillStyle = c.c; fctx.fillRect(-c.w / 2, -c.h / 2, c.w, c.h);
                    fctx.restore();
                }
            }

            // =====================================================================
            //  Menu UI
            // =====================================================================
            const keyCaps = (cls, k) => `<div class="keys ${cls}"><kbd>${k[0]}</kbd><kbd>${k[1]}</kbd><kbd>${k[2]}</kbd><kbd>${k[3]}</kbd></div>`;
            const WASD = ['W', 'A', 'S', 'D'], ARROWS = ['▲', '◀', '▼', '▶'];
            const imgTag = k => `<img src="${ASSET_DIR}${ASSETS[k]}" alt="" onerror="this.style.display='none'">`;
            function renderControls() {
                const el = $('controls');
                if (settings.mode === 1) {
                    el.innerHTML = `<div class="ctl">${imgTag('player1')}<div class="who" style="color:#ff8a95">You<br><span class="or">move with</span></div>${keyCaps('red', WASD)}<span class="or">or</span>${keyCaps('red', ARROWS)}</div>`;
                } else {
                    el.innerHTML = `<div class="ctl">${imgTag('player1')}<div class="who" style="color:#ff8a95">Red</div>${keyCaps('red', WASD)}</div>`
                        + `<div class="ctl">${imgTag('player2')}<div class="who" style="color:#8ec2ff">Blue</div>${keyCaps('blue', ARROWS)}</div>`;
                }
                el.insertAdjacentHTML('beforeend', `<div class="or" style="width:100%">Just run to the ball — your racket swings by itself! <kbd style="display:inline-flex">P</kbd> pauses.</div>`);
            }
            function syncMenu() {
                document.querySelectorAll('#segMode button').forEach(b => b.classList.toggle('on', +b.dataset.mode === settings.mode));
                document.querySelectorAll('#segDiff button').forEach(b => b.classList.toggle('on', b.dataset.diff === settings.diff));
                $('diffWrap').classList.toggle('hidden', settings.mode !== 1);
                renderControls();
            }
            document.querySelectorAll('#segMode button').forEach(b => b.addEventListener('click', () => {
                Snd.init(); Snd.click(); settings.mode = +b.dataset.mode; syncMenu(); b.blur();
            }));
            document.querySelectorAll('#segDiff button').forEach(b => b.addEventListener('click', () => {
                Snd.init(); Snd.click(); settings.diff = b.dataset.diff; syncMenu(); b.blur();
            }));
            try {
                const saved = JSON.parse(localStorage.getItem('superTennisStars') || '{}');
                if (saved.mode === 1 || saved.mode === 2) settings.mode = saved.mode;
                if (DIFFS[saved.diff]) settings.diff = saved.diff;
            } catch (e) { /* storage unavailable */ }
            function persist() { try { localStorage.setItem('superTennisStars', JSON.stringify(settings)); } catch (e) { /* ignore */ } }
            syncMenu();

            let ready = false;
            function play() { if (!ready) return; persist(); Snd.click(); startGame(); }
            $('btnPlay').addEventListener('click', e => { e.currentTarget.blur(); play(); });
            $('btnResume').addEventListener('click', resume);
            $('btnPauseMenu').addEventListener('click', () => { Snd.click(); goMenu(); });
            $('btnAgain').addEventListener('click', () => { Snd.click(); startGame(); });
            $('btnWinMenu').addEventListener('click', () => { Snd.click(); goMenu(); });
            $('btnPause').addEventListener('click', e => { e.currentTarget.blur(); pause(); });
            function syncSoundBtn() { $('btnSound').textContent = Snd.muted ? '🔇' : '🔊'; }
            $('btnSound').addEventListener('click', e => { e.currentTarget.blur(); Snd.init(); Snd.setMuted(!Snd.muted); syncSoundBtn(); });

            // =====================================================================
            //  Keyboard
            // =====================================================================
            addEventListener('keydown', e => {
                if (PREVENT.has(e.code)) e.preventDefault();
                keys[e.code] = true;
                if (e.repeat) return;
                Snd.init();
                const code = e.code;
                if (code === 'KeyM') { Snd.setMuted(!Snd.muted); syncSoundBtn(); return; }
                if (game.state === 'title') {
                    if (code === 'Enter' || code === 'Space') { e.preventDefault(); play(); }
                    else if (code === 'Digit1') { settings.mode = 1; syncMenu(); }
                    else if (code === 'Digit2') { settings.mode = 2; syncMenu(); }
                    return;
                }
                if (game.state === 'over') {
                    if (code === 'Enter' || code === 'Space') { e.preventDefault(); $('btnAgain').click(); }
                    else if (code === 'Escape') goMenu();
                    return;
                }
                if (code === 'KeyP' || code === 'Escape') { game.paused ? resume() : pause(); return; }
                if (game.paused) { if (code === 'Enter' || code === 'Space') resume(); return; }
                // serve early on a key press (any key in 1P; the server's own keys / Space / Enter in 2P)
                if (game.state === 'serve' && game.serveT < 1.55) {
                    const s = players[game.server];
                    if (!s.cpu) {
                        const own = s.idx === 0 ? P1KEYS : P2KEYS;
                        if (settings.mode === 1 || own.includes(code) || code === 'Space' || code === 'Enter') serveNow();
                    }
                }
            });
            addEventListener('keyup', e => { keys[e.code] = false; });
            addEventListener('blur', () => { for (const k in keys) keys[k] = false; pause(); });
            document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });

            // =====================================================================
            //  Touch D-pad (Player 1)
            // =====================================================================
            let touchMode = matchMedia('(pointer: coarse)').matches;
            addEventListener('touchstart', () => {
                if (!touchMode) { touchMode = true; if (inPlay()) $('dpad').classList.remove('hidden'); }
            }, { passive: true });
            const pad = $('dpad'), knob = $('dpadKnob');
            let padId = null;
            function padMove(e) {
                const r = pad.getBoundingClientRect();
                let dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2);
                const max = r.width / 2 - 20, d = Math.hypot(dx, dy);
                if (d > max) { dx *= max / d; dy *= max / d; }
                knob.style.transform = `translate(${dx}px,${dy}px)`;
                const nx = dx / max, ny = dy / max;
                const m = Math.hypot(nx, ny);
                if (m < .2) { touch.x = touch.y = 0; }
                else { touch.x = nx / Math.max(m, .001) * Math.min(1, m * 1.4); touch.y = ny / Math.max(m, .001) * Math.min(1, m * 1.4); }
            }
            function padEnd(e) {
                if (e.pointerId !== padId) return;
                padId = null; touch.x = touch.y = 0; knob.style.transform = '';
            }
            pad.addEventListener('pointerdown', e => {
                e.preventDefault(); Snd.init();
                padId = e.pointerId; pad.setPointerCapture(e.pointerId); padMove(e);
            });
            pad.addEventListener('pointermove', e => { if (e.pointerId === padId) padMove(e); });
            pad.addEventListener('pointerup', padEnd);
            pad.addEventListener('pointercancel', padEnd);
            cvs.addEventListener('pointerdown', () => {
                Snd.init();
                if (game.state === 'serve' && !game.paused && game.serveT < 1.55 && !players[game.server].cpu) serveNow();
            });

            // =====================================================================
            //  Main loop
            // =====================================================================
            let last = performance.now();
            function frame(now) {
                requestAnimationFrame(frame);
                const dt = Math.min(1 / 30, (now - last) / 1000);
                last = now;
                if (W !== Math.floor(innerWidth * DPR) || H !== Math.floor(innerHeight * DPR)) resize();
                if (!W || !H) return;
                if (!game.paused) update(dt);
                render();
                updateConfetti(dt);
            }
            requestAnimationFrame(frame);

            loadAssets(k => { $('loadBar').style.width = (k * 100) + '%'; }).then(() => {
                ready = true;
                $('loading').classList.add('hidden');
                $('btnPlay').classList.remove('hidden');
            });

            // handy for testing from the console
            window.__tennis = { game, players, ball, settings, startGame, spawnPU, grabPU: i => { if (!pu) spawnPU(); grabPU(players[i]); }, get pu() { return pu; } };
        })();
    </script>
</body>

</html>
