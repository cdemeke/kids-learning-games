<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Unicorn Number Magic - Same or Different?</title>
    <meta name="description" content="Two unicorns, two numbers. Are they the same or different? Count stars, match numbers, add with plus magic and paint a rainbow to meet new unicorn friends.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@700;800;900&display=swap" media="print" onload="this.media='all'">
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@700;800;900&display=swap"></noscript>
    <script defer src="assets/unicorn-numbers/logic.js"></script>
    <script defer src="assets/unicorn-numbers/game.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        :root {
            --ink: #4a2f6b;
            --ink-soft: #7a5f9a;
            --pink: #ff6fb1;
            --pink-dark: #e04592;
            --purple: #8a5cff;
            --purple-dark: #6a3ee0;
            --gold: #ffcf3a;
            --cream: #fff8fd;
            /* the size of one unicorn column: fits two side by side on a phone and in short landscape */
            --col: min(calc((100vw - 32px - 64px) / 2), calc((100dvh - 390px) / 1.45), 300px);
        }

        [hidden] { display: none !important; }

        html, body { height: 100%; overflow: hidden; overscroll-behavior: none; }

        body {
            font-family: 'Nunito', sans-serif;
            color: var(--ink);
            background: linear-gradient(180deg, #bfe6ff 0%, #e6dcff 45%, #ffd9ef 75%, #c9f2c4 75.2%, #a5e59a 100%);
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            touch-action: manipulation;
        }

        /* ---------- sky decoration ---------- */
        .sky { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 0; }
        .cloud {
            position: absolute;
            width: 120px; height: 40px;
            background: #fff;
            border-radius: 40px;
            opacity: .85;
            animation: drift linear infinite;
        }
        .cloud::before, .cloud::after { content: ''; position: absolute; background: #fff; border-radius: 50%; }
        .cloud::before { width: 54px; height: 54px; left: 18px; top: -26px; }
        .cloud::after { width: 40px; height: 40px; left: 58px; top: -16px; }
        @keyframes drift { from { transform: translateX(-160px); } to { transform: translateX(calc(100vw + 160px)); } }
        .twinkle { position: absolute; color: #fff; animation: twinkle 2.4s ease-in-out infinite; font-size: 18px; }
        @keyframes twinkle { 0%, 100% { opacity: .2; transform: scale(.7); } 50% { opacity: 1; transform: scale(1.1); } }

        /* ---------- chips ---------- */
        .chip {
            position: fixed;
            top: max(12px, env(safe-area-inset-top));
            z-index: 40;
            display: flex; align-items: center; justify-content: center; gap: 6px;
            height: 48px; min-width: 48px; padding: 0 16px;
            border: 3px solid #fff;
            border-radius: 26px;
            background: linear-gradient(180deg, #ffffff, #f6ecff);
            color: var(--ink);
            font: 900 0.95rem 'Nunito', sans-serif;
            text-decoration: none;
            box-shadow: 0 4px 14px rgba(90, 50, 140, .22);
            cursor: pointer;
        }
        .chip:active { transform: scale(.95); }
        .home-btn { left: max(12px, env(safe-area-inset-left)); }
        .right-chips { position: fixed; top: max(12px, env(safe-area-inset-top)); right: max(12px, env(safe-area-inset-right)); z-index: 40; display: flex; gap: 8px; }
        .right-chips .chip { position: static; padding: 0; width: 48px; font-size: 1.3rem; }

        /* ---------- screens ---------- */
        .screen {
            position: fixed; inset: 0; z-index: 10;
            display: flex; flex-direction: column; align-items: center;
            padding: calc(max(12px, env(safe-area-inset-top)) + 58px) 16px max(16px, env(safe-area-inset-bottom));
        }

        /* ---------- menu ---------- */
        #menu { overflow-y: auto; justify-content: flex-start; gap: 14px; }
        .title {
            font-family: 'Baloo 2', cursive;
            font-weight: 800;
            font-size: clamp(2rem, 7vw, 3.4rem);
            line-height: 1;
            text-align: center;
            color: #fff;
            text-shadow: 0 3px 0 var(--pink-dark), 0 6px 0 var(--purple-dark), 0 10px 18px rgba(80, 30, 140, .3);
        }
        .subtitle { font-weight: 900; font-size: clamp(1rem, 3.6vw, 1.25rem); text-align: center; color: var(--ink); }
        .stable {
            display: flex; flex-wrap: wrap; justify-content: center; gap: 8px;
            max-width: 720px;
            padding: 12px;
            background: rgba(255, 255, 255, .7);
            border: 3px solid #fff;
            border-radius: 24px;
        }
        .stable-title { width: 100%; text-align: center; font-weight: 900; font-size: .95rem; color: var(--ink-soft); }
        .friend {
            width: 76px;
            display: flex; flex-direction: column; align-items: center;
            padding: 4px 2px 6px;
            border: 3px solid transparent;
            border-radius: 18px;
            background: none;
            font: 900 .78rem 'Nunito', sans-serif;
            color: var(--ink);
            cursor: pointer;
        }
        .friend svg { width: 66px; height: 60px; }
        .friend.chosen { border-color: var(--pink); background: #fff; }
        .friend.locked { cursor: default; opacity: .55; }
        .friend.locked svg { filter: brightness(0) opacity(.35); }
        .modes { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; width: min(100%, 640px); }
        .mode-btn {
            display: flex; flex-direction: column; align-items: center; gap: 2px;
            padding: 14px 10px;
            border: 4px solid #fff;
            border-radius: 24px;
            background: linear-gradient(160deg, #fff, #fbeaff);
            box-shadow: 0 6px 0 #d7b8f5, 0 10px 20px rgba(90, 50, 140, .2);
            font-family: 'Nunito', sans-serif;
            color: var(--ink);
            cursor: pointer;
            transition: transform .12s;
        }
        .mode-btn:hover, .mode-btn:focus-visible { transform: translateY(-3px); outline: none; }
        .mode-btn:focus-visible { border-color: var(--pink); }
        .mode-btn:active { transform: translateY(3px); box-shadow: 0 2px 0 #d7b8f5; }
        .mode-icon { font-size: 2.2rem; line-height: 1.1; }
        .mode-name { font-family: 'Baloo 2', cursive; font-weight: 800; font-size: 1.3rem; line-height: 1.1; }
        .mode-desc { font-weight: 800; font-size: .85rem; color: var(--ink-soft); text-align: center; }
        .mode-badge { font-size: .85rem; font-weight: 900; color: var(--pink-dark); min-height: 1.1em; }

        /* ---------- play ---------- */
        #play { justify-content: space-between; gap: 6px; }
        .rainbow-meter { width: min(70vw, 260px); height: auto; flex: none; margin-top: -50px; pointer-events: none; }
        .question {
            font-family: 'Baloo 2', cursive;
            font-weight: 800;
            font-size: clamp(1.25rem, 4.6vw, 2rem);
            text-align: center;
            line-height: 1.1;
            min-height: 1.2em;
            color: var(--ink);
            text-shadow: 0 2px 0 #fff;
        }
        .stage {
            flex: 1 1 auto;
            min-height: 0;
            width: 100%;
            display: flex; align-items: center; justify-content: center;
        }
        .pair { display: flex; align-items: flex-start; justify-content: center; gap: clamp(4px, 2vw, 24px); }
        .side { width: var(--col); display: flex; flex-direction: column; align-items: center; position: relative; }
        .bubble {
            position: relative;
            width: 100%;
            aspect-ratio: 1.35;
            display: flex; align-items: center; justify-content: center;
            background: #fff;
            border: 4px solid #f0dcff;
            border-radius: 30px;
            box-shadow: 0 6px 0 #e3c8fb, 0 10px 22px rgba(90, 50, 140, .18);
            transition: transform .2s, border-color .2s, box-shadow .2s;
        }
        .bubble::after {
            content: '';
            position: absolute;
            bottom: -16px; left: 50%;
            width: 24px; height: 24px;
            background: #fff;
            border-right: 4px solid #f0dcff;
            border-bottom: 4px solid #f0dcff;
            transform: translateX(-50%) rotate(45deg);
        }
        .bubble svg.stars { width: 92%; height: 88%; overflow: visible; }
        .bubble .numeral {
            font-family: 'Baloo 2', cursive;
            font-weight: 800;
            font-size: calc(var(--col) * .42);
            line-height: 1;
            color: var(--purple-dark);
        }
        .bubble .sum { font-size: calc(var(--col) * .25); white-space: nowrap; }
        .bubble .sum .plus { color: var(--pink); }
        .side.tappable .bubble { cursor: pointer; border-color: var(--gold); animation: pulse 1s ease-in-out infinite; }
        .side.winner .bubble { border-color: var(--gold); box-shadow: 0 6px 0 #f2b81f, 0 0 0 6px rgba(255, 207, 58, .4); }
        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.04); } }
        .hint {
            position: absolute; top: -14px; right: -8px; z-index: 2;
            min-width: 36px; height: 36px; padding: 0 8px;
            display: flex; align-items: center; justify-content: center;
            border-radius: 18px;
            background: var(--gold);
            color: var(--ink);
            font: 800 1.3rem 'Baloo 2', cursive;
            box-shadow: 0 3px 0 #e0a800;
            animation: pop .35s cubic-bezier(.3, 1.8, .5, 1);
        }
        .count-tag { font: 800 15px 'Baloo 2', cursive; fill: var(--ink); }
        .uni-wrap { width: 88%; margin-top: 18px; cursor: pointer; }
        .uni-wrap svg { width: 100%; height: auto; display: block; overflow: visible; }
        .side.right .uni-wrap svg { transform: scaleX(-1); }
        .uni { transform-origin: 50% 100%; animation: bob 2.2s ease-in-out infinite; }
        .side.right .uni { animation-delay: -1.1s; }
        .uni.jump { animation: jump .7s cubic-bezier(.3, 1.4, .5, 1) 2; }
        .uni.shake { animation: shake .5s ease-in-out; }
        @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
        @keyframes jump { 0%, 100% { transform: translateY(0) rotate(0); } 40% { transform: translateY(-28px) rotate(-6deg); } }
        @keyframes shake { 0%, 100% { transform: rotate(0); } 25% { transform: rotate(-5deg); } 75% { transform: rotate(5deg); } }
        @keyframes pop { from { transform: scale(0); } to { transform: scale(1); } }
        .uni-name { font-weight: 900; font-size: .9rem; color: var(--ink-soft); margin-top: 2px; }

        .sign {
            flex: none;
            width: clamp(44px, 11vw, 84px); height: clamp(44px, 11vw, 84px);
            margin-top: calc(var(--col) / 1.35 / 2 - clamp(22px, 5.5vw, 42px));
            display: flex; align-items: center; justify-content: center;
            border-radius: 50%;
            background: #fff;
            border: 4px solid #f0dcff;
            font: 800 clamp(1.8rem, 7vw, 3.2rem) 'Baloo 2', cursive;
            line-height: 1;
            color: var(--ink-soft);
            box-shadow: 0 4px 0 #e3c8fb;
        }
        .sign.same { background: var(--pink); border-color: #fff; color: #fff; animation: pop .35s cubic-bezier(.3, 1.8, .5, 1); }
        .sign.diff { background: var(--purple); border-color: #fff; color: #fff; animation: pop .35s cubic-bezier(.3, 1.8, .5, 1); }

        .feedback {
            font-family: 'Baloo 2', cursive;
            font-weight: 800;
            font-size: clamp(1.2rem, 4.4vw, 1.9rem);
            min-height: 1.3em;
            text-align: center;
            color: var(--pink-dark);
            text-shadow: 0 2px 0 #fff;
        }
        .answers { display: flex; gap: clamp(10px, 4vw, 28px); width: min(100%, 620px); }
        .answer {
            flex: 1;
            display: flex; align-items: center; justify-content: center; gap: 10px;
            min-height: 76px;
            padding: 8px 10px;
            border: 4px solid #fff;
            border-radius: 30px;
            color: #fff;
            font: 800 clamp(1.4rem, 5.4vw, 2.1rem) 'Baloo 2', cursive;
            cursor: pointer;
            transition: transform .1s, opacity .2s;
        }
        .answer .big { font-size: 1.5em; line-height: 0; }
        .answer.same-btn { background: linear-gradient(180deg, #ff8cc3, var(--pink)); box-shadow: 0 7px 0 var(--pink-dark), 0 12px 22px rgba(224, 69, 146, .35); }
        .answer.diff-btn { background: linear-gradient(180deg, #a585ff, var(--purple)); box-shadow: 0 7px 0 var(--purple-dark), 0 12px 22px rgba(106, 62, 224, .35); }
        .answer:active { transform: translateY(5px); }
        .answer:disabled { opacity: .35; cursor: default; transform: none; }
        .answer:focus-visible { outline: 4px solid var(--gold); outline-offset: 3px; }

        /* ---------- sparkles ---------- */
        .fx { position: fixed; inset: 0; pointer-events: none; z-index: 50; overflow: hidden; }
        .spark { position: absolute; font-size: 26px; animation: burst 1s ease-out forwards; }
        @keyframes burst {
            from { transform: translate(-50%, -50%) scale(.4); opacity: 1; }
            to { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1.1) rotate(160deg); opacity: 0; }
        }

        /* ---------- results overlay ---------- */
        .overlay {
            position: fixed; inset: 0; z-index: 60;
            display: flex; align-items: center; justify-content: center;
            padding: 16px;
            background: rgba(74, 47, 107, .45);
        }
        .card {
            width: min(100%, 460px);
            max-height: 100%;
            overflow-y: auto;
            padding: 22px 20px 20px;
            text-align: center;
            background: var(--cream);
            border: 5px solid #fff;
            border-radius: 32px;
            box-shadow: 0 20px 50px rgba(60, 20, 110, .35);
            animation: pop .4s cubic-bezier(.3, 1.6, .5, 1);
        }
        .card h2 { font-family: 'Baloo 2', cursive; font-weight: 800; font-size: 2rem; line-height: 1.1; color: var(--pink-dark); }
        .card p { font-weight: 800; font-size: 1.05rem; margin-top: 6px; }
        .card .big-rainbow { width: 220px; max-width: 80%; margin: 4px auto 0; display: block; }
        .card .new-friend svg { width: 140px; height: 126px; }
        .card .buttons { display: flex; gap: 10px; justify-content: center; margin-top: 16px; flex-wrap: wrap; }
        .card button {
            padding: 12px 22px;
            border: 3px solid #fff;
            border-radius: 24px;
            font: 800 1.2rem 'Baloo 2', cursive;
            color: #fff;
            background: var(--pink);
            box-shadow: 0 5px 0 var(--pink-dark);
            cursor: pointer;
        }
        .card button.alt { background: var(--purple); box-shadow: 0 5px 0 var(--purple-dark); }

        /* short landscape phones: tighten everything */
        @media (max-height: 520px) {
            :root { --col: min(30vw, 31dvh, 240px); }
            .screen { padding-top: calc(max(8px, env(safe-area-inset-top)) + 4px); }
            #menu { padding-top: calc(max(8px, env(safe-area-inset-top)) + 56px); }
            .rainbow-meter { width: 110px; margin-top: 0; }
            .question { font-size: 1.15rem; }
            .feedback { font-size: 1.1rem; min-height: 1.2em; }
            #play { gap: 2px; }
            .answer { min-height: 56px; }
            .uni-wrap { width: 70%; margin-top: 12px; }
            .uni-name { display: none; }
            .modes { grid-template-columns: repeat(4, minmax(0, 1fr)); }
            .mode-desc { display: none; }
        }
        @media (max-width: 520px) and (min-height: 521px) {
            .rainbow-meter { width: 190px; margin-top: 0; }
            .uni-wrap { width: 100%; }
        }
        @media (max-width: 420px) {
            .home-btn .label { display: none; }
            .mode-desc { font-size: .78rem; }
            .mode-name { font-size: 1.1rem; }
        }
        @media (prefers-reduced-motion: reduce) {
            .uni, .cloud, .twinkle, .side.tappable .bubble { animation: none !important; }
        }
    </style>
</head>
<body>
    <div class="sky" aria-hidden="true">
        <div class="cloud" style="top:9%;animation-duration:70s;animation-delay:-20s"></div>
        <div class="cloud" style="top:24%;animation-duration:95s;animation-delay:-60s;transform:scale(.7)"></div>
        <div class="cloud" style="top:40%;animation-duration:80s;animation-delay:-5s"></div>
        <span class="twinkle" style="top:14%;left:12%">✦</span>
        <span class="twinkle" style="top:30%;left:85%;animation-delay:-.8s">✦</span>
        <span class="twinkle" style="top:52%;left:6%;animation-delay:-1.6s">✦</span>
        <span class="twinkle" style="top:8%;left:62%;animation-delay:-1.2s">✦</span>
    </div>

    <a href="index.html" class="chip home-btn" aria-label="Back to all games">🏠 <span class="label">Games</span></a>
    <div class="right-chips">
        <button id="menuBtn" class="chip" type="button" aria-label="Pick a game" hidden>🦄</button>
        <button id="sayBtn" class="chip" type="button" aria-label="Hear the question" hidden>🗣️</button>
        <button id="soundBtn" class="chip" type="button" aria-label="Sound on">🔊</button>
    </div>

    <main id="menu" class="screen">
        <h1 class="title">Unicorn<br>Number Magic</h1>
        <p class="subtitle">Two unicorns, two numbers. Same or different?</p>
        <div class="modes" id="modes"></div>
        <div class="stable" id="stable"></div>
    </main>

    <main id="play" class="screen" hidden>
        <svg class="rainbow-meter" id="meter" viewBox="0 0 220 112" aria-hidden="true"></svg>
        <p class="question" id="question" aria-live="polite"></p>
        <div class="stage">
            <div class="pair">
            <div class="side left" id="sideL">
                <div class="bubble" id="bubbleL"></div>
                <div class="uni-wrap" id="uniL"></div>
                <div class="uni-name" id="nameL"></div>
            </div>
            <div class="sign" id="sign" aria-hidden="true">?</div>
            <div class="side right" id="sideR">
                <div class="bubble" id="bubbleR"></div>
                <div class="uni-wrap" id="uniR"></div>
                <div class="uni-name" id="nameR"></div>
            </div>
            </div>
        </div>
        <p class="feedback" id="feedback" aria-live="assertive"></p>
        <div class="answers" id="answers">
            <button class="answer same-btn" id="sameBtn" type="button"><span class="big">=</span> Same</button>
            <button class="answer diff-btn" id="diffBtn" type="button"><span class="big">≠</span> Different</button>
        </div>
    </main>

    <div class="overlay" id="overlay" hidden>
        <div class="card" role="dialog" aria-modal="true" aria-labelledby="doneTitle">
            <svg class="big-rainbow" id="bigRainbow" viewBox="0 0 220 112" aria-hidden="true"></svg>
            <h2 id="doneTitle">You made a rainbow!</h2>
            <p id="doneText"></p>
            <div class="new-friend" id="newFriend"></div>
            <div class="buttons">
                <button id="againBtn" type="button">Play again</button>
                <button id="pickBtn" class="alt" type="button">Pick a game</button>
            </div>
        </div>
    </div>

    <div class="fx" id="fx" aria-hidden="true"></div>
    <noscript><p style="position:fixed;inset:auto 0 40%;text-align:center;font-weight:900">Turn on JavaScript to meet the unicorns!</p></noscript>
</body>
</html>
