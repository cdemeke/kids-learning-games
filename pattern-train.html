<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Pattern Train - What Comes Next?</title>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Nunito:wght@600;700&display=swap"
        rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Nunito', sans-serif;
            background: linear-gradient(180deg, #A8E6CF 0%, #7FD8BE 45%, #56C596 100%);
            min-height: 100vh;
            overflow: hidden;
            touch-action: manipulation;
        }

        .game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            max-width: 900px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow: hidden;
        }

        /* Hills */
        .hill {
            position: absolute;
            border-radius: 50%;
            background: rgba(46, 139, 87, 0.35);
            pointer-events: none;
            z-index: 0;
        }

        .hill1 { width: 500px; height: 300px; bottom: -160px; left: -120px; }
        .hill2 { width: 600px; height: 340px; bottom: -190px; right: -150px; background: rgba(46, 139, 87, 0.25); }

        /* Sun and birds */
        .sun {
            position: absolute;
            top: 24px;
            right: 42px;
            width: 64px;
            height: 64px;
            background: radial-gradient(circle at 35% 35%, #FFF59D, #FFB300);
            border-radius: 50%;
            box-shadow: 0 0 45px rgba(255, 235, 59, 0.7);
            z-index: 0;
        }

        .bird {
            position: absolute;
            font-size: 1.6rem;
            animation: birdFly 22s linear infinite;
            pointer-events: none;
            z-index: 0;
        }

        @keyframes birdFly {
            from { transform: translateX(-60px); }
            to { transform: translateX(calc(100vw + 60px)); }
        }

        .home-btn {
            position: fixed;
            top: 15px;
            left: 15px;
            z-index: 1000;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.95), rgba(255, 255, 255, 0.85));
            border: 2px solid #2E8B57;
            color: #1B5E20;
            padding: 10px 18px;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: 700;
            text-decoration: none;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .home-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.2);
        }

        .score-board {
            position: fixed;
            top: 15px;
            right: 15px;
            z-index: 1000;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.95), rgba(255, 255, 255, 0.85));
            border: 2px solid #FF8F00;
            border-radius: 50px;
            padding: 10px 18px;
            font-size: 1.1rem;
            font-weight: 800;
            color: #E65100;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
        }

        .title {
            font-family: 'Baloo 2', cursive;
            font-size: clamp(1.5rem, 5vw, 2.4rem);
            font-weight: 800;
            color: white;
            text-shadow: 3px 3px 0 #2E8B57, 5px 5px 0 rgba(0, 0, 0, 0.12);
            margin-top: 66px;
            z-index: 1;
        }

        .prompt-bubble {
            background: white;
            border: 4px solid #2E8B57;
            border-radius: 30px;
            padding: 12px 28px;
            margin-top: 10px;
            font-family: 'Baloo 2', cursive;
            font-size: clamp(1.1rem, 3.5vw, 1.6rem);
            font-weight: 700;
            color: #1B5E20;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
            z-index: 5;
            text-align: center;
        }

        /* Train area */
        .train-zone {
            flex: 1;
            width: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1;
            padding: 10px 0;
        }

        .train {
            display: flex;
            align-items: flex-end;
            gap: 6px;
            padding: 0 12px;
            max-width: 100%;
            overflow-x: auto;
            transition: transform 0.3s ease;
        }

        .train.chug {
            animation: chug 1.2s ease;
        }

        @keyframes chug {
            0% { transform: translateX(0); }
            30% { transform: translateX(18px); }
            60% { transform: translateX(-10px); }
            100% { transform: translateX(0); }
        }

        .engine {
            font-size: clamp(3rem, 11vw, 4.6rem);
            filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.25));
            animation: engineBounce 1.2s ease-in-out infinite;
            transform: scaleX(-1);
        }

        @keyframes engineBounce {
            0%, 100% { transform: scaleX(-1) translateY(0); }
            50% { transform: scaleX(-1) translateY(-4px); }
        }

        .traincar {
            width: clamp(56px, 13vw, 84px);
            height: clamp(56px, 13vw, 84px);
            background: linear-gradient(180deg, #8D6E63, #6D4C41);
            border: 4px solid #4E342E;
            border-radius: 12px 12px 6px 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: clamp(1.8rem, 7vw, 2.8rem);
            position: relative;
            box-shadow: 0 6px 14px rgba(0, 0, 0, 0.25);
            animation: carIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) backwards;
        }

        @keyframes carIn {
            from { transform: translateY(-30px) scale(0.6); opacity: 0; }
            to { transform: translateY(0) scale(1); opacity: 1; }
        }

        .traincar::after {
            content: '⚫ ⚫';
            position: absolute;
            bottom: -16px;
            font-size: 0.75rem;
            letter-spacing: 4px;
        }

        .traincar.mystery {
            background: linear-gradient(180deg, #FFD54F, #FFB300);
            border-color: #FF8F00;
            animation: mysteryPulse 1.2s ease-in-out infinite;
        }

        @keyframes mysteryPulse {
            0%, 100% { transform: scale(1); box-shadow: 0 6px 14px rgba(0, 0, 0, 0.25); }
            50% { transform: scale(1.08); box-shadow: 0 8px 24px rgba(255, 143, 0, 0.55); }
        }

        .traincar.filled {
            animation: fillPop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes fillPop {
            0% { transform: scale(0.4); }
            60% { transform: scale(1.25); }
            100% { transform: scale(1); }
        }

        /* Track */
        .track {
            width: 100%;
            height: 14px;
            margin-top: 20px;
            background: repeating-linear-gradient(90deg,
                    #5D4037 0 34px,
                    transparent 34px 46px),
                linear-gradient(180deg, transparent 0 4px, #8D6E63 4px 8px, transparent 8px);
            background-size: 46px 14px, 100% 14px;
        }

        /* Choices */
        .choices-label {
            font-family: 'Baloo 2', cursive;
            font-size: 1.1rem;
            font-weight: 700;
            color: white;
            text-shadow: 2px 2px 0 rgba(46, 139, 87, 0.8);
            margin-top: 6px;
            z-index: 5;
        }

        .choices {
            display: flex;
            justify-content: center;
            gap: min(24px, 4.5vw);
            padding: 12px 15px calc(26px + env(safe-area-inset-bottom));
            z-index: 5;
        }

        .choice {
            width: min(100px, 23vw);
            height: min(100px, 23vw);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: clamp(2.4rem, 10vw, 3.6rem);
            background: white;
            border: 5px solid #2E8B57;
            border-radius: 26px;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
            transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
            animation: choicePop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) backwards;
        }

        .choice:nth-child(1) { animation-delay: 0.05s; }
        .choice:nth-child(2) { animation-delay: 0.15s; }
        .choice:nth-child(3) { animation-delay: 0.25s; }

        @keyframes choicePop {
            from { transform: scale(0) rotate(-15deg); opacity: 0; }
            to { transform: scale(1) rotate(0); opacity: 1; }
        }

        .choice:hover { transform: scale(1.1); }
        .choice:active { transform: scale(0.94); }

        .choice.wrong {
            animation: wobble 0.5s ease;
        }

        @keyframes wobble {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-12px) rotate(-5deg); }
            40% { transform: translateX(12px) rotate(5deg); }
            60% { transform: translateX(-8px) rotate(-3deg); }
            80% { transform: translateX(8px) rotate(3deg); }
        }

        .burst {
            position: fixed;
            font-size: 1.8rem;
            pointer-events: none;
            z-index: 2000;
            animation: burstFly 1s ease-out forwards;
        }

        @keyframes burstFly {
            to {
                transform: translate(var(--dx), var(--dy)) rotate(720deg) scale(0.3);
                opacity: 0;
            }
        }

        .steam {
            position: fixed;
            font-size: 1.6rem;
            pointer-events: none;
            z-index: 500;
            animation: steamUp 1.3s ease-out forwards;
        }

        @keyframes steamUp {
            to { transform: translateY(-90px) scale(1.8); opacity: 0; }
        }

        .win-overlay {
            position: fixed;
            inset: 0;
            background: rgba(27, 94, 32, 0.85);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 3000;
        }

        .win-overlay.show { display: flex; }

        .win-card {
            background: white;
            border-radius: 30px;
            padding: 40px 50px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            margin: 0 20px;
            animation: cardPop 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes cardPop {
            from { transform: scale(0.4); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .win-card .big-emoji {
            font-size: 5rem;
            display: block;
            animation: bounce 1s ease infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-18px); }
        }

        .win-card h2 {
            font-family: 'Baloo 2', cursive;
            font-size: 2.1rem;
            color: #2E8B57;
            margin: 10px 0;
        }

        .win-card p {
            color: #666;
            font-weight: 700;
            font-size: 1.1rem;
            margin-bottom: 20px;
        }

        .play-again-btn {
            font-family: 'Baloo 2', cursive;
            font-size: 1.3rem;
            font-weight: 700;
            color: white;
            background: linear-gradient(135deg, #FF8F00, #FFC107);
            border: none;
            border-radius: 50px;
            padding: 14px 36px;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(255, 143, 0, 0.4);
            transition: transform 0.2s ease;
        }

        .play-again-btn:hover { transform: scale(1.06); }

        @media (max-height: 600px) {
            .title { margin-top: 56px; font-size: 1.3rem; }
            .traincar { width: 48px; height: 48px; font-size: 1.5rem; }
            .engine { font-size: 2.6rem; }
        }
    </style>
</head>

<body>
    <a href="index.html" class="home-btn">🏠 Home</a>
    <div class="score-board">🚂 <span id="score">0</span></div>

    <div class="game-container">
        <div class="sun"></div>
        <div class="hill hill1"></div>
        <div class="hill hill2"></div>
        <div class="bird" style="top: 90px; animation-delay: 0s;">🐦</div>
        <div class="bird" style="top: 130px; animation-delay: -9s;">🕊️</div>

        <h1 class="title">🚂 Pattern Train! 🌈</h1>
        <div class="prompt-bubble" id="prompt">What comes next in the pattern?</div>

        <div class="train-zone">
            <div class="train" id="train"></div>
            <div class="track"></div>
        </div>

        <div class="choices-label">Pick what goes in the yellow car! 👇</div>
        <div class="choices" id="choices"></div>
    </div>

    <div class="win-overlay" id="winOverlay">
        <div class="win-card">
            <span class="big-emoji">🎩</span>
            <h2>Pattern Conductor!</h2>
            <p>You finished 10 pattern trains! All aboard, genius!</p>
            <button class="play-again-btn" id="playAgainBtn">All Aboard Again! 🚂</button>
        </div>
    </div>

    <script>
        // Emoji sets used to build patterns
        const EMOJI_SETS = [
            ['🍎', '🍌', '🍇', '🍊'],
            ['🐶', '🐱', '🐰', '🐸'],
            ['❤️', '💛', '💙', '💚'],
            ['⚽', '🏀', '🎾', '🏈'],
            ['🌸', '🌻', '🌷', '🌼'],
            ['🚗', '🚌', '🚜', '🏎️'],
        ];

        // Pattern templates by difficulty (indices into a picked emoji subset)
        const EASY_PATTERNS = [
            [0, 1, 0, 1, 0, 1],          // AB AB AB
            [0, 0, 1, 0, 0, 1],          // AAB AAB
        ];
        const HARD_PATTERNS = [
            [0, 1, 1, 0, 1, 1],          // ABB ABB
            [0, 1, 2, 0, 1, 2],          // ABC ABC
            [0, 0, 1, 1, 0, 0, 1, 1],    // AABB AABB
        ];

        const ROUNDS_TO_WIN = 10;
        let score = 0;
        let answerEmoji = null;
        let locked = false;

        // ---------- Audio ----------
        let audioCtx = null;
        function getCtx() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            return audioCtx;
        }

        function tone(freq, dur, type = 'sine', vol = 0.15, when = 0) {
            const ctx = getCtx();
            const o = ctx.createOscillator();
            const g = ctx.createGain();
            o.connect(g); g.connect(ctx.destination);
            o.type = type;
            o.frequency.setValueAtTime(freq, ctx.currentTime + when);
            g.gain.setValueAtTime(vol, ctx.currentTime + when);
            g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + when + dur);
            o.start(ctx.currentTime + when);
            o.stop(ctx.currentTime + when + dur);
        }

        function playWhistle() {
            tone(880, 0.35, 'square', 0.06);
            tone(1100, 0.35, 'square', 0.06, 0.05);
            tone(880, 0.5, 'square', 0.06, 0.45);
            tone(1100, 0.5, 'square', 0.06, 0.5);
        }

        function playCorrect() {
            tone(523, 0.15); tone(659, 0.15, 'sine', 0.15, 0.12); tone(784, 0.3, 'sine', 0.15, 0.24);
        }

        function playWrong() {
            tone(220, 0.2, 'triangle', 0.1); tone(180, 0.25, 'triangle', 0.1, 0.15);
        }

        function playWin() {
            [523, 587, 659, 784, 880, 1047].forEach((f, i) => tone(f, 0.25, 'sine', 0.15, i * 0.13));
        }

        function say(text) {
            if (!window.speechSynthesis) return;
            speechSynthesis.cancel();
            const u = new SpeechSynthesisUtterance(text);
            u.rate = 0.9;
            u.pitch = 1.2;
            speechSynthesis.speak(u);
        }

        // ---------- Game ----------
        const trainEl = document.getElementById('train');
        const choicesEl = document.getElementById('choices');
        const scoreEl = document.getElementById('score');
        const promptEl = document.getElementById('prompt');

        function shuffle(arr) {
            const a = [...arr];
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        }

        function newRound() {
            locked = false;

            const set = shuffle(EMOJI_SETS[Math.floor(Math.random() * EMOJI_SETS.length)]);
            const templates = score < 4 ? EASY_PATTERNS : EASY_PATTERNS.concat(HARD_PATTERNS);
            const template = templates[Math.floor(Math.random() * templates.length)];

            const sequence = template.map(i => set[i]);
            answerEmoji = sequence[sequence.length - 1];
            const visible = sequence.slice(0, -1);

            // Build train: engine + visible cars + mystery car
            trainEl.innerHTML = '';
            const engine = document.createElement('div');
            engine.className = 'engine';
            engine.textContent = '🚂';
            trainEl.appendChild(engine);

            visible.forEach((e, i) => {
                const car = document.createElement('div');
                car.className = 'traincar';
                car.textContent = e;
                car.style.animationDelay = (i * 0.08) + 's';
                trainEl.appendChild(car);
            });

            const mystery = document.createElement('div');
            mystery.className = 'traincar mystery';
            mystery.id = 'mysteryCar';
            mystery.textContent = '❓';
            trainEl.appendChild(mystery);

            // Choices: right answer + 2 others from the same set
            const distractors = set.filter(e => e !== answerEmoji).slice(0, 2);
            choicesEl.innerHTML = '';
            shuffle([answerEmoji, ...distractors]).forEach(e => {
                const c = document.createElement('div');
                c.className = 'choice';
                c.textContent = e;
                c.addEventListener('pointerdown', () => pick(c, e));
                choicesEl.appendChild(c);
            });

            promptEl.textContent = 'What comes next in the pattern?';
            say('Look at the pattern! What comes next?');
        }

        function burst(x, y) {
            const emojis = ['⭐', '✨', '🎉', '🌈'];
            for (let i = 0; i < 10; i++) {
                const b = document.createElement('div');
                b.className = 'burst';
                b.textContent = emojis[i % emojis.length];
                b.style.left = x + 'px';
                b.style.top = y + 'px';
                const ang = (Math.PI * 2 * i) / 10;
                b.style.setProperty('--dx', Math.cos(ang) * (60 + Math.random() * 80) + 'px');
                b.style.setProperty('--dy', Math.sin(ang) * (60 + Math.random() * 80) + 'px');
                document.body.appendChild(b);
                setTimeout(() => b.remove(), 1100);
            }
        }

        function puffSteam() {
            const r = trainEl.getBoundingClientRect();
            for (let i = 0; i < 4; i++) {
                const s = document.createElement('div');
                s.className = 'steam';
                s.textContent = '💨';
                s.style.left = (r.left + 20 + i * 14) + 'px';
                s.style.top = (r.top - 8) + 'px';
                s.style.animationDelay = (i * 0.12) + 's';
                document.body.appendChild(s);
                setTimeout(() => s.remove(), 1600);
            }
        }

        function pick(el, emoji) {
            if (locked) return;
            if (emoji === answerEmoji) {
                locked = true;
                score++;
                scoreEl.textContent = score;
                playCorrect();

                const mystery = document.getElementById('mysteryCar');
                mystery.textContent = emoji;
                mystery.classList.remove('mystery');
                mystery.classList.add('filled');

                trainEl.classList.add('chug');
                playWhistle();
                puffSteam();

                const r = el.getBoundingClientRect();
                burst(r.left + r.width / 2, r.top + r.height / 2);
                promptEl.textContent = 'Choo choo! You got it! 🎉';
                say('Choo choo! You got it!');

                setTimeout(() => {
                    trainEl.classList.remove('chug');
                    if (score >= ROUNDS_TO_WIN) {
                        playWin();
                        document.getElementById('winOverlay').classList.add('show');
                        say('Amazing! You are a pattern conductor!');
                    } else {
                        newRound();
                    }
                }, 1600);
            } else {
                playWrong();
                el.classList.add('wrong');
                say('Not quite! Look at the pattern again!');
                setTimeout(() => el.classList.remove('wrong'), 600);
            }
        }

        document.getElementById('playAgainBtn').addEventListener('click', () => {
            score = 0;
            scoreEl.textContent = 0;
            document.getElementById('winOverlay').classList.remove('show');
            newRound();
        });

        newRound();
    </script>
</body>

</html>
